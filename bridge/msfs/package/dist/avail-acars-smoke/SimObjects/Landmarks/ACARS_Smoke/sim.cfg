; ACARS Smoke (T34): a stationary, invisible marker that carries one smoke effect. The bridge creates it
; with SimConnect_AICreateSimulatedObject("ACARS Smoke", ...) at the runway of a burning airport.
; Legacy (non-modular) SimObject in the form of the MSFS 2024 SDK sample "Windsock"
; (Samples\DevmodeProjects\SimObjects\Landmarks): sim.cfg, category StaticObject. The first draft was an
; aircraft.cfg container: MSFS listed it in the SimObject Spawner but did not create it (2026-10-16).

[fltsim.0]
title=ACARS Smoke
model=
texture=

[General]
category=StaticObject
; Beyond this distance (m) MSFS stops animating the object (SDK sample Windsock: 2000). The smoke must play while the
; aircraft is still far out (the bridge spawns it at 40 NM), so the same reach as MaxDistanceEmission of the effect.
DistanceToNotAnimate=80000
