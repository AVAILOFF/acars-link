# Пример базового сценария (формат — docs/05-scenario-engine.md)
id: prelim_loadsheet
version: 1
category: docs
title: Preliminary loadsheet
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -25 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
probability: 1
cooldown: per_flight
steps:
  - set:
      # небольшая рандомизация загрузки, как в оригинале, но через seeded Rng
      flight.pax_delta: "{rand:-5-5}"
      flight.cargo_delta_kg: "{rand:-200-200}"
  - send:
      header: "PRELIMINARY LOADSHEET"
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest} {flight.date|ddmmm}
        A/C {ofp.ac_reg} {ofp.ac_icao}
        ZFW   {calc.zfw_kg|kg1}  MAX {ofp.max_zfw_kg|kg1}
        TOF   {ofp.fuel_takeoff_kg|kg1}
        TOW   {calc.tow_kg|kg1}  MAX {ofp.max_tow_kg|kg1}
        PAX   {calc.pax_total}
        UNDERLOAD {calc.underload_kg|kg1}
      footer: "PREPARED BY {name:ops}"
