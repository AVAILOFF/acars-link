# Windows installer (T19, build only: no code signing, no auto-update; decision 2026-10-22: unsigned).
# `pnpm desktop:dist` builds out/ and the bridge first; see CLAUDE.md, «Команды».
appId: local.acars.link
productName: ACARS Link
directories:
  output: release
  # icon.ico / icon.png from design/logo (`pnpm icon`).
  buildResources: build
# The main process bundles the workspace packages and scenarios (electron.vite.config.ts),
# so the app needs no node_modules.
files:
  - out/**
  - package.json
npmRebuild: false
extraResources:
  # Self-contained bridge from `pnpm bridge:publish`; the app starts it (src/main/bridge-process.ts).
  - from: ../../bridge/msfs/publish
    to: bridge
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  # Generated by `pnpm licenses` (tools/licenses/collect.mjs).
  - from: build/third-party-licenses.txt
    to: THIRD-PARTY-LICENSES.txt
  - from: ../../LICENSE
    to: LICENSE.txt
# Electron fuses (T62), flipped in the packed exe: no Node mode, NODE_OPTIONS or --inspect, and
# only an app.asar whose header hash electron-builder embedded is loaded (Windows: Electron 30+).
# The bridge in resources/bridge is outside the asar and not covered.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # EULA shown by the installer (T19); bilingual, UTF-8 with BOM.
  license: build/license.txt
  artifactName: ACARS-Link-Setup-${version}.exe
