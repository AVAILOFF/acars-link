# Windows installer (T19, build only: no code signing, no auto-update).
# `pnpm desktop:dist` builds out/ and the bridge first; see CLAUDE.md, «Команды».
appId: local.acars.link
productName: ACARS Link
directories:
  output: release
  # icon.ico / icon.png from design/logo (`pnpm icon`).
  buildResources: build
# The main process bundles the workspace packages and scenarios (electron.vite.config.ts),
# so the app needs no node_modules.
files:
  - out/**
  - package.json
npmRebuild: false
extraResources:
  # Self-contained bridge from `pnpm bridge:publish`; the app starts it (src/main/bridge-process.ts).
  - from: ../../bridge/msfs/publish
    to: bridge
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ACARS-Link-Setup-${version}.exe
