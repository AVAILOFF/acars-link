# German UI texts of the scenarios (T86/T87): machine translation by `pnpm i18n translate`
# (tools/i18n), not yet checked by a native speaker. Hand edits are kept on the next run. Telexes are never translated.
aircraft_change:
  title: Flugzeugwechsel
  description: Flugzeugwechsel für die nächste Etappe.
  hint: "Die Flugbetriebsleitung (OPS) teilt mit, dass der nächste Flugabschnitt mit einem anderen Flugzeug durchgeführt wird: Dieses Flugzeug wird nach der Ankunft in die Wartung gebracht, und die Besatzung wechselt das Flugzeug. Eine Antwort ist nicht erforderlich."
airshow_dest:
  title: Flugshow am Zielflughafen
  description: Eine Flugshow im Umkreis von 50 km um den Zielflughafen am Tag der Ankunft (Referenzliste von offiziellen Websites).
  hint: "OPS-Informationen: Eine Flugshow am Zielflughafen oder in dessen Nähe am Tag Ihres Fluges. Rechnen Sie mit Flugvorführungenbeschränkungen und hohem Flugverkehr und überprüfen Sie die NOTAMs. Eine Antwort ist nicht erforderlich."
altn_wx_deterioration:
  title: Das Wetter am Ausweichflughafen verschlechtert sich
  description: "Vor dem TOD verschlechtert sich das Wetter am Ausweichflughafen. OK (Standard) oder LOW: der nächstgelegene Flughafen und dessen Entfernung."
  hint: "Dispatch: Das Wetter an Ihrem Ausweichflughafen verschlechtert sich (der Grund ist in der Nachricht angegeben). Ziehen Sie einen Ausweichflughafen auf der Strecke oder mehr Kraftstoff in Betracht und teilen Sie der Flugleitung Ihren Kraftstoffstand mit."
  steps:
    reply:
      reply_hints:
        OK: Ihr Kraftstoff reicht für die aktuelle Situation aus.
        LOW: Ihr Kraftstoffstand ist für die aktuelle Situation zu niedrig.
    ok:
      hint: Die Flugleitung stellt fest, dass Ihr Kraftstoffvorrat ausreichend ist, und beobachtet weiterhin das Wetter am Ausweichflughafen; eine Aktualisierung erfolgt vor Beginn des Sinkflugs. Keine Antwort erforderlich.
    met:
      hint: Aktualisierung der Wetterlage am Ausweichflughafen durch die Dispatch-Zentrale vor Beginn des Sinkflugs. Teilen Sie der Dispatch-Zentrale per Freitext-Telex mit, falls Ihr Kraftstoff Maßnahmen erfordert.
    timeout:
      hint: Aktualisierung der Wetterlage am Ausweichflughafen durch die Einsatzleitung vor Beginn des Sinkflugs. Teilen Sie der Einsatzleitung per Freitext-Telex mit, falls Ihr Kraftstoff Maßnahmen erfordert.
    low:
      hint: Dispatch teilt Ihnen den nächstgelegenen Ausweichflughafen und dessen Entfernung von Ihrer aktuellen Position mit. Melden Sie gegebenenfalls die Mindestmenge an Kraftstoff an die Flugsicherung (ATC). Keine Antwort erforderlich.
arrival_info:
  title: Ankunftsinformationen
  description: Gate, Gepäckband, Umsteigepassagiere und Bodenunterstützung während des Landeanflugs.
  hint: "Ankunftsinformationen von OPS für den Zielflughafen: das Gate oder die Parkposition, das Gepäckband, die Anzahl der Passagiere, die auf andere Flüge umsteigen, sowie die geplante Bodenabfertigung. Keine Antwort erforderlich."
atc_flow_delay:
  title: Verspätung durch ATC-Flusssteuerung
  description: Kurz vor dem Abflug verschiebt sich die zuvor angegebene CTOT-Zeit (slot_ctot) aufgrund der Verkehrsflusssteuerung nach hinten.
  hint: "Das ATC-Flussmanagement (ATFM) hat Ihren Slot nach hinten verschoben: der Grund, der alte und der neue CTOT sowie die zusätzliche Verspätung. Planen Sie das Starten und den Pushback entsprechend dem neuen CTOT. Eine Antwort ist nicht erforderlich."
atis_update:
  title: ATIS-Meldung für den Zielflughafen geändert
  description: "Während des Sinkflugs hat sich der VATSIM-ATIS-Buchstabe des Zielflughafens geändert: der neue Buchstabe und der METAR."
  hint: Der ATIS des Zielflughafens (VATSIM) enthält einen neuen Informationsbrief, der den vorherigen ersetzt; darin ist der aktuelle METAR enthalten. Verwenden Sie den neuen Brief beim ersten Kontakt mit der Anflugkontrolle. Eine Antwort ist nicht erforderlich.
aurora_on_route:
  title: Aurora auf der Flugroute
  description: Wahrscheinlichkeit von 30 % oder mehr für eine Aurora an einem Punkt der Flugroute innerhalb der nächsten Stunde, nachts (NOAA OVATION).
  hint: "OPS-Informationen: Die NOAA-Vorhersage gibt eine Wahrscheinlichkeit für Polarlichter (Nord- oder Südlichter) entlang Ihrer Flugroute an; die Nachricht gibt an, wo und wann. Die Besatzung kann die Passagiere darüber informieren. Eine Antwort ist nicht erforderlich."
aviation_history:
  title: An diesem Tag in der Geschichte der Luftfahrt
  description: Eine Tatsache aus der Luftfahrtgeschichte mit dem heutigen Datum (Quellenverzeichnis).
  hint: "OPS-Informationen: Ein Ereignis aus der Luftfahrtgeschichte, das an diesem Tag stattfand. Keine Antwort erforderlich."
block_report:
  title: Blockzeiten (OOOI)
  description: Blockzeiten und Codes für Verspätungen nach dem Einparken.
  hint: "Blockbericht nach dem Parken: OUT-, OFF-, ON- und IN-Zeiten (Off-Block, Start, Landung, On-Block), Block- und Flugzeit sowie Kraftstoff an Bord; nach einer Verspätung zusätzlich die IATA-Verspätungscodes für die Ursachen. Für die Unterlagen der Airline; keine Antwort erforderlich."
cargo_act_failure:
  title: Ausfall eines Temperaturcontainers (Fracht)
  description: "Vor dem Abflug eines Frachtfluges: Ein aktiver temperaturgeregelter Container mit Arzneimitteln fällt aus und wird ersetzt, wodurch es zu einer Verspätung von 15–30 Minuten kommt."
  hint: "Frachtkontrolle: Ein aktiver temperaturgeregelter Container (ACT) mit Arzneimitteln hat vor der Verladung eine Störung gemeldet. Er wird ersetzt, wodurch es zu einer Verspätung beim Abflug um die angegebenen Minuten kommt. Eine Antwort ist nicht erforderlich."
cargo_final_loadsheet:
  title: Endgültiger Loadsheet (Fracht)
  description: Endgültiges Loadsheet eines Frachtfluges mit einer kurzfristigen Änderung der Fracht.
  hint: "Endgültige Loadsheet der Ladungskontrolle für einen Frachtflug: Ist-Gewichte im Vergleich zu den Grenzwerten (ZFW, TOW, LAW), Start- und Flugkraftstoff (TOF, TIF) sowie die Fracht; LMC bezeichnet die kurzfristige Änderung der Fracht gegenüber der vorläufigen Loadsheet. Bitte überprüfen Sie die Angaben und übernehmen Sie diese in das FMS; eine Rückmeldung ist nicht erforderlich."
cargo_late_truck:
  title: Verspäteter Lkw (Fracht)
  description: "Vor dem Abflug eines Frachtfluges: Ein Lkw mit geplanter Fracht ist verspätet; die Frachtannahmefrist wird verlängert und der Abflug um 10–30 Minuten verzögert."
  hint: "Frachtkontrolle: Ein Lkw mit für Ihren Flug gebuchter Fracht ist verspätet, daher wird die Frachtannahmefrist verlängert und der Abflug um die angegebenen Minuten verzögert. Planen Sie entsprechend. Eine Antwort ist nicht erforderlich."
cargo_notoc:
  title: Gefahrgut (NOTOC, Fracht)
  description: "Vor dem Abflug eines Frachtfluges: Gefahrgut an Bord, teilweise nur für Frachtflugzeuge zugelassen (CAO YES). Antworten Sie mit ACK als Unterschrift des Kapitäns."
  hint: "NOTOC (Mitteilung an den Kapitän) eines Frachtfluges: die verladenen Gefahrgüter mit UN-Nummer, Klasse, Code für die Abfertigung, Position im Frachtraum und Anzahl der Versandstücke; „CAO YES“ kennzeichnet Güter, die ausschließlich in Frachtflugzeugen befördert werden dürfen. Bestätigen Sie mit „ACK“, was als Unterschrift des Kapitäns gilt."
  steps:
    reply:
      reply_hints:
        ACK: Sie haben das NOTOC gelesen; dies gilt als Ihre Unterschrift.
    notoc:
      hint: "Die Frachtkontrolle hat Ihre Bestätigung erhalten: Eine Kopie wird in die Flugakte aufgenommen, und der Verladeleiter ist informiert. Eine Antwort ist nicht erforderlich."
cargo_prelim_loadsheet:
  title: Vorläufiges Loadsheet (Fracht)
  description: "Vorläufiges Loadsheet eines Frachtfluges: geplante Werte aus dem OFP, Fracht ohne Passagiere."
  hint: "Vorläufiges Loadsheet der Ladungskontrolle für einen Frachtflug: die geplanten Gewichte und Mengen an Kraftstoff aus dem Flugplan (ZFW, TOF, TOW, TIF, LAW im Vergleich zu den Höchstwerten) sowie die Fracht. Verwenden Sie es zur Vorbereitung des FMS; die endgültigen Zahlen finden Sie im endgültigen Loadsheet. Eine Antwort ist nicht erforderlich."
cargo_sort_shift:
  title: Verschiebung der Hub-Sortierung (Fracht)
  description: "Während des Reiseflugs eines Frachtfluges: Die Sortierung am Zielflughafen beginnt später, es besteht kein Grund zur Eile."
  hint: "Frachtkontrolle: Die Sortierung der Fracht am Zielflughafen beginnt später als geplant, und zwar um die angegebenen Minuten, daher besteht kein Grund zur Eile. Zur Information; keine Antwort erforderlich."
cargo_special_load:
  title: Sonderfracht (Fracht)
  description: "Vor dem Abflug eines Frachtfluges: Sonderfracht an Bord (lebende Tiere, verderbliche Güter, Arzneimittel, menschliche Überreste oder Wertgegenstände) mit dem entsprechenden Code für die Abfertigung. Antworten Sie mit „ACK“."
  hint: "Meldung über Sonderfracht von der Frachtkontrolle: Eine Sendung, die während des Fluges oder bei der Ankunft besonderer Sorgfalt bedarf, mit Angabe des IATA-Codes für die Abfertigung, der Position im Frachtraum und der erforderlichen Bedingungen (Temperatur, vorrangige Entladung). Bestätigen Sie mit ACK."
  steps:
    reply:
      reply_hints:
        ACK: Sie sind über die Sonderfracht informiert.
    ack:
      hint: Die Frachtkontrolle hat Ihre Bestätigung erhalten und die Abfertigung am Zielflughafen informiert. Eine Antwort ist nicht erforderlich.
cargo_uld_damaged:
  title: Beschädigtes ULD (Fracht)
  description: "Vor dem Abflug eines Frachtfluges: Ein beschädigtes ULD wird ersetzt und ein Teil seiner Fracht ausgeladen; im endgültigen Loadsheet wird derselbe Fracht-LMC ausgewiesen."
  hint: "Ladungskontrolle: Eine Ladeeinheit (Container oder Palette) wurde beim Verladen als beschädigt festgestellt. Die Fracht wurde auf eine andere Einheit umgeladen, und der Teil, der nicht passte, bleibt zurück; das endgültige Loadsheet wird diese Änderung ausweisen. Keine Antwort erforderlich."
cargo_weight_error:
  title: Gewichtskorrektur (Fracht)
  description: "Vor dem Abflug eines Frachtfluges: Ein ULD wird erneut gewogen und ist schwerer als gebucht; das endgültige Loadsheet weist denselben Fracht-LMC aus."
  hint: "Ladungskontrolle: Eine Einheit wurde erneut gewogen und ist schwerer als in der Buchung angegeben. Die Differenz ist eine kurzfristige Änderung (LMC) und wird im endgültigen Loadsheet aufgeführt. Eine Antwort ist nicht erforderlich."
charter_group_lmc:
  title: Änderung bei der Reisegruppe (Charter)
  description: "Vor dem Abflug eines Charterfluges: Passagiere der Reisegruppe erscheinen nicht oder eine verspätete Gruppe wird hinzugefügt; das endgültige Loadsheet weist dieselbe Passagier-LMC aus."
  hint: "Charterabfertigung: Der Reiseveranstalter meldet eine Änderung in seiner Gruppe, d. h. Passagiere, die nicht erschienen sind, oder verspätet hinzugekommene Passagiere. Die Zahl entspricht der Last-Minute-Änderung (LMC), die im endgültigen Loadsheet ausgewiesen wird. Eine Antwort ist nicht erforderlich."
  steps:
    no_show:
      hint: "Charterabfertigung: Passagiere der Reisegruppe sind nicht erschienen; ihr Gepäck wird ausgeladen, und die Änderung wird in dem endgültigen Loadsheet ausgewiesen. Eine Antwort ist nicht erforderlich."
    added:
      hint: "Charter-Abfertigung: Ein verspäteter Teil der Reisegruppe wurde akzeptiert; deren Gepäck wurde verladen, und die Änderung wird im endgültigen Loadsheet ausgewiesen. Keine Antwort erforderlich."
charter_sports_team:
  title: Sportmannschaft (Charter)
  description: "Vor dem Abflug eines Charterfluges: Eine Sportmannschaft an Bord mit übergroßer Sportausrüstung im Frachtraum und vom Charterer bestelltem Spezialcatering."
  hint: "Charterabfertigung: Eine Sportmannschaft fliegt mit Ihnen. Ihre übergroße Ausrüstung wurde in den zugewiesenen Frachtraum verladen, und der Charterer hat eine eigene Verpflegung bestellt. Keine Antwort erforderlich."
charter_tour_rep:
  title: Vertreter des Reiseveranstalters (Charter)
  description: "Vor dem Abflug eines Charterfluges: Der Vertreter des Reiseveranstalters hat die Gruppe eingecheckt und bittet um eine kurze Begrüßung über die PA-Anlage."
  hint: "Charter-Abfertigung: Der Vertreter des Reiseveranstalters befindet sich am Gate, der Check-in der Gruppe ist abgeschlossen, und der Vertreter wünscht nach dem Einsteigen eine kurze Begrüßung über die Lautsprecheranlage. Eine Antwort ist nicht erforderlich."
charter_transfer:
  title: Transfer am Zielflughafen (Charter)
  description: "Vor der TOD-Zeit bei einem Charterflug: Die Transferbusse für die Passagiere warten am Zielflughafen, ein Vertreter des Reiseveranstalters empfängt sie."
  hint: "Charter-Abfertigung am Zielflughafen: Die Reisebusse des Reiseveranstalters warten auf Ihre Passagiere, und ein Vertreter empfängt sie in der Halle der Ankunft. Nützlich für die Durchsage an Bord. Keine Antwort erforderlich."
charter_vip:
  title: VIP-Charter
  description: "Vor dem Abflug eines Charterfluges: Eine VIP-Gruppe erreicht mit dem Auto das Flugzeug und steigt als Letzte ein; das Catering erfolgt nach deren Wunsch."
  hint: "Charterabfertigung: Es handelt sich um einen VIP-Charter. Die Gruppe kommt mit dem Auto zum Flugzeug und steigt als Letzte ein; das Catering erfolgt nach deren Wunsch. Eine Antwort ist nicht erforderlich."
cmd_delay:
  title: "Pilotenbefehl: „DELAY“"
  description: "DELAY-Befehl: bestätigt die neue Abfahrtszeit."
  hint: "OPS bestätigt Ihre DELAY-Meldung: die Minutenangabe und den von Ihnen angegebenen Grund, die neue voraussichtliche Abfahrtszeit (EOBT) sowie die Gesamtverspätung des Fluges. Eine Antwort ist nicht erforderlich."
cmd_divert:
  title: "Pilotenbefehl: DIVERT"
  description: "Befehl „DIVERT“: Bestätigt die Ausweichlandung."
  hint: OPS bestätigt Ihre DIVERT-Meldung und hat die Abfertigung am Flughafen der Ausweichlandung informiert. Es bittet um Angabe des Grundes, um die dort erforderlichen Vorkehrungen zu treffen.
  steps:
    reply:
      reply_hints:
        WX: Wetter am Zielflughafen.
        TECH: Ein technisches Problem mit dem Flugzeug.
        MEDICAL: Ein medizinischer Notfall an Bord.
        FUEL: Nicht genügend Kraftstoff, um zum Zielflughafen weiterzufliegen.
        OTHER: Sonstige Gründe.
    medical:
      hint: Die OPS-Abteilung hat am Flughafen der Ausweichlandung ein medizinisches Team angefordert und bittet Sie, die Passagierdaten per Freitext-Telex zu übermitteln, sobald dies möglich ist.
    tech:
      hint: Die Abteilung der Wartung ist informiert, und ein Techniker wird Sie am Flughafen der Ausweichlandung in Empfang nehmen. Senden Sie eine kurze Beschreibung des Fehlers per Freitext-Telex.
    fuel:
      hint: OPS hat für Sie am Flughafen der Ausweichlandung Kraftstoff bestellt. Eine Antwort ist nicht erforderlich.
    wx:
      hint: OPS hat eine wetterbedingte Ausweichlandung vermerkt und bucht die Passagiere um. Eine Antwort ist nicht erforderlich.
    msg:
      hint: Die Parkposition am Flughafen bei der Ausweichlandung ist noch nicht bekannt. Senden Sie Ihre voraussichtliche Ankunftszeit (ETA) dort per Freitext-Telex, sobald dies möglich ist.
cmd_divert_eta:
  title: "Pilotenbefehl: „DIVERT“, Entfernung und ETA"
  description: "Nach „DIVERT“ zu einem Flughafen des Flugplans: Entfernung von der aktuellen Position und ETA bei der aktuellen Bodengeschwindigkeit."
  hint: Entfernung von Ihrer aktuellen Position zum von Ihnen genannten Ausweichlandungsflughafen und die dortige ETA bei Ihrer aktuellen Bodengeschwindigkeit. Keine Antwort erforderlich.
cmd_eta:
  title: "Pilotenbefehl: „ETA“"
  description: ETA-Befehl während des Fluges, basierend auf den geplanten Zeiten.
  hint: "Antwort auf ETA: die voraussichtliche Ankunftszeit gemäß Flugplan (STA), Ihr Gate oder Parkposition sowie die Umsteigepassagiere, über die OPS die Anschlussflüge informiert hat. Keine Antwort erforderlich."
cmd_eta_ground:
  title: "Pilotenbefehl: „ETA“, vor dem Start"
  description: ETA-Befehl vor dem Start.
  hint: "Antwort auf ETA vor dem Abflug: die voraussichtlichen Abfahrtszeiten vom Block (EOBT) und Ankunftszeiten am Block (EST IN) im Vergleich zum Flugplan (STA) sowie die Umsteigepassagiere. Keine Antwort erforderlich."
cmd_eta_gs:
  title: "Pilotenbefehl: „ETA“, basierend auf der Bodengeschwindigkeit"
  description: ETA-Befehl anhand der Bodengeschwindigkeit und der verbleibenden Entfernung.
  hint: "Antwort auf ETA während des Fluges: die Ankunftszeit, berechnet aus Ihrer Bodengeschwindigkeit und der verbleibenden Entfernung, im Vergleich zum Flugplan (STA), mit Angabe Ihres Gates oder Ihrer Parkposition sowie der Umsteigepassagiere, die OPS den Anschlussflügen gemeldet hat. Keine Antwort erforderlich."
cmd_gate_change:
  title: "Pilotenbefehl: „REQ GATE CHANGE“"
  description: "REQ GATE CHANGE [Gate] [Grund] vor dem Block: OPS stimmt zu (70 %, das angefragte Gate, sofern es sich um einen bekanntermaßen freien Stand handelt) oder teilt mit, dass alle Gates belegt sind. In den Informationen zur Ankunft wird dann das neue Gate genannt."
  hint: "OPS antwortet auf Ihre REQ GATE CHANGE: das neue Gate, wenn die Änderung genehmigt ist, oder warum dies nicht möglich ist und welches Gate Sie behalten. Eine Antwort ist nicht erforderlich."
cmd_gate_change_none:
  title: "Pilotenbefehl: „REQ GATE CHANGE“, keine Gate-Daten"
  description: REQ GATE CHANGE, wenn noch kein Gate bekannt ist, kein anderes Gate zur Verfügung steht oder der Flug umgeleitet wird.
  hint: "OPS kann das Gate derzeit nicht ändern: Es ist noch kein Gate bekannt, es gibt kein anderes Gate oder Sie werden umgeleitet. Die Nachricht gibt wieder, was OPS über Ihr Gate weiß. Eine Antwort ist nicht erforderlich."
cmd_help:
  title: "Pilotenbefehl: „HELP“"
  description: "HELP-Befehl: die Liste der Pilotenbefehle."
  hint: Freitext wird als Telex an OPS gesendet; HELP gibt die Liste der Befehle zurück, die OPS versteht. Senden Sie einen Befehl als Telex an die Airline-Station; ATC-LOGON und die Abflug-Freigabe (DCL) gehen an die XATC-Stationen (X + FIR, X + Abflughafen).
cmd_medical:
  title: "Pilotenbefehl: „MEDICAL“"
  description: "MEDICAL <TEXT> während des Fluges: Die Besatzung meldet einen medizinischen Notfall. OPS fragt nach „CONTINUE“ oder „DIVERT“ (Standard: „CONTINUE“ nach 10 Minuten); bei „DIVERT“ erfolgt die Umleitung zum nächstgelegenen Flughafen unter den Ausgangs- und Ausweichflughäfen; Rettungssanitäter erwarten das Flugzeug."
  hint: OPS hat Ihren medizinischen Bericht erhalten und MedLink informiert, die Ärzte am Boden, die die Besatzungen während des Fluges beraten. Es fragt, ob Sie zum Zielflughafen weiterfliegen oder umleiten.
  steps:
    reply:
      reply_hints:
        CONTINUE: Fliegen Sie weiter zum Zielflughafen.
        DIVERT: Umleitung; Sie können die ICAO-Kennung des Flughafens hinter dem Wort (DIVERT EDDM) angeben.
    divert:
      hint: OPS bestätigt die Ausweichlandung und hat dort einen Krankenwagen sowie die Abfertigung angeordnet. Senden Sie Ihre neue ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    divert_2:
      hint: Rettungssanitäter warten an der Flugzeugtür; der Patient verlässt das Flugzeug vor den anderen Passagieren. Keine Antwort erforderlich.
    continue:
      hint: OPS nimmt zur Kenntnis, dass Sie den Flug zum Zielflughafen fortsetzen, und bittet Sie, bei ATC Vorrang zu beantragen. Keine Antwort erforderlich.
    continue_2:
      hint: Rettungssanitäter warten an der Flugzeugtür; der Patient verlässt das Flugzeug vor den anderen Passagieren. Keine Antwort erforderlich.
cmd_rdy:
  title: "Pilotenbefehl: „RDY“"
  description: "RDY mit einem zugewiesenen CTOT vor dem Verlassen des Standplatzes: READY MSG SENT; anschließend (40 %) ein früherer CTOT oder NO IMPROVEMENT."
  hint: "OPS hat Ihre Bereitschaftsnachricht (RDY: Die Besatzung kann früher als zum Slot starten) an das ATC-Flow-Management gesendet. Planen Sie weiterhin mit dem aktuellen CTOT, bis eine Aktualisierung vorliegt. Eine Antwort ist nicht erforderlich."
  steps:
    met:
      hint: "Antwort auf Ihre „Ready“-Nachricht: Das Verkehrsflussmanagement hat einen früheren Slot zugewiesen. Planen Sie den Start zum neuen „CTOT“. Keine Antwort erforderlich."
    timeout:
      hint: "Antwort auf Ihre „Ready“-Nachricht: Es ist kein früherer Slot frei, der CTOT bleibt bestehen. Keine Antwort erforderlich."
cmd_rdy_none:
  title: "Pilotenbefehl: „RDY“, kein Slot"
  description: RDY ohne CTOT oder zu früh/zu spät für eine Bereitschaftsnachricht (von EOBT-15-15 Minuten bis CTOT abzüglich Rollzeit).
  hint: "OPS kann derzeit keine Bereitschaftsnachricht senden: Der Flug hat keinen Slot (CTOT), oder es ist zu früh oder zu spät dafür. Senden Sie RDY, sobald Sie kurz vor dem EOBT bereit sind. Eine Antwort ist nicht erforderlich."
cmd_req_atis:
  title: "Pilotenbefehl: „REQ ATIS“"
  description: "REQ ATIS [ICAO]: Der Text des Online-VATSIM-ATIS des Flughafens (Zielflughafen ohne ICAO). Ohne Online-ATIS: NO ATIS AVBL und der METAR."
  hint: "REQ ATIS <ICAO> fordert das ATIS eines Zielflughafens an (leer: das Ziel). Die Antwort ist der Text des Online-ATIS auf VATSIM mit seinem Informationsbrief. Eine Antwort ist nicht erforderlich."
cmd_req_atis_none:
  title: "Pilotenbefehl: „REQ ATIS“, kein ATIS"
  description: "REQ ATIS, wenn kein ATIS online ist: NO ATIS AVBL und der aktuellste METAR."
  hint: "Antwort auf „REQ ATIS“: Es ist kein ATIS dieses Flughafens auf VATSIM online, daher sendet OPS stattdessen den aktuellen METAR. Keine Antwort erforderlich."
cmd_req_gate:
  title: "Pilotenbefehl: „REQ GATE“"
  description: "Befehl „REQ GATE“: das Gate der Ankunft."
  hint: REQ GATE fragt bei OPS nach Ihrem Ankunftsgate. Die Antwort enthält das am Zielflughafen erwartete Gate oder die Parkposition, das Gepäckband und die STA. Eine Antwort ist nicht erforderlich.
cmd_req_gate_divert:
  title: "Pilotenbefehl: „REQ GATE“, Umleitung"
  description: „REQ GATE“-Befehl während der Umleitung.
  hint: "Antwort auf „REQ GATE“ während der Ausweichlandung: Die Parkposition am Ausweichflughafen ist noch nicht bekannt; die örtliche Abfertigung wird sie mitteilen. Keine Antwort erforderlich."
cmd_req_loadsheet:
  title: "Pilotenbefehl: „REQ LOADSHEET“"
  description: "Befehl „REQ LOADSHEET“: Wiederholt das Loadsheet."
  hint: "REQ LOADSHEET: Fordert OPS auf, das Loadsheet erneut zu senden. Die Antwort wiederholt das aktuellste Loadsheet dieses Fluges, sei es vorläufig oder endgültig. Eine Antwort ist nicht erforderlich."
cmd_req_loadsheet_cargo:
  title: "Pilotenbefehl: „REQ LOADSHEET“ (Fracht)"
  description: "Befehl „REQ LOADSHEET“ bei einem Frachtflug: Wiederholt das FrachtLoadsheet."
  hint: „REQ LOADSHEET“ fordert die Ladungskontrolle auf, das Loadsheet erneut zu senden. Die Antwort wiederholt das aktuellste Loadsheet dieses Frachtfluges, sei es vorläufig oder endgültig. Eine Antwort ist nicht erforderlich.
cmd_req_loadsheet_ferry:
  title: "Pilotenbefehl: „REQ LOADSHEET“ (Überführungsflug)"
  description: "Befehl „REQ LOADSHEET“ bei einem Überführungsflug: Wiederholt das ausschließlich für die Besatzung bestimmte Loadsheet."
  hint: „REQ LOADSHEET“ fordert die Ladungskontrolle auf, das Loadsheet erneut zu senden. Die Antwort wiederholt das ausschließlich für die Besatzung bestimmte Loadsheet dieses Überführungsflugs. Eine Antwort ist nicht erforderlich.
cmd_req_loadsheet_ferry_none:
  title: "Pilotenbefehl: „REQ LOADSHEET“, noch keine vorliegend (Überführungsflug)"
  description: Befehl „REQ LOADSHEET“ bei einem Überführungsflug, bevor das Loadsheet vorliegt.
  hint: "Antwort auf „REQ LOADSHEET“ bei einem Überführungsflug: Das Loadsheet wurde noch nicht ausgestellt; in der Nachricht wird angegeben, wann es eintrifft. Keine Antwort erforderlich."
cmd_req_loadsheet_none:
  title: "Pilotenbefehl: „REQ LOADSHEET“, noch keine vorhanden"
  description: Befehl „REQ LOADSHEET“, bevor ein Loadsheet vorliegt.
  hint: "Antwort auf „REQ LOADSHEET“: Für diesen Flug wurde noch kein Loadsheet ausgestellt; in der Nachricht wird mitgeteilt, wann der vorläufige Loadsheet eintrifft. Keine Antwort erforderlich."
cmd_req_wx:
  title: "Pilotenbefehl: „REQ WX“"
  description: "REQ WX-Befehl: Wetterangaben aus dem OFP-METAR."
  hint: "REQ WX <ICAO> fragt OPS nach dem Wetter eines Flughafens (leer: der Zielflughafen). Diese Antwort enthält den METAR aus dem Flugplan. Keine Antwort erforderlich."
cmd_req_wx_live:
  title: "Pilotenbefehl: „REQ WX“ (live)"
  description: REQ WX-Befehl mit aktuellen Wetterdaten.
  hint: "REQ WX <ICAO> fragt OPS nach dem Wetter eines Flughafens (leer: das Zielflughafen). Diese Antwort enthält den aktuellen METAR und TAF. Keine Antwort erforderlich."
cmd_req_wx_no_data:
  title: "Pilotenbefehl: „REQ WX“, keine Daten"
  description: REQ WX-Befehl, wenn kein Wetter für den Flughafen vorhanden ist.
  hint: "Antwort auf „REQ WX“: OPS verfügt über keine Wetterdaten für diesen Flughafen. Überprüfen Sie den ICAO-Code oder fragen Sie später erneut nach. Eine Antwort ist nicht erforderlich."
connection_held:
  title: Anschlussflug zurückgehalten
  description: "Auf Halteposition nach einem kurzen Anschlussflug mit einer verbleibenden Zeit von 15 bis 40 Minuten: Der Anschlussflug wird für die Passagiere aufgehalten."
  hint: "Anschlussflüge: Der Anschlussflug Ihrer Transferpassagiere wird für diese zurückgehalten und wird verspätet abfliegen. Ein Transferbus wartet an Ihrem Gate; lassen Sie die Transferpassagiere zuerst aussteigen. Keine Antwort erforderlich."
connection_made:
  title: Anschlussflug hergestellt
  description: "Auf Wartung nach einem kurzen Anschlussflug mit einer verbleibenden Zeit von 40 Minuten oder mehr: Der Anschlussflug wartet."
  hint: "Anschlüsse: Der Anschlussflug Ihrer Umsteigepassagiere wird auf sie warten; ein Transferbus steht an Ihrem Gate bereit. Keine Antwort erforderlich."
connection_missed:
  title: Verpasster Anschluss
  description: "Auf Halteposition nach einem kurzen Anschlussflug mit weniger als 15 Minuten verbleibender Zeit: Passagiere wurden umgebucht."
  hint: "Anschlüsse: Der Anschlussflug ist geschlossen, Ihre Umsteigepassagiere wurden umgebucht und werden am Umsteigeschalter in Empfang genommen. Keine Antwort erforderlich."
connex_list:
  title: Anschlussflüge am Zielflughafen
  description: "Vor der TOD-Zeit: bis zu 4 Abflüge der Airline vom Zielflughafen mit Zielflughafen, STD und Gate (AeroDataBox, Ihr RapidAPI-Schlüssel)."
  hint: "Anschlüsse (CONNEX): Abflüge Ihrer Airline vom Zielflughafen mit Flugnummer, Zielflughafen, STD und Gate, aus der AeroDataBox, für Passagierdurchsagen zu Anschlussflügen. Keine Antwort erforderlich."
crew_duty_limit:
  title: Dienstzeit der Besatzung am Limit
  description: "Am Gate nach einer Verspätung von 30 Minuten oder mehr: späteste Abflugzeit. „EXTEND“ (Ermessensentscheidung des Kommandanten) hinterlässt eine Notiz für den nächsten Flug; „NO“ (Standard): Bereitschaftsbesatzung."
  hint: "Besatzungsleitung: Die Verspätung greift in die Flugdienstzeit (FDP) ein, also in den Zeitraum, in dem die Besatzung im Dienst sein darf. Die Nachricht gibt die späteste Abfahrtszeit an; nach Ablauf dieser Zeit müsste der Flugkapitän den Dienst im Rahmen seines Ermessensspielraums verlängern. Bitte teilen Sie mit, ob Sie dies tun werden."
  steps:
    reply:
      reply_hints:
        EXTEND: Der Kommandant wird nach eigenem Ermessen entscheiden und den Dienst bei Bedarf verlängern.
        NO: Der Dienst wird nicht verlängert.
    extend:
      hint: Die Besatzungsleitung hat die Ermessensentscheidung des Kommandanten protokolliert. Erstellen Sie einen Ermessensbericht; die Besatzung erhält vor dem nächsten Dienst eine verlängerte Ruhezeit. Eine Antwort ist nicht erforderlich.
    no:
      hint: "Die Besatzungsleitung hat eine Bereitschaftsbesatzung alarmiert: Sollten Sie den Block nicht bis zur spätesten Frist verlassen haben, wird die Besatzung ausgewechselt. Eine Antwort ist nicht erforderlich."
    met:
      hint: "Die späteste Abflugzeit ist verstrichen: Ein Besatzungswechsel wird angeordnet, einschließlich der Zeit, zu der sich die neue Besatzung meldet, und der zu erwartenden Verspätung. Eine Antwort ist nicht erforderlich."
crew_info:
  title: Besatzungsinformationen
  description: Namen der Mitglieder der Besatzung und Anzahl der Mitglieder der Kabinenbesatzung.
  hint: "Besatzungsliste des Fluges aus der Besatzungsleitung: Kapitän (CPT), Erster Offizier (FO), leitendes Kabinenpersonal (SCCM) und die Anzahl der Kabinenmitarbeiter. Keine Antwort erforderlich."
curfew_dest:
  title: Flugverbotszeit am Zielflughafen
  description: "Im Reiseflug, wenn die voraussichtliche Landezeit nahe an der nächtlichen Flugverbotszeit des Zielflughafens liegt (gilt nur für Flughäfen mit einer tatsächlichen Flugverbotszeit, in der Regel nach einer Verspätung). „ABLE“: Priorität beantragt; „UNABLE“: Ausweichflug zum Ausweichflughafen."
  hint: "Am Zielflughafen gilt eine nächtliche Lärmsperre: die späteste Landezeit (UTC und Ortszeit) sowie Ihre Zeitreserve bis dahin. Beschleunigen Sie den Flug, sofern möglich, und teilen Sie OPS mit, ob Sie vor Beginn der Lärmsperre landen können."
  steps:
    reply:
      reply_hints:
        ABLE: Sie gehen davon aus, vor der Sperrstunde zu landen.
        UNABLE: Sie können nicht vor der Sperrstunde landen.
    able:
      hint: OPS hat für Sie Priorität beantragt, und die Abfertigung steht bereit; sollten Sie dennoch verspätet sein, planen Sie den Ausweichflughafen ein. Eine Antwort ist nicht erforderlich.
    unable:
      hint: "OPS plant Ihre Ausweichlandung zum Ausweichflughafen: Ein Hotel und Busse sind organisiert, und die Passagiere werden auf dem Landweg zum Zielflughafen weitergeleitet. Keine Antwort erforderlich."
deicing_holdover:
  title: Enteisung und Wirkdauer
  description: "Am Gate, wenn die Temperatur am Abflugort 3 °C oder kälter beträgt: Flüssigkeitstyp und Abtaustelle. Nach „READY“: das Enteisungsfahrzeug und die Wirkdauer."
  hint: "Aufgrund der Kälte ist am Abflugort eine Enteisung erforderlich: Geben Sie die Art der Enteisungsflüssigkeit, den Enteisungsstandplatz und die voraussichtliche Verweildauer dort an. Antworten Sie mit „READY“, sobald die Türen geschlossen sind."
  steps:
    reply:
      reply_hints:
        READY: Die Türen sind geschlossen, Sie sind bereit für die Enteisung.
    deicing:
      hint: Das Enteisungsfahrzeug ist an Ihrem Standplatz zugewiesen, einschließlich der Flüssigkeitsmischung und der Wirkdauer (wie lange die Flüssigkeit das Flugzeug vor neuem Eis schützt). Überprüfen Sie vor dem Start die Tabelle zur Wirkdauer. Eine Antwort ist nicht erforderlich.
dep_fire:
  title: Brand am Abflug-Terminal
  description: "Ab 30 Minuten vor der planmäßigen Abflugzeit bis zum Startlauf: Brand auf oder in der Nähe des Abflughafens (zufälliger Punkt neben der geplanten Piste), Abflüge für 20–90 Minuten ausgesetzt, mit einer Aktualisierung alle 20 Minuten."
  hint: "OPS des Abflughafens: Ein Brand auf dem Flughafen oder in dessen Nähe; Rettungskräfte sind vor Ort, und die Abflüge sind ausgesetzt. Rechnen Sie mit einer Verspätung und befolgen Sie die Anweisungen der ATC; die Nachricht gibt den Zeitpunkt der nächsten Aktualisierung an. Eine Antwort ist nicht erforderlich."
  steps:
    met:
      hint: "OPS des Abflughafens: Der Brand ist unter Kontrolle und die Abflüge wurden wieder aufgenommen. Starten Sie, sobald die ATC-Freigabe vorliegt. Eine Antwort ist nicht erforderlich."
departure_report:
  title: Abflugmeldung (OUT/OFF)
  description: Abfahrts- und Startzeiten mit Verspätungscodes.
  hint: "Abflugmeldung: tatsächliche Abfahrts- (OUT) und Startzeiten (OFF) sowie die voraussichtliche Ankunftszeit (ETA) im Vergleich zum Flugplan (STA); bei einer Verspätung zusätzlich die entsprechenden IATA-Verspätungscodes. Keine Antwort erforderlich."
dest_fire:
  title: Brand am Zielflughafen
  description: "Etwa 120 NM entfernt: Brand auf oder in der Nähe des Zielflughafens (zufälliger Punkt neben der geplanten Piste), Rauch treibt in Windrichtung, unter Kontrolle in 20 Minuten bis 2 Stunden, mit einer Aktualisierung alle 20 Minuten. HOLD (Standard) oder DIVERT zum Ausweichflughafen."
  hint: "OPS des Zielflughafens: Ein Brand auf oder in der Nähe des Flughafens, der Rauch treibt mit dem Wind und beeinträchtigt die Sicht, Rettungskräfte sind vor Ort. Es liegt noch keine Einschätzung vor: Bereiten Sie die Ausweichlandung auf Ihrem Ausweichflughafen vor und teilen Sie OPS mit, ob Sie in der Warteschleife bleiben oder ausweichen."
  steps:
    reply:
      reply_hints:
        HOLD: Halten Sie sich in der Warteschleife und warten Sie auf die Freigabe des Flughafens; OPS wird Sie zum angegebenen Zeitpunkt auf den neuesten Stand bringen.
        DIVERT: Leiten Sie den Flug zum Ausweichflughafen oder zu einem anderen Flughafen um, der nach dem Wort „DIVERT EDDM“ benannt ist.
    hold:
      hint: OPS nimmt zur Kenntnis, dass Sie in Warteschleife bleiben; die nächste Aktualisierung erfolgt zum angegebenen Zeitpunkt. Teilen Sie OPS per Freitext-Telex mit, falls Ihr Kraftstoffvorrat kritisch wird.
    reply_2:
      reply_hints:
        HOLD: Bleiben Sie in der Warteschleife und warten Sie auf die nächste Aktualisierung.
        DIVERT: Leiten Sie den Flug zum Ausweichflughafen oder zu einem anderen Flughafen um, der nach dem Wort „DIVERT EDDM“ benannt ist.
    hold_2:
      hint: "Aktuelle Meldung von OPS am Zielflughafen: Das Feuer brennt noch immer. Teilen Sie OPS mit, ob Sie weiterhin in der Warteschleife bleiben oder umleiten."
    divert:
      hint: OPS vermerkt Ihre Ausweichlandung und deren Entfernung und hat dort die Abfertigung und den Kraftstoff angeordnet. Senden Sie Ihre ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    met:
      hint: "Das Feuer ist unter Kontrolle und die Ankünfte am Zielflughafen wurden wieder aufgenommen: Rechnen Sie mit einem normalen Anflug. Eine Antwort ist nicht erforderlich."
    divert_2:
      hint: OPS vermerkt Ihre Ausweichlandung und deren Entfernung und hat dort die Abfertigung und den Kraftstoff angeordnet. Senden Sie Ihre ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
dest_weather:
  title: Wetter am Zielflughafen vor dem TOD
  description: Wetter am Zielflughafen und am Ausweichflughafen aus dem OFP-METAR vor dem TOD.
  hint: Wetter am Zielflughafen und am Ausweichflughafen (aus dem METAR-Bericht des Flugplans) vor Beginn des Sinkflugs, für die Anflugbesprechung. Keine Antwort erforderlich.
dest_weather_live:
  title: Wetter am Zielflughafen vor dem TOD (in Echtzeit)
  description: Wetter am Zielflughafen und am Ausweichflughafen aus aktuellen METAR-/TAF-Meldungen vor dem TOD.
  hint: Aktuelles Wetter am Zielflughafen (METAR und TAF) und am Ausweichflughafen (METAR) vor dem Beginn des Sinkflugs, für die Anflugbesprechung. Keine Antwort erforderlich.
dg_notoc:
  title: Gefahrgut (NOTOC)
  description: "Vor dem Abflug: Gefahrgut an Bord, UN-Nummer, Klasse, Position. Antworten Sie mit „ACK“ als Unterschrift des Kapitäns."
  hint: "NOTOC (Mitteilung an den Kapitän): Es wurde Gefahrgut verladen, mit Angabe der UN-Nummer, der Klasse, der Position im Frachtraum und der Anzahl der Versandstücke; „CAO NO“ bedeutet, dass diese Güter in Passagierflugzeugen befördert werden dürfen. Bestätigen Sie mit „ACK“, was als Unterschrift des Kapitäns gilt."
  steps:
    reply:
      reply_hints:
        ACK: Sie haben die „NOTOC“ gelesen; dies gilt als Ihre Unterschrift.
    notoc:
      hint: "Die Ladekontrolle hat Ihre Bestätigung erhalten: Eine Kopie wird in die Flugakte aufgenommen, und der Ladeleiter ist informiert. Eine Antwort ist nicht erforderlich."
discretion_followup:
  title: Ruhezeit der Besatzung nach Ermessensentscheidung (nächster Flug)
  description: "Vor dem nächsten Flug nach Ermessen des Kommandanten: verlängerte Ruhezeit, ein Reserve-Erster Offizier stößt zur Besatzung hinzu."
  hint: "Besatzungssteuerung: Nach Ermessensentscheidung des Kommandanten (Dienst über die Grenze hinaus verlängert) auf einem früheren Flug erhält die Besatzung eine verlängerte Ruhezeit und ein Reserve-Erster Offizier stößt zur Besatzung hinzu. Der Zeitpunkt der Einweisung ist in der Nachricht angegeben. Eine Antwort ist nicht erforderlich."
divert_arrival:
  title: Ankunft am Flughafen der Ausweichlandung
  description: "Auf dem Standplatz nach einer Ausweichlandung: Abfertigung, Kraftstoff und Passagiere werden organisiert, eine Anfrage für den neuen Flugplan. Hinterlässt eine Notiz für den nächsten Flug von diesem Flughafen."
  hint: "OPS nach Ihrer Ausweichlandung: Abfertigung und Kraftstoff werden angefordert, die Passagiere werden betreut und die Passagiere mit Zielflughafen werden umgebucht. OPS fragt per Freitext-Telex nach Ihrem Kraftstoffbedarf und der neuen Abflugzeit (ETD) an."
drone_activity:
  title: Drohnenaktivität am Zielflughafen
  description: "Etwa 90 NM entfernt: Ankünfte wegen einer Drohne für 30 Minuten bis 3 Stunden ausgesetzt, mit einer Aktualisierung alle 20 Minuten. HOLD (Standard) oder DIVERT zum Ausweichflughafen."
  hint: "OPS des Zielflughafens: Es wird eine Drohne in der Nähe des Flughafens gemeldet, und die Ankünfte sind ausgesetzt; ein voraussichtlicher Zeitpunkt für die Wiederaufnahme steht noch nicht fest. Teilen Sie dem OPS mit, ob Sie in der Warteschleife bleiben oder zum Ausweichflughafen umgeleitet werden."
  steps:
    reply:
      reply_hints:
        HOLD: Halten Sie sich in der Warteschleife und warten Sie auf den Flughafen; die OPS-Leitung informiert Sie zum angegebenen Zeitpunkt.
        DIVERT: Leiten Sie den Flug zum Ausweichflughafen oder zu einem anderen Flughafen um, der mit dem Begriff „DIVERT EDDM“ gekennzeichnet ist.
    hold:
      hint: OPS vermerkt, dass Sie in Warteschleife sind; die nächste Aktualisierung erfolgt zum angegebenen Zeitpunkt. Teilen Sie OPS per Freitext-Telex mit, falls Ihr Kraftstoffvorrat kritisch wird.
    reply_2:
      reply_hints:
        HOLD: Bleiben Sie in Warteschleife und warten Sie auf die nächste Aktualisierung.
        DIVERT: Leiten Sie den Flug zum Ausweichflughafen oder zu einem anderen Flughafen um, der mit dem Begriff „DIVERT EDDM“ gekennzeichnet ist.
    hold_2:
      hint: "Aktualisierung von der OPS des Zielflughafens: Ankünfte sind weiterhin ausgesetzt. Teilen Sie der OPS mit, ob Sie weiterhin in der Warteschleife bleiben oder umleiten."
    divert:
      hint: Die OPS-Leitstelle vermerkt Ihre Ausweichlandung und deren Entfernung; die Abfertigung wird dort angeordnet und die Daten der Passagiere werden übermittelt. Eine Antwort ist nicht erforderlich.
    met:
      hint: "Die Drohnenaktivität ist beendet und die Ankünfte am Zielflughafen wurden wieder aufgenommen: Rechnen Sie mit einem normalen Anflug. Keine Antwort erforderlich."
    divert_2:
      hint: Die OPS-Leitstelle vermerkt Ihre Ausweichlandung und deren Entfernung; die Abfertigung wird dort angeordnet und die Daten der Passagiere werden übermittelt. Eine Antwort ist nicht erforderlich.
earthquake_dest:
  title: Erdbeben in der Nähe des Zielflughafens
  description: Ein Erdbeben der Stärke M5.0 im Umkreis von 100 km um den Zielflughafen in den letzten 24 Stunden (USGS).
  hint: "OPS-Informationen: Ein kürzlich aufgetretenes Erdbeben in der Nähe des Zielflughafens, mit Angabe von Stärke, Ort, Entfernung zum Flughafen und Tiefe (USGS). Überprüfen Sie die NOTAMs bezüglich des Flughafenstatus. Keine Antwort erforderlich."
emergency_mayday:
  title: MAYDAY-Ruf ausgerufen
  description: Die Besatzung hat über die XATC-Station einen MAYDAY an die ATC gemeldet. Die Notfallzentrale der Airline bietet eine Umleitung (DIVERT) zum nächstgelegenen geeigneten Flughafen an (standardmäßige Umleitung nach 5 Minuten) und alarmiert dort die Rettungs- und medizinischen Dienste. Der Vorgang beginnt erst nach einem MAYDAY an XATC.
  hint: Die Notrufzentrale der Airline hat Ihren MAYDAY-Ruf über die ATC empfangen und teilt Ihnen den nächstgelegenen geeigneten Flughafen mit dessen Entfernung mit. Teilen Sie OPS mit, ob Sie umleiten oder den Flug fortsetzen.
  steps:
    reply:
      reply_hints:
        DIVERT: Leiten Sie den Flug zum nächstgelegenen geeigneten Flughafen oder zu einem anderen Flughafen um, der mit dem Wort (DIVERT EDDM) gekennzeichnet ist.
        CONTINUE: Fliegen Sie weiter zum Zielflughafen.
    divert:
      hint: "OPS bestätigt Ihre Ausweichlandung und deren Entfernung: Rettungs- und Feuerwehreinheiten werden alarmiert, medizinische Hilfe und Abfertigung angeordnet. Senden Sie Ihre neue ETA, sobald dies möglich ist, per Freitext-Telex."
    continue:
      hint: OPS nimmt zur Kenntnis, dass Sie zum Zielflughafen weiterfliegen; Rettungs- und Feuerwehrdienste dort werden alarmiert. Informieren Sie OPS, falls sich Ihr Plan ändert. Eine Antwort ist nicht erforderlich.
emergency_pan:
  title: PAN PAN-Meldung
  description: "Die Besatzung hat über die XATC-Station einen „PAN PAN“-Notruf an die Flugsicherung (ATC) abgesetzt. Die Airline bietet die Optionen „DIVERT“ oder „CONTINUE“ an (Standard: „CONTINUE“ nach 5 Minuten) und versetzt Rettungs- und medizinische Dienste am Zielflughafen in Bereitschaft. Der Vorgang beginnt erst nach einem „PAN PAN“-Notruf an XATC."
  hint: "Die Notfallzentrale der Airline hat Ihren „PAN PAN“-Notruf über die Flugsicherung (ATC) erhalten: Der Zielflughafen wurde mitgeteilt, und Rettungs- sowie medizinische Dienste stehen dort bereit. Sie nennt den nächstgelegenen geeigneten Flughafen und fragt, ob Sie umleiten oder weiterfliegen."
  steps:
    reply:
      reply_hints:
        DIVERT: Leiten Sie den Flug zum nächstgelegenen geeigneten Flughafen oder zu einem anderen, nach dem Stichwort (DIVERT EDDM) benannten Flughafen um.
        CONTINUE: Fliegen Sie weiter zum Zielflughafen.
    divert:
      hint: OPS bestätigt Ihre Ausweichlandung und deren Entfernung; Rettungsdienste und Abfertigung werden dort angeordnet. Senden Sie Ihre neue ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    continue:
      hint: OPS nimmt zur Kenntnis, dass Sie zum Zielflughafen weiterfliegen. Informieren Sie OPS, falls sich die Situation ändert. Eine Antwort ist nicht erforderlich.
f1_result:
  title: Formel-1-Ergebnis
  description: "Ein Grand Prix, der während des Fluges zu Ende ging: das Podium (Jolpica)."
  hint: "OPS-Informationen: das Ergebnis eines Formel-1-Grand-Prix, der während Ihres Fluges zu Ende ging. Keine Antwort erforderlich."
ferry_after_mx:
  title: Überführungsflug nach der Wartung (Ferry)
  description: "Vor einem Überführungsflug: Das Flugzeug kommt aus der Wartung und ist wieder flugtauglich; überprüfen Sie das technische Logbuch."
  hint: "Wartung: Das Flugzeug wurde gewartet und ist wieder für den Flugbetrieb freigegeben. Überprüfen Sie vor dem Abflug die Einträge im technischen Logbuch. Keine Antwort erforderlich."
ferry_loadsheet:
  title: Loadsheet (Überführungsflug)
  description: "Loadsheet für einen Überführungsflug: nur Besatzung, keine Passagiere und keine Fracht."
  hint: "Loadsheet eines Überführungs- oder Positionierungsflugs: nur Besatzung, ohne Passagiere und Fracht; die Gewichte (ZFW, TOW, LAW im Vergleich zu den Höchstwerten) sowie der Start- und Flugkraftstoff. Überprüfen Sie die Angaben und übernehmen Sie sie in das FMS; eine Antwort ist nicht erforderlich."
ferry_permit:
  title: Überführungsgenehmigung (ferry)
  description: "Vor einem Überführungsflug: Das Flugzeug fliegt im Rahmen einer Sondergenehmigung (US) oder einer Fluggenehmigung für die Wartung. Antworten Sie mit ACK."
  hint: "Wartung: Das Flugzeug erfüllt die Anforderungen an die Lufttüchtigkeit nicht vollständig, darf jedoch mit einer Überführungsgenehmigung zur Wartungsbasis fliegen; die Genehmigung und ihre Einschränkungen sind in den Flugzeugunterlagen enthalten. Lesen Sie diese durch und bestätigen Sie mit „ACK“."
  steps:
    reply:
      reply_hints:
        ACK: Sie haben die Genehmigung und deren Einschränkungen gelesen.
    ack:
      hint: Die Leitung der Wartung hat Ihre Bestätigung erhalten; die Wartungsbasis am Zielflughafen erwartet das Flugzeug. Keine Antwort erforderlich.
ferry_positioning:
  title: Positionierung für den nächsten Flug (Überführungsflug)
  description: "Im Reiseflug eines Überführungsflugs: Das Flugzeug positioniert sich für seinen nächsten Abflug (ausschließlich echte AeroDataBox-Daten)."
  hint: "Betrieb: Bei diesem Flug wird das Flugzeug für seinen nächsten Abflug vom Zielflughafen positioniert, wobei Flug, Route und STD aus der AeroDataBox stammen. Keine Antwort erforderlich."
final_loadsheet:
  title: Endgültiges Loadsheet
  description: Endgültiges Loadsheet mit der kurzfristigen Änderung gegenüber dem vorläufigen Loadsheet.
  hint: "Endgültiges Loadsheet aus der Ladungskontrolle: Istgewichte im Vergleich zu den Grenzwerten (ZFW: ohne Kraftstoff, TOW: Startgewicht, LAW: Landegewicht), Start- und Flugkraftstoff (TOF, TIF), Passagiere und Fracht; LMC bezeichnet die kurzfristige Änderung gegenüber dem vorläufigen Loadsheet. Überprüfen Sie die Zahlen und übernehmen Sie sie in das FMS; eine Antwort ist nicht erforderlich."
fuel_monitoring:
  title: Kraftstoff unter Plan
  description: "Befindet sich der Kraftstoff an Bord während des Reiseflugs an dieser Stelle um mehr als 5 % (mindestens 500 kg) unter dem im OFP-Plan vorgesehenen Wert, fragt die Flugleitung nach dem Grund: WX, ATC, LEAK oder NORMAL."
  hint: Der Dispatcher stellt fest, dass Ihr Kraftstoffvorrat an Bord um den angegebenen Betrag unter dem im Flugplan für diesen Punkt vorgesehenen Wert liegt. Er fragt nach dem Grund.
  steps:
    reply:
      reply_hints:
        WX: "Wetter: Abweichungen, Wind, Vereisung."
        ATC: "ATC: Abflugroute, Flughöhen oder Warteschleifen abweichend vom Plan."
        LEAK: Sie vermuten ein Leck im Kraftstoff.
        NORMAL: Keine Auffälligkeiten, die Abweichung ist zu erwarten.
    wx:
      hint: Die Flugleitung gibt das Wetter als Grund an und bittet Sie, den Kraftstoffstand am Zielflughafen und am Ausweichflughafen erneut zu überprüfen; teilen Sie der Flugleitung per Freitext-Telex mit, falls der Stand unter dem vorgeschriebenen Mindeststand liegt. Eine Antwort ist nicht erforderlich.
    atc:
      hint: Die Dispatch-Leitung gibt „ATC“ als Grund an und schlägt vor, bei der ATC eine direkte Flugroute oder eine günstigere Flughöhe anzufordern; informieren Sie die Dispatch-Leitung per Freitext-Telex, falls der Kraftstoffstand unter das vorgeschriebene Minimum fällt. Eine Antwort ist nicht erforderlich.
    leak:
      hint: "Die Flugleitung vermutet ein Leck im Kraftstoffsystem: Überprüfen Sie das Kraftstoffsystem. Sie gibt den nächstgelegenen Ausweichflughafen und dessen Entfernung an; leiten Sie den Flug um, falls das Leck bestätigt wird. Keine Antwort erforderlich."
    normal:
      hint: Dispatch nimmt dies zur Kenntnis. Beobachten Sie den Kraftstoffstand weiterhin und informieren Sie Dispatch, falls die Abweichung zunimmt. Eine Antwort ist nicht erforderlich.
fuel_slip:
  title: Kraftstoffbeleg
  description: "Nach dem Betanken: Betankungsmenge und Abweichung vom Plan."
  hint: "Kraftstoffbeleg vom Betanken: geplanter Rampenkraftstoff, Kraftstoff an Bord, die betankte Menge und die Abweichung vom Plan, einschließlich der Aufschlüsselung des Kraftstoffs im Flugplan (Rollbetrieb, Flugstrecke, Reserve, Ausweichflughafen, Endreserve, Extra). Keine Antwort erforderlich."
gate_assignment:
  title: Gate-Zuweisung
  description: Zuweisung des Gates für den Abflug.
  hint: OPS gibt Ihr voraussichtliches Gate oder Ihre Parkposition am Zielflughafen an. Eine Antwort ist nicht erforderlich.
gate_reassignment:
  title: Gate-Neuzuweisung
  description: "Zu Beginn des Sinkflugs ist das zugewiesene Gate belegt: Ein neues Gate wird ab diesem Zeitpunkt von den Informationen zur Ankunft und „REQ GATE“ verwendet."
  hint: "Gate-Wechsel: Das Ihnen zugewiesene Gate ist belegt (der Grund ist in der Nachricht angegeben) und Sie erhalten ein neues Gate; das Gepäckband bleibt unverändert. In den Informationen zur Ankunft und bei „REQ GATE“ wird nun das neue Gate angegeben. Eine Antwort ist nicht erforderlich."
hard_landing_check:
  title: Prüfung auf harte Landung
  description: "Im Block: Wenn die Sinkgeschwindigkeit bei der Landung über 350 ft/min lag (hierfür ist der Messwert vom Bridge-Display erforderlich), bittet die Wartung um die Bestätigung (CONFIRM) einer harten Landung. Durch die Bestätigung (CONFIRM) wird vor dem nächsten Flug desselben Flugzeugs eine Inspektion veranlasst."
  hint: "Wartung: Die Flugdatenüberwachung (FDM) hat Ihre Landung mit der angegebenen Geschwindigkeit aufgezeichnet. Es wird gefragt, ob die Besatzung eine harte Landung wahrgenommen hat."
  steps:
    reply:
      reply_hints:
        CONFIRM: Ja, die Besatzung hat eine harte Landung festgestellt.
        NEGATIVE: Nein, die Besatzung hat dies nicht festgestellt.
    confirm:
      hint: "Tragen Sie die harte Landung in das technische Logbuch ein: Das Flugzeug wird vor seinem nächsten Flug gemäß dem Handbuch für die Wartung (AMM) überprüft. Keine Antwort erforderlich."
    negative:
      hint: Die Abteilung für Wartung vermerkt, dass die Besatzung keine harte Landung gemeldet hat; die Flugdaten werden archiviert. Keine Antwort erforderlich.
hard_landing_followup:
  title: Inspektion nach harter Landung abgeschlossen
  description: "Vor einem Flug mit demselben Flugzeug nach einer bestätigten harten Landung: Die Abteilung für Wartung meldet, dass die Überprüfung abgeschlossen ist und das Flugzeug freigegeben wurde."
  hint: "Wartung: Nach der gemeldeten harten Landung bei diesem Flugzeug ist die Überprüfung abgeschlossen, es wurden keine Schäden festgestellt und das Flugzeug ist für den Flug freigegeben. Keine Antwort erforderlich."
hold_fuel_watch:
  title: Mindestmenge an Kraftstoff für die Ausweichlandung in der Warteschleife
  description: "Während der Warteschleife aufgrund einer von der Airline angekündigten Schließung sinkt der Kraftstoffstand auf das Niveau der Ausweichlandung: „DIVERT“ wird empfohlen (antworten Sie mit „STAY“, um in der Warteschleife zu bleiben), und ohne Antwort innerhalb von 5 Minuten wird der Flug zum Ausweichflughafen geleitet."
  hint: "OPS des Zielflughafens: Während Sie in der Warteschleife sind, ist Ihr Kraftstoffstand auf das Minimum für die Ausweichlandung zum Ausweichflughafen gesunken. OPS empfiehlt, jetzt umzuleiten, und fragt, ob Sie umleiten oder in der Warteschleife bleiben."
  steps:
    reply:
      reply_hints:
        DIVERT: Leiten Sie den Flug jetzt zum Ausweichflughafen um.
        STAY: Bleiben Sie in der Warteschleife; Entscheidung des Kapitäns.
    divert:
      hint: OPS nimmt Ihre Ausweichlandung zum Ausweichflughafen zur Kenntnis und hat dort die Abfertigung sowie den Kraftstoff angeordnet. Senden Sie Ihre ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    stay:
      hint: OPS nimmt zur Kenntnis, dass Sie auf Anweisung des Kapitäns in der Warteschleife verbleiben, und bittet Sie per Freitext-Telex um die Angabe Ihres Zustands des Kraftstoffs.
holiday_dest:
  title: Feiertag am Zielflughafen
  description: Ein nationaler Feiertag am Tag der Ankunft im Zielflughafen, Ortszeit (Nager.Date).
  hint: "OPS-Information: Heute ist ein Feiertag am Zielflughafen. Rechnen Sie mit Feiertagsöffnungszeiten der Flughafendienste. Keine Antwort erforderlich."
landing_data:
  title: Landedaten
  description: "Landedaten vom OFP: Piste, Wetter, Klappen und VREF, sofern diese beim OFP vorliegen."
  hint: "Landedaten aus dem Flugplan: Piste und „STAR“, Flughöhe, Übergangshöhe, Landegewicht im Verhältnis zur Grenze, Lande- und Kraftstoff für den Ausweichflughafen; Klappen und „VREF“, sofern im Flugplan angegeben. Für das Anflugbriefing ist keine Antwort erforderlich."
lost_baggage:
  title: Zurückgelassenes Gepäck
  description: "Auf dem Band: am Abflugort zurückgelassene Gepäckstücke (verpasster Anschluss), PIR-Schalter am Gepäckband. Der Fall wird mit dem nächsten Flug abgeschlossen."
  hint: "Gepäck: Einige Gepäckstücke wurden am Abflugort nicht verladen (verpasster Anschluss). Die Passagiere melden dies am Gepäckschalter (PIR, PIR – Property Irregularity Report) am Gepäckband; die Gepäckstücke werden mit dem nächsten Flug nachgeschickt. Eine Antwort ist nicht erforderlich."
medical_onboard:
  title: Medizinischer Notfall an Bord
  description: "Im Reiseflug meldet die Besatzung einen erkrankten Passagier. Antworten Sie mit „CONTINUE“ oder „DIVERT“ (Standard: „CONTINUE“ nach 10 Minuten). „DIVERT“ leitet das Flugzeug zum nächstgelegenen Flughafen des Abflugortes oder zu einem Ausweichflughafen um."
  hint: "OPS: Das Kabinenpersonal meldet einen medizinischen Notfall an Bord unter Angabe des Sitzplatzes, des Alters des Passagiers, der Symptome und der Frage, ob sich ein Arzt an Bord befindet. MedLink, die Ärzte am Boden, die die Besatzung beraten, geben anschließend ihre Empfehlungen."
  steps:
    met:
      hint: Es befindet sich kein Arzt an Bord, und MedLink rät dringend dazu, jetzt umzuleiten. Teilen Sie OPS mit, ob Sie den Flug fortsetzen oder umleiten.
    timeout:
      hint: MedLink rät zu einer Umleitung, falls sich der Zustand des Passagiers nicht verbessert. Teilen Sie OPS mit, ob Sie den Flug fortsetzen oder umleiten.
    reply:
      reply_hints:
        CONTINUE: Fliegen Sie weiter zum Zielflughafen; Sie können nach dem Wort eine kurze Anmerkung hinzufügen.
        DIVERT: Umleitung; Sie können die ICAO-Kennung des Flughafens und eine kurze Anmerkung hinter dem Wort „DIVERT EDDM PAX STABLE“ hinzufügen.
    divert:
      hint: OPS bestätigt die Ausweichlandung und deren Entfernung und hat dort einen Krankenwagen sowie die Abfertigung angeordnet. Senden Sie Ihre neue ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    divert_2:
      hint: Rettungssanitäter warten an der Flugzeugtür; der Patient verlässt das Flugzeug vor den anderen Passagieren. Keine Antwort erforderlich.
    continue:
      hint: OPS nimmt zur Kenntnis, dass Sie zum Zielflughafen weiterfliegen, und bittet Sie, bei ATC Vorrang zu beantragen. Keine Antwort erforderlich.
    continue_2:
      hint: Rettungssanitäter warten an der Flugzeugtür; der Patient verlässt das Flugzeug vor den anderen Passagieren. Keine Antwort erforderlich.
mel_carry_over:
  title: Offener MEL-Punkt aus einem früheren Flug
  description: "Vor einem Flug mit demselben Flugzeug: Der zurückgestellte MEL-Punkt ist noch offen. Nach der Ankunft wird er von der Abteilung für Wartung abgeschlossen."
  hint: "MEL-Status dieses Flugzeugs: Ein gemäß der MEL (Minimum Equipment List) auf einem früheren Flug zurückgestellter Defekt ist noch offen. Fliegen Sie gemäß dem entsprechenden MEL-Betriebsverfahren und prüfen Sie die Leistung sowie den Kraftstoffmehrverbrauch; die Abteilung für Wartung hat am Zielflughafen einen Termin dafür reserviert. Keine Antwort erforderlich."
  steps:
    mel_status:
      hint: "MEL-Status: Die Abteilung für Wartung hat den zurückgestellten Defekt an diesem Flughafen behoben; der MEL-Eintrag ist geschlossen und im technischen Logbuch abgezeichnet. Keine Antwort erforderlich."
natural_event:
  title: Naturereignis in der Nähe der Flugroute
  description: Ein Naturereignis (NASA EONET) in der Nähe der vor Ihnen liegenden Flugroute.
  hint: "OPS-Hinweis: Ein von NASA EONET gemeldetes Naturereignis vor Ihnen in der Nähe Ihrer Flugroute (Waldbrand, Sturm, Vulkanausbruch und Ähnliches), mit Angabe der Entfernung vor Ihnen und abseits der Flugroute. Überprüfen Sie das Wetterradar und die SIGMETs und weichen Sie gegebenenfalls von der Route ab. Eine Antwort ist nicht erforderlich."
next_leg:
  title: Nächster Flugabschnitt
  description: Nächster Flugabschnitt mit demselben Flugzeug.
  hint: "OPS gibt Ihren nächsten Sektor mit demselben Flugzeug an: Flug, Route, STD-Zeit und der Turnaround. Keine Antwort erforderlich."
nhl_results:
  title: NHL-Ergebnisse
  description: NHL-Spiele, die während des Fluges zu Ende gingen (reguläre Saison und Playoffs).
  hint: "OPS-Informationen: Endstände von NHL-Spielen, die während Ihres Fluges zu Ende gingen. Keine Antwort erforderlich."
ped_fire_cabin:
  title: Brand eines Lithium-Akkus in der Kabine
  description: "Im Reiseflug meldet die Besatzung einen Batteriebrand in einem Passagiergerät. Vorgehensweise gemäß FAA SAFO 09013. Antworten Sie mit „CONTINUE“ oder „DIVERT“ (Standard: „DIVERT“ nach 5 Minuten)."
  hint: "OPS: Die Besatzung meldet einen Brand einer Lithiumbatterie in einem persönlichen elektronischen Gerät (PED) eines Passagiers am Sitzplatz sowie die Maßnahmen zur Brandbekämpfung: Wasser oder Halon, Kühlung der Zellen mit Wasser, kein Brandschutzbeutel. Teilen Sie OPS mit, ob Sie den Flug fortsetzen oder umleiten."
  steps:
    reply:
      reply_hints:
        CONTINUE: Das Feuer ist gelöscht; fliegen Sie weiter zum Zielflughafen.
        DIVERT: Leiten Sie den Flug zum nächstgelegenen geeigneten Flughafen oder zu einem anderen, nach dem Wort „DIVERT EDDM“ benannten Flughafen um.
    divert:
      hint: OPS bestätigt die Ausweichlandung und deren Entfernung und hat die Feuerwehr vor Ort alarmiert. Senden Sie Ihre neue ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    divert_2:
      hint: Die Feuerwehr erwartet Sie an der Flugzeugtür und nimmt den Gegenstand entgegen. Eine Antwort ist nicht erforderlich.
    continue:
      hint: OPS nimmt zur Kenntnis, dass Sie den Flug zum Zielflughafen fortsetzen. Beobachten Sie die Kabine weiterhin und informieren Sie OPS, falls das Feuer erneut ausbricht. Keine Antwort erforderlich.
    continue_2:
      hint: Die Feuerwehr erwartet Sie an der Flugzeugtür und nimmt den Gegenstand entgegen. Eine Antwort ist nicht erforderlich.
prelim_loadsheet:
  title: Vorläufiges Loadsheet
  description: Vorläufiges Loadsheet mit den geplanten Werten aus dem OFP.
  hint: "XML-Loadsheet: die geplanten Gewichte und der Kraftstoff aus dem Flugplan (ZFW, TOF, TOW, TIF, LAW im Vergleich zu den Höchstwerten), Passagiere und Fracht. Verwenden Sie es zur Vorbereitung des FMS; die endgültigen Zahlen finden Sie im endgültigen Loadsheet. Eine Antwort ist nicht erforderlich."
recovery_followup:
  title: Wiederaufnahme des Flugbetriebs nach einer Ausweichlandung
  description: "Vor dem Flug von einem früheren Ausweichlandungsflughafen: Das Flugzeug wurde vom vorherigen Flug umgeleitet; die Dienstzeiten der Besatzung und der neue Flugplan werden überprüft."
  hint: "OPS-Meldung vor dem Wiederanflug vom Flughafen einer früheren Ausweichlandung: Die Dienstzeiten der Besatzung werden überprüft, ein neuer Flugplan und Kraftstoff werden angefordert; es ist mit verspäteten Passagieren und Gepäck zu rechnen. Keine Antwort erforderlich."
runway_closure_dest:
  title: Piste am Zielflughafen gesperrt
  description: Zu Beginn des Sinkflugs ist die geplante Piste gesperrt (30 Minuten bis 3 Stunden, selten bis auf Weiteres), mit einer Aktualisierung alle 20 Minuten. HOLD (Standard) oder DIVERT zum Ausweichflughafen.
  hint: "OPS des Zielflughafens: Ihre geplante Piste ist gesperrt (der Grund ist in der Nachricht angegeben), eine Prognose liegt noch nicht vor. Überprüfen Sie Ihren Kraftstoffvorrat und teilen Sie OPS mit, ob Sie in der Warteschleife bleiben oder zum Ausweichflughafen ausweichen."
  steps:
    reply:
      reply_hints:
        HOLD: Halten Sie sich in der Warteschleife und warten Sie auf die Piste; OPS wird Sie zum angegebenen Zeitpunkt auf den neuesten Stand bringen.
        DIVERT: Leiten Sie den Flug zum Ausweichflughafen oder zu einem anderen Flughafen um, der nach dem Wort „DIVERT EDDM“ benannt ist.
    hold:
      hint: OPS nimmt zur Kenntnis, dass Sie in der Warteschleife bleiben; Ihre Parkposition und die Abfertigung bleiben wie geplant, und die nächste Aktualisierung erfolgt zum angegebenen Zeitpunkt.
    reply_2:
      reply_hints:
        HOLD: Bleiben Sie in der Warteschleife und warten Sie auf die nächste Aktualisierung.
        DIVERT: Leiten Sie den Flug zum Ausweichflughafen oder zu einem anderen Flughafen um, der nach dem Wort „DIVERT EDDM“ benannt ist.
    hold_2:
      hint: "OPS: Der Zielflughafen ist bis auf Weiteres (UFN) geschlossen, daher leiten Sie zum Ausweichflughafen um; Abfertigung und Kraftstoff sind dort angeordnet. Keine Antwort erforderlich."
    hold_3:
      hint: "Aktuelle Meldung von OPS am Zielflughafen: Die Piste ist weiterhin gesperrt und Ankünfte ausgesetzt. Teilen Sie OPS mit, ob Sie in der Warteschleife verbleiben oder ausweichen."
    divert:
      hint: OPS vermerkt Ihre Ausweichlandung und deren Entfernung und hat dort die Abfertigung sowie den Kraftstoff angeordnet. Senden Sie Ihre ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
    met:
      hint: "Die Piste wurde wieder freigegeben und die Ankünfte am Zielflughafen wurden wieder aufgenommen: Rechnen Sie mit einem normalen Anflug. Eine Antwort ist nicht erforderlich."
    divert_2:
      hint: OPS vermerkt Ihre Ausweichlandung und deren Entfernung und hat dort die Abfertigung sowie den Kraftstoff angeordnet. Senden Sie Ihre ETA, sobald es Ihnen möglich ist, per Freitext-Telex.
rush_bags_followup:
  title: Eilgepäck zugestellt (nächster Flug)
  description: "Vor dem nächsten Flug: Die zurückgelassenen Gepäckstücke haben ihre Besitzer erreicht, der Fall ist abgeschlossen."
  hint: "Gepäck: Die auf einem früheren Flug zurückgelassenen Gepäckstücke wurden ihren Besitzern zugestellt, und der Gepäckfall (PIR) ist abgeschlossen. Eine Antwort ist nicht erforderlich.PIR"
short_connection:
  title: Kurze Umsteigezeit für Passagiere
  description: "Vor dem Landeanflug, wenn der Anschlussflug in weniger als einer Stunde startet: Anzahl der Passagiere, Flugnummer, STD; bitte beschleunigen Sie den Ablauf."
  hint: "Anschlüsse: Passagiere Ihres Fluges haben einen kurzen Anschluss an einen Weiterflug; die Nachricht enthält den Flug, dessen STD und die Zeitreserve. OPS bittet Sie, die Ankunft nach Möglichkeit zu beschleunigen; das Transferpersonal wird die Passagiere an Ihrem Gate in Empfang nehmen. Eine Antwort ist nicht erforderlich."
slot_ctot:
  title: Slot / CTOT
  description: ATC-Flow-Slot mit einem CTOT, der eine Verspätung beim Abflug verursacht.
  hint: "ATC-Flussbeschränkung: Der Flug verfügt über einen Slot, eine berechnete Startzeit (CTOT) und die dadurch verursachte Verspätung. Planen Sie das Einsteigen und den Pushback so, dass der Start zur CTOT erfolgt; der Befehl „RDY“ teilt der OPS-Abteilung mit, dass Sie bereits früher bereit sind. Eine Antwort ist nicht erforderlich."
slot_missed:
  title: Slot verpasst
  description: "Start später als CTOT + 10 Min. (Slot-Toleranz -5/+10 Min.): Der Slot wird als verpasst gemeldet."
  hint: Sie sind außerhalb des Slot-Fensters um den CTOT (-5/+10 Min.) gestartet, daher meldet die Airline einen verpassten Slot an das Flugverkehrsmanagement (ATFM). Eine Antwort ist nicht erforderlich.
solar_eclipse:
  title: Sonnenfinsternis auf der Flugroute
  description: Ein vor Ihnen liegender Routenpunkt befindet sich zum Zeitpunkt des Überflugs im Bereich der Sonnenfinsternis (Magnitude 0,5 oder mehr), wobei die Sonne über dem Horizont steht (NASA).
  hint: "OPS-Information: Auf Ihrer Flugroute ist eine Sonnenfinsternis zu beobachten, mit Angabe von Art, Magnitude, Zeitpunkt, Ort und Sonnenhöhe. Schauen Sie nicht ohne Augenschutz in die Sonne. Keine Antwort erforderlich."
space_launch:
  title: Raumfahrtstart in der Nähe der Flugroute
  description: Ein bestätigter Start (TheSpaceDevs, Status „Go“) innerhalb von 300 NM der vor Ihnen liegenden Flugroute, vor der Ankunft.
  hint: "OPS-Hinweis: Ein Raketenstart ist in der Nähe Ihrer Flugroute geplant, mit Angabe des frühesten Startzeitpunkts (NET), des Startfensters und der Entfernung. Rechnen Sie mit Luftraumbeschränkungen in der Umgebung und überprüfen Sie die NOTAMs. Keine Antwort erforderlich."
space_launch_done:
  title: Raumfahrtstart in der Nähe der Flugroute (gestartet)
  description: Ein Start nach dem Start (TheSpaceDevs) innerhalb von 300 NM der vor Ihnen liegenden Flugroute.
  hint: "OPS-Meldung: Nach Ihrem Start wurde in der Nähe Ihrer Flugroute eine Rakete gestartet, mit Angabe von Zeitpunkt und Status. Sperrgebiete wegen herabfallender Trümmer können aktiv sein; überprüfen Sie die NOTAMs. Keine Antwort erforderlich."
space_weather:
  title: Weltraumwetterwarnung
  description: NOAA-Skala R3+, S2+ (Flugroute oberhalb von 60 Grad Breite) oder G3+ (aktuell oder innerhalb von 24 Stunden vorhergesagt).
  hint: "OPS-Meldung: Die NOAA meldet starkes Weltraumwetter (solare Funkunterbrechung, Strahlungssturm oder geomagnetischer Sturm). Dies kann HF-Funk, SATCOM und GNSS stören; bitte überprüfen Sie diese. Eine Antwort ist nicht erforderlich."
takeoff_data:
  title: Startdaten
  description: "Abflugdaten aus dem OFP: Piste, Wetter, Klappen, Schub und V-Geschwindigkeiten, sofern diese im OFP enthalten sind."
  hint: "Startdaten aus dem Flugplan: Piste und SID, Höhe, Übergangsflughöhe, Startgewicht im Verhältnis zur Grenze, Startkraftstoff, Reiseflughöhe und Kostenindex sowie das Abflugwetter; Klappen, Schub und V-Geschwindigkeiten, sofern im Flugplan angegeben. Vergleichen Sie diese mit Ihren eigenen Berechnungen; eine Antwort ist nicht erforderlich."
tankering:
  title: Angebot zum Mitführen von Treibstoff
  description: "Vor dem Abflug: Kraftstoff ist am Zielflughafen teuer; zusätzlicher Kraftstoff wird angeboten, sofern das Landegewicht dies zulässt. „ACCEPT“ oder „DECLINE“ (Standard)."
  hint: "Kraftstoffdisposition: Da Kraftstoff am Zielflughafen teuer ist, wird empfohlen, „Tankering“ durchzuführen: Sie sollen von hier aus zusätzlichen Kraftstoff für den nächsten Flugabschnitt mitführen. Die Nachricht enthält die Menge des zusätzlichen Kraftstoffs, den neuen Blockkraftstoff sowie das geschätzte Landegewicht im Vergleich zum Höchstgewicht. Teilen Sie der Disposition mit, ob Sie zustimmen."
  steps:
    reply:
      reply_hints:
        ACCEPT: Nehmen Sie den zusätzlichen Kraftstoff mit.
        DECLINE: Behalten Sie den geplanten Kraftstoff bei.
    accept:
      hint: "Tankung akzeptiert: Dem Betankungspersonal wird der neue Blockkraftstoff mitgeteilt, und ein Loadsheet folgt. Keine Antwort erforderlich."
    decline:
      hint: "Die Flugleitung vermerkt dies: Der geplante Kraftstoff bleibt wie im Flugplan angegeben. Keine Antwort erforderlich."
tech_defect_mel:
  title: Technischer Defekt und MEL
  description: Während des Reiseflugs meldet die Wartung einen Systemfehler. „CONFIRM“ stuft den Fehler gemäß der MEL als zurückgestellt ein und hält ihn für dieses Flugzeug offen; „NEGATIVE“ (Standard) schließt ihn als Fehlnachricht.
  hint: "Wartung: Das Wartungssystem des Flugzeugs (CMS) meldet einen Fehler mit dem entsprechenden MEL-Punkt. Es fragt ab, ob die Besatzung dieselbe Anzeige im Besatzungswarnsystem sieht."
  steps:
    reply:
      reply_hints:
        CONFIRM: Ja, die Besatzung sieht die angezeigte Störung.
        NEGATIVE: Nein, im Cockpit gibt es keine entsprechende Anzeige.
    confirm:
      hint: "Tragen Sie den Defekt in das technische Logbuch ein: Er wird gemäß der MEL (Minimum Equipment List) unter der Reparaturkategorie C zurückgestellt, und das Flugzeug fliegt den nächsten Sektor gemäß der MEL. Die Wartung wird das Flugzeug am Zielflughafen in Empfang nehmen. Keine Antwort erforderlich."
    negative:
      hint: "Die Wartung betrachtet dies als eine falsche Nachricht des Wartungssystems: Es sind keine Maßnahmen erforderlich. Eine Antwort ist nicht erforderlich."
unruly_followup:
  title: Weiterverfolgung eines störenden Passagiers (nächster Flug)
  description: "Vor dem nächsten Flug: Der Passagier aus dem vorherigen Flug steht auf der Flugverbotsliste des Unternehmens."
  hint: "Sicherheitshinweis: Der störende Passagier eines früheren Fluges steht nun auf der Flugverbotsliste des Unternehmens, und es wurde Anzeige bei der Polizei erstattet. Keine Antwort erforderlich."
unruly_passenger:
  title: Störender Passagier
  description: "Im Reiseflug meldet die Besatzung einen störenden Passagier. „RESTRAIN“: Polizei bei Ankunft; „DIVERT“: nächstgelegener Flughafen; „CONTINUE“ (Standard): beobachten. Bei „RESTRAIN“ und „DIVERT“ hinterlassen Sie eine Notiz für den nächsten Flug."
  hint: "OPS-Sicherheit: Das Kabinenpersonal meldet einen störenden Passagier unter Angabe des Sitzplatzes und des Vorfalls; die Besatzung hat eine formelle Verwarnung ausgesprochen. Teilen Sie OPS mit, wie Sie vorgehen: Festhalten des Passagiers, Umleitung oder Weiterflug."
  steps:
    reply:
      reply_hints:
        RESTRAIN: Die Besatzung hält den Passagier fest, und Sie setzen den Flug fort.
        DIVERT: Leiten Sie den Flug zum nächstgelegenen geeigneten Flughafen oder zu einem anderen Flughafen um, der nach dem Befehl „DIVERT EDDM“ benannt ist.
        CONTINUE: Fliegen Sie weiter; die Besatzung behält den Passagier weiterhin im Auge.
    restrain:
      hint: "OPS nimmt die Festhaltemaßnahme zur Kenntnis: Die Polizei wird das Flugzeug am Zielflughafen in Empfang nehmen. Öffnen Sie die Türen nicht, bevor die Polizei eintrifft, und erstellen Sie einen Kabinenvorfallbericht. Keine Antwort erforderlich."
    restrain_2:
      hint: Die Polizei befindet sich an der Flugzeugtür, um den Passagier auf dem angegebenen Sitzplatz in Empfang zu nehmen. Halten Sie die übrigen Passagiere auf ihren Plätzen, bis die Polizei an Bord gekommen ist. Keine Antwort erforderlich.
    divert:
      hint: OPS nimmt Ihre Ausweichlandung zur Kenntnis; Polizei und Abfertigung werden dorthin beordert. Erstellen Sie einen Kabinenvorfallbericht. Keine Antwort erforderlich.
    continue:
      hint: OPS nimmt zur Kenntnis, dass Sie den Flug fortsetzen und die Besatzung den Passagier weiterhin im Auge behält. Informieren Sie OPS, falls sich die Situation ändert. Keine Antwort erforderlich.
vatsim_atc:
  title: VATSIM-ATC-Dienst am Zielflughafen online
  description: Online-VATSIM-ATC am Zielflughafen vor TOD.
  hint: Welche VATSIM-Fluglotsen sind derzeit am Zielflughafen online und wie lautet der ATIS-Buchstabe, damit Sie Ihre Frequenzen für die Ankunft planen können. Keine Antwort erforderlich.
vatsim_atc_none:
  title: Kein VATSIM-ATC am Zielflughafen
  description: Kein VATSIM-ATC am Zielflughafen vor TOD online.
  hint: "Derzeit ist kein VATSIM-Fluglotse am Zielflughafen online: Verwenden Sie UNICOM 122,800 und melden Sie Ihre Positionen selbst. Überprüfen Sie dies vor dem Anflug erneut. Eine Antwort ist nicht erforderlich."
vdgs_arrival:
  title: Andockanzeige (GSX)
  description: Flug, Abflug- und Ankunftsgate auf dem GSX-VDGS am Zielflughafen.
  hint: "Keine Nachricht: Ihr Flug, Abflug- und Ankunftsgate auf dem GSX-Andockdisplay an der Parkposition."
vdgs_divert:
  title: Andockanzeige, Ausweichlandung (GSX)
  description: Flug, eine rote „DIVERTED“-Zeile und der Ursprungsort auf dem GSX-VDGS am Ort der Ausweichlandung.
  hint: "Keine Nachricht: Ihr Flug, eine rote „DIVERTED“-Zeile und der Ursprungsort auf dem GSX-Andockdisplay am Flughafen der Ausweichlandung."
vip_onboard:
  title: VIP-Person an Bord
  description: "Vor dem Abflug: ein VIP-Passagier und sein Sitzplatz; bei Verspätung: steigt als Erster aus, Protokollfahrzeug am Gate."
  hint: "OPS: Ein VIP befindet sich an Bord und hat einen zugewiesenen Sitzplatz. Der VIP steigt als Letzter ein und als Erster aus; machen Sie diesbezüglich keine Durchsage an Bord. Keine Antwort erforderlich."
  steps:
    ops_msg:
      hint: "OPS bei Ankunft: Der VIP steigt als Erster aus, ein Protokollfahrzeug wartet an Ihrem Gate; halten Sie die übrigen Passagiere für die angegebene Zeit an Bord. Keine Antwort erforderlich."
volcanic_ash:
  title: Vulkanasche in der Nähe der Flugroute
  description: Ein gültiges SIGMET-VA in der Nähe der vor Ihnen liegenden Flugroute.
  hint: "OPS-Hinweis: Ein SIGMET zu Vulkanasche ist in der Nähe Ihrer vor Ihnen liegenden Flugroute gültig; darin sind der Vulkan, die Höhen der Aschewolke, die Entfernungen und die Gültigkeitsdauer angegeben. Meiden Sie den Aschebereich und überprüfen Sie das SIGMET. Eine Antwort ist nicht erforderlich."
welcome_turnaround:
  title: Begrüßung und Turnaround
  description: Begrüßungsnachricht mit dem Turnaround-Plan.
  hint: "Begrüßung durch den Zielflughafen mit dem Turnaround-Plan: Turn-Zeit, nächster Flug und STD, Reinigung und Catering während des Fluges. Keine Antwort erforderlich."
