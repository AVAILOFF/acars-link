# Japanese UI texts of the scenarios (T86/T87): machine translation by `pnpm i18n translate`
# (tools/i18n), not yet checked by a native speaker. Hand edits are kept on the next run. Telexes are never translated.
aircraft_change:
  title: 機体変更
  description: 次の区間での機体変更。
  hint: 運航管理（OPS）からの連絡によると、次の区間は別の航空機で運航されるとのことです。この航空機は到着後に整備に入り、乗務員は別の航空機に乗り換えます。返信は不要です。
airshow_dest:
  title: 目的地での航空ショー
  description: 到着日に目的地から50 km圏内で開催される航空ショー（公式ウェブサイトからの参考リスト）。
  hint: OPS情報：フライト当日に目的地またはその近郊で航空ショーが開催されます。飛行制限や交通量の増加が予想されますので、NOTAMをご確認ください。返信は不要です。
altn_wx_deterioration:
  title: 代替空港の気象状況が悪化しています
  description: TOD前に、代替空港の気象状況が悪化しました。OK（デフォルト）またはLOW：最寄りの空港とその距離。
  hint: 運航管理：代替空港の気象状況が悪化しています（理由はメッセージに記載されています）。航路上の代替空港の利用または燃料の追加を検討し、燃料残量を運航管理に報告してください。
  steps:
    reply:
      reply_hints:
        OK: 現在の状況において、燃料は十分です。
        LOW: 現在の状況において、燃料残量が不足しています。
    ok:
      hint: 運航管理は、燃料に問題がないことを確認し、代替空港の気象状況を注視しています。降下開始前に最新情報が提供されます。返信は不要です。
    met:
      hint: 降下開始前に、運航管理から代替空港の気象情報の更新があります。燃料状況により対応が必要な場合は、自由文テレックスで運航管理にその旨を伝えてください。
    timeout:
      hint: 降下開始前に、運航管理から代替空港の気象情報の更新があります。燃料状況により対応が必要な場合は、自由文テレックスで運航管理にその旨を伝えてください。
    low:
      hint: 運航管理から、最寄りの代替空港および現在位置からの距離が通知されます。必要に応じて、ATCに最低燃料量を申告してください。返信は不要です。
arrival_info:
  title: 到着情報
  description: 着陸時のゲート、手荷物受取所、乗り継ぎ乗客、および地上支援について。
  hint: 目的地に関するOPSからの到着情報：ゲートまたはスポット、手荷物受取所、他便へ乗り継ぐ乗客数、および予定されているグランドハンドリング。返信は不要です。
atc_flow_delay:
  title: ATCフロー制御による遅延
  description: 出発直前に、以前に通知されたCTOT（slot_ctot）が、フロー制御により遅くなります。
  hint: ATCフロー管理（ATFM）により、スロットが後ろに繰り下げられました：その理由、旧CTOTと新CTOT、および追加の遅延時間。新しいCTOTに合わせて、エンジン始動およびプッシュバックの計画を立ててください。返信は不要です。
atis_update:
  title: 目的地ATISが変更されました
  description: 降下中に、VATSIMの目的地ATISのレターが変更されました：新しいレターとMETARです。
  hint: 目的地（VATSIM）のATISに新しい情報レターが追加され、以前のレターに取って代わりました。これには最新のMETARが含まれています。アプローチ管制との最初の連絡時には、この新しいレターを使用してください。返信は不要です。
aurora_on_route:
  title: 航路上のオーロラ
  description: 今後1時間以内に、夜間にルート上の地点でオーロラが発生する確率が30％以上となる見込みです（NOAA OVATION）。
  hint: OPS情報：NOAAの予報によると、当該ルート沿いでオーロラ（北極光または南極光）が発生する可能性があります。メッセージには場所と時刻が記載されています。乗務員が乗客に伝える場合があります。返信は不要です。
aviation_history:
  title: 航空史上のこの日
  description: 本日の日付に関連する航空史上の事実（出典付き参考文献リスト）。
  hint: OPS情報：この日に起きた航空史上の出来事。返信は不要です。
bizav_arrival:
  title: 到着の手配（ビジネス）
  description: ビジネスフライトのTOD前：乗客を機体で送迎する車が手配されており、乗務員のホテルおよび送迎手段が確定しています。
  hint: 目的地でのフライトサポート：乗客を機体で送迎する車が手配されており、乗務員のホテルおよびFBOからの送迎も予約済みです。返信は不要です。
bizav_catering:
  title: ケータリング（ビジネス）
  description: ビジネスフライトの出発前：ケータリングの注文が確認され、機内に搬入されました。
  hint: フライトサポート：乗客用のケータリング注文が確認され、指定された時間までに機内へ搬入されます。返信は不要です。
bizav_eapis:
  title: eAPISマニフェスト（ビジネス、US）
  description: US行きのビジネスフライト出発前：eAPIS到着マニフェストがCBPに送信されました。
  hint: フライトサポート：USへ到着するプライベート航空機については、出発の少なくとも60分前までに、eAPISを通じて乗務員および乗客の到着マニフェストを米国税関・国境警備局（CBP）へ送信いたしました。ご返信は不要です。
bizav_fuel_release:
  title: 燃料供給許可（ビジネス）
  description: ビジネスフライトの出発前：出発空港向けの燃料供給許可が発行されます。
  hint: フライトサポート：この空港における計画ブロック燃料に対する燃料リリース（燃料供給業者との取り決め）が発行されており、給油担当者がこれを所持しています。返信は不要です。
bizav_handling:
  title: ハンドリング確認済み（ビジネス）
  description: ビジネスフライトの出発前：フライトサポートが、両空港でのグランドハンドリングを確認します。
  hint: フライトサポート（ビジネス航空機の旅程を手配する会社）：出発地および目的地でのグランドハンドリングが確認されました。FBO（ビジネス航空ターミナル）はお客様のスケジュールを把握しています。返信は不要です。
bizav_principal_late:
  title: 依頼主の遅延（ビジネス）
  description: ビジネスフライトの出発前：依頼主が遅れており、出発に15～45分の遅延があります。
  hint: フライトサポート：プリンシパル（主たる乗客、オーナー、またはクライアント）が遅れており、出発が指定された分だけ遅延します。それに応じて手配してください。返信は不要です。
block_report:
  title: ブロックタイム（OOOI）
  description: オンブロック後のブロックタイムおよび遅延コード。
  hint: 駐機後のブロック報告：OUT、OFF、ON、INの各時刻（オフブロック、離陸、着陸、オンブロック）、ブロック時間および飛行時間、搭載燃料量。遅延が発生した場合は、その原因を示すIATA遅延コードも併記してください。航空会社の記録用であり、返信は不要です。
cargo_act_failure:
  title: 温度管理コンテナの故障（貨物）
  description: 貨物便の出発前：医薬品を積載した能動型温度管理コンテナに不具合が発生し、交換されたため、出発が遅延し、15～30分遅れます。
  hint: 貨物管理：医薬品を積載したアクティブ温度管理コンテナ（ACT）が、積み込み前に故障を報告しました。現在、交換作業を行っており、これにより出発が指定された分だけ遅延します。返信は不要です。
cargo_final_loadsheet:
  title: 最終ロードシート（貨物）
  description: 貨物の直前の変更があった貨物便の最終ロードシート。
  hint: 貨物便の積載管理部門からの最終ロードシート：制限値（ZFW、TOW、LAW）に対する実際の重量、離陸燃料および航路燃料（TOF、TIF）、ならびに貨物の内容；LMCは、予備ロードシートに対する貨物の直前の変更を指します。数値を確認の上、FMSに入力してください。返信は不要です。
cargo_late_truck:
  title: トラックの遅延（貨物）
  description: 貨物便の出発前：予定されていた貨物を積載したトラックが遅延しているため、貨物の受付締切時間が延長され、出発が10～30分遅延します。
  hint: 貨物管理：当該便に予約済みの貨物を積載したトラックが遅延しているため、貨物受付締切時間が延長され、出発が指定された分だけ遅延します。それに応じてご手配ください。返信は不要です。
cargo_notoc:
  title: 危険物（NOTOC、貨物）
  description: 貨物便の出発前：機内に危険物が搭載されており、その一部は貨物機専用（CAO YES）です。機長の署名としてACKで返信してください。
  hint: 貨物便のNOTOC（機長への通知）：積載された危険物について、UN番号、分類、ハンドリングコード、貨物室内の配置位置、および梱包数を記載します。「CAO YES」の記載がある場合は、当該危険物が貨物機でのみ輸送が許可されていることを示します。「ACK」で受領確認を行ってください。これは機長の署名とみなされます。
  steps:
    reply:
      reply_hints:
        ACK: NOTOCをお読みになりました。これは署名とみなされます。
    notoc:
      hint: 貨物管理部門はあなたの確認を受領しました：その写しはフライトフォルダに保管され、積載監督者にも通知されます。返信は不要です。
cargo_prelim_loadsheet:
  title: 暫定ロードシート（貨物）
  description: 貨物便の暫定ロードシート：OFP に基づく計画値、乗客を含まない貨物のみ。
  hint: 貨物便の積載管理部門からの暫定ロードシート：飛行計画に基づく計画重量および燃料量（ZFW、TOF、TOW、TIF、LAWを最大許容値と比較）と貨物の情報です。FMSの準備にご利用ください。最終的な数値は最終ロードシートに記載されます。返信は不要です。
cargo_sort_shift:
  title: ハブでの仕分けが延期されました（貨物）
  description: 貨物便の巡航中：目的地ハブでの仕分けが予定より遅れて開始されるため、急ぐ必要はありません。
  hint: 貨物管理：目的地ハブでの貨物の仕分けが予定より遅れて開始されます（指定された分だけ遅れるため）、急ぐ必要はありません。ご参考まで。返信は不要です。
cargo_special_load:
  title: 特別貨物（貨物）
  description: 貨物便の出発前：機内に搭載されている特別貨物（生きた動物、生鮮品、医薬品、遺体、貴重品）とそのハンドリングコードについて。ACKで返信してください。
  hint: 貨物管理部からの特別貨物通知：飛行中または到着時に特別な配慮が必要な貨物について、IATAハンドリングコード、貨物室内の配置位置、および必要な条件（温度、優先荷下ろし）を明記します。ACKで受領確認を行ってください。
  steps:
    reply:
      reply_hints:
        ACK: 特別貨物の件は承知しております。
    ack:
      hint: 貨物管理部は、あなたの確認応答を受信し、目的地のハンドリング担当者に伝達しました。返信は不要です。
cargo_uld_damaged:
  title: 破損したULD（貨物）
  description: 貨物便の出発前：破損したULDが交換され、その貨物の一部が降ろされました。最終ロードシートには、同じ貨物のLMCが記載されています。
  hint: 積載管理：積載作業中にユニットロードデバイス（コンテナまたはパレット）に損傷が発見されました。その貨物は別のユニットに移され、収まらなかった部分は残されました。最終ロードシートにはこの変更が記載されます。返信は不要です。
cargo_weight_error:
  title: 重量修正（貨物）
  description: 貨物便の出発前：ULDの再計量結果が予約重量を上回りました。最終ロードシートには、貨物のLMCが記載されます。
  hint: 積載管理：1ユニットの再計量を行ったところ、予約重量を上回りました。この差分は直前の変更（LMC）であり、最終ロードシートに記載されます。返信は不要です。LMC）であり、最終ロードシートに記載されます。返信は不要です。
charter_group_lmc:
  title: ツアーグループの変更（チャーター便）
  description: チャーター便の出発前：ツアーグループの乗客が欠席した場合、または遅れて到着したグループが追加された場合、最終ロードシートには同じ乗客のLMCが記載されます。
  hint: チャーター便のハンドリング：ツアーオペレーターから、グループの変更（不参加または遅刻した乗客の追加）が報告されました。この数字は、最終ロードシートに記載される直前の変更（LMC）です。返信は不要です。
  steps:
    no_show:
      hint: チャーター便のハンドリング：ツアーグループの乗客が欠席しました。その手荷物は降ろされており、最終ロードシートに変更が反映されます。返信は不要です。
    added:
      hint: チャーター便のハンドリング：ツアーグループの一部が遅れて到着しましたが、受け入れられました。手荷物は積み込まれており、最終ロードシートに変更が反映されます。返信は不要です。
charter_sports_team:
  title: スポーツチーム（チャーター便）
  description: チャーター便の出発前：スポーツチームが搭乗し、貨物室には特大のスポーツ用具が積載されており、チャーター依頼者から特別な機内食が注文されています。
  hint: チャーター便のハンドリング：スポーツチームが当航空便を利用します。彼らの特大の用具は指定された貨物室に積み込まれており、チャーター依頼者から独自の機内食が注文されています。返信は不要です。
charter_tour_rep:
  title: 旅行会社担当者（チャーター便）
  description: チャーター便の出発前：ツアーオペレーターの担当者がグループのチェックインを完了し、PAによる簡単な歓迎アナウンスを依頼しています。
  hint: チャーター便のハンドリング：ツアーオペレーターの担当者がゲートに待機しており、グループのチェックインが完了しています。担当者は、搭乗完了後にPAで簡単な歓迎の挨拶を行いたいと希望しています。返信は不要です。
charter_transfer:
  title: 目的地での送迎（チャーター便）
  description: チャーター便のTOD前：乗客用の送迎バスが目的地で待機しており、ツアーオペレーターの担当者が出迎えます。
  hint: 目的地でのチャーター便のハンドリング：ツアーオペレーターのバスが乗客をお待ちしており、担当者が到着ロビーでお出迎えいたします。機内アナウンスに役立ちます。返信は不要です。
charter_vip:
  title: VIPチャーター
  description: チャーター便の出発前：VIPの一行が車で航空機に到着し、最後に搭乗します。機内食はご要望に応じてご用意いたします。
  hint: チャーター便のハンドリング：これはVIPチャーター便です。一行は車で機体まで来て最後に搭乗し、機内食は彼らの注文通りとなります。返信は不要です。
cmd_delay:
  title: パイロットコマンド：DELAY
  description: DELAYコマンド：新しいオフブロック時刻を確認するものです。
  hint: OPSがDELAY報告を確認します：報告された遅延時間（分）と理由、新しい推定離ブロック時刻（EOBT）、およびフライトの総遅延時間です。返信は不要です。
cmd_divert:
  title: パイロットコマンド：DIVERT
  description: DIVERTコマンド：ダイバートを承認します。
  hint: OPSは、貴機のDIVERTを受領し、ダイバート先の空港のハンドリング担当者に通知いたしました。現地での手配を行うため、理由の連絡をお願いしております。
  steps:
    reply:
      reply_hints:
        WX: 目的地での気象状況。
        TECH: 航空機に技術的な問題が発生しました。
        MEDICAL: 機内に医療対応が必要な乗客がいます。
        FUEL: 目的地まで飛行するのに十分な燃料がありません。
        OTHER: その他の理由。
    medical:
      hint: OPSは、ダイバート空港に医療チームを手配しており、可能であれば自由文テレックスにて乗客の詳細情報を送信するよう依頼しています。
    tech:
      hint: 整備管理部は状況を把握しており、ダイバート空港にて整備士がお迎えに参ります。故障の概要を簡潔にまとめ、自由文テレックスにて送信してください。
    fuel:
      hint: OPSが、ダイバート先空港での燃料の手配を済ませております。返信は不要です。
    wx:
      hint: OPSでは、気象によるダイバートを把握しており、乗客の再予約を進めております。返信は不要です。
    msg:
      hint: ダイバート先の空港でのスポットはまだ確定しておりません。可能になりましたら、自由文テレックスにて、同空港へのETAをお知らせください。
cmd_divert_eta:
  title: パイロットコマンド：DIVERT、距離およびETA
  description: 飛行計画上の空港へのDIVERT後：現在位置からの距離と、現在の対地速度でのETA。
  hint: 現在位置から指定されたダイバート空港までの距離、および現在の対地速度での同空港へのETA。返信は不要です。
cmd_eta:
  title: パイロットコマンド：ETA
  description: 計画時刻に基づく、飛行中のETA指令。
  hint: ETAへの回答：スケジュールに基づく推定到着時刻（STA）、搭乗ゲートまたは駐機スポット、およびOPSが乗り継ぎ便に通知した乗り継ぎ乗客の数です。返信は不要です。
cmd_eta_ground:
  title: パイロットコマンド：ETA、離陸前
  description: 離陸前のETA指令。
  hint: 出発前のETAへの回答：スケジュール（STA）および乗り継ぎ乗客を踏まえた、推定オフブロック（EOBT）時刻およびオンブロック（EST IN）時刻。返信は不要です。
cmd_eta_gs:
  title: パイロットコマンド：ETA（地上速度に基づく）
  description: 対地速度と残り距離に基づくETAの指示。
  hint: 飛行中のETAへの回答：地表速度と残り距離に基づく到着時刻を、スケジュール（STA）との比較で、搭乗ゲートまたは駐機スポット、およびOPSが乗り継ぎ便に通知した乗り継ぎ乗客数とともに伝えます。返信は不要です。
cmd_gate_change:
  title: パイロットコマンド：REQ GATE CHANGE
  description: REQ GATE CHANGE [ゲート] [理由]（ブロック前）：OPSが承認（70％、空きが確認されているゲートの場合は指定されたゲート）するか、すべてのゲートが使用中であると伝えます。その後、到着情報で新しいゲート名が指定されます。
  hint: OPSがREQ GATE CHANGEへの回答を行います：変更が承認された場合は新しいゲート、承認されない場合はその理由と、現在使用中のゲートを通知します。返信は不要です。
cmd_gate_change_none:
  title: パイロットコマンド：REQ GATE CHANGE、ゲートデータなし
  description: ゲートがまだ判明していない場合、代替ゲートがない場合、または便が迂回する場合に「REQ GATE CHANGE」と送信されます。
  hint: OPSは現時点でゲートを変更できません：ゲートがまだ確定していない場合、代替ゲートがない場合、または迂回している場合です。このメッセージは、OPSが把握している貴便のゲート情報を繰り返すものです。返信は不要です。
cmd_help:
  title: パイロットコマンド：HELP
  description: HELPコマンド：パイロットコマンドの一覧です。
  hint: 自由文はテレックスとしてOPSに送信されます。HELPと送信すると、OPSが理解するコマンドの一覧が返されます。コマンドはテレックスとして航空会社局に送信してください。ATC LOGONおよび出発管制承認（DCL）は、XATC局（X + FIR、X + 出発空港）に送信されます。
cmd_medical:
  title: パイロットコマンド：MEDICAL
  description: MEDICAL <TEXT> 飛行中：乗務員から医療事案の報告がありました。OPS（OPS）はCONTINUEかDIVERTの選択を求めます（10分経過後はデフォルトでCONTINUEとなります）。DIVERTを選択した場合は、出発地および代替空港のうち最も近い場所へ迂回します。救急隊員が機体に出迎えに参ります。
  hint: OPSは、貴機の医療報告書を受領し、飛行中の乗務員に助言を行う地上の医師グループであるMedLinkに連絡しました。目的地へ直行するか、迂回するかを尋ねています。
  steps:
    reply:
      reply_hints:
        CONTINUE: 目的地へ飛行を継続してください。
        DIVERT: 迂回してください。（DIVERT EDDM）の語句の後に、空港のICAOコードを追加しても構いません。
    divert:
      hint: OPSより、ダイバート空港の確認が取れ、現地での救急車およびハンドリングの手配が完了しました。可能になりましたら、自由文テレックスにて新しいETAをお知らせください。
    divert_2:
      hint: 救急隊員が機体のドアで待機しています。患者は他の乗客より先に機外へ降機します。返信は不要です。
    continue:
      hint: OPSより、目的地へ引き続き飛行すること、およびATCに優先措置を要請するよう指示がありました。返信は不要です。
    continue_2:
      hint: 救急隊員が機体のドアで待機しています。患者は他の乗客より先に機外へ降機します。返信は不要です。
cmd_rdy:
  title: パイロットコマンド：RDY
  description: RDY（CTOTが発行済み、ブロック離脱前）：READY MSG SENT；その後（40％の確率で）より早いCTOTまたはNO IMPROVEMENTとなります。
  hint: OPSより、ATCフロー管理へ「準備完了」メッセージ（RDY：乗務員はスロットより早く出発可能です）が送信されました。更新情報が届くまでは、現在のCTOTに基づいて計画を続けてください。返信は不要です。
  steps:
    met:
      hint: 「準備完了」メッセージへの回答：フロー管理からより早いスロットが割り当てられました。新しいCTOTでの離陸を計画してください。返信は不要です。
    timeout:
      hint: 「準備完了」メッセージへの回答：より早いスロットに空きがなく、CTOTは変更されません。返信は不要です。
cmd_rdy_none:
  title: パイロットコマンド：RDY、スロットなし
  description: RDYがない場合のRDY、またはレディメッセージの送信時期が早すぎる／遅すぎる場合（EOBT-15分前からCTOTからタキシング時間を差し引いた時間まで）。
  hint: OPSは現在、レディメッセージを送信できません：フライトにスロット（CTOT）がないか、または送信時期が早すぎたり遅すぎたりするためです。EOBTに近づき、準備が整い次第、RDYを送信してください。返信は不要です。
cmd_req_atis:
  title: パイロットコマンド：REQ ATIS
  description: REQ ATIS [ICAO]：その空港のオンラインVATSIM ATISのテキスト（ICAOがない場合は目的地）。オンラインATISがない場合：NO ATIS AVBLおよびMETAR。
  hint: REQ ATIS <ICAO> は、空港のATISを要求します（空欄の場合は目的地）。回答は、VATSIM上のオンラインATISの本文と情報レターとなります。返信は不要です。
cmd_req_atis_none:
  title: パイロットコマンド：REQ ATIS、ATISなし
  description: ATISがオンラインでない場合のREQ ATISリクエスト：NO ATIS AVBLおよび最新のMETAR。
  hint: REQ ATISへの回答：VATSIM上でその空港のATISがオンラインになっていないため、OPSが代わりに最新のMETARを送信します。返信は不要です。
cmd_req_gate:
  title: パイロットコマンド：REQ GATE
  description: REQ GATEコマンド：到着ゲート。
  hint: REQ GATEは、OPSにあなたの到着ゲートを問い合わせます。回答には、目的地で予定されているゲートまたはスポット、手荷物受取所、およびSTAが含まれます。返信は不要です。
cmd_req_gate_divert:
  title: パイロットコマンド：REQ GATE、迂回中
  description: 迂回中のREQ GATEコマンド。
  hint: 迂回中のREQ GATEへの回答：ダイバート先の空港でのスポットはまだ不明ですが、現地のハンドリング担当者が案内します。返信は不要です。
cmd_req_loadsheet:
  title: パイロットコマンド：REQ LOADSHEET
  description: REQ LOADSHEETコマンド：ロードシートを再送信します。
  hint: REQ LOADSHEET：OPSに対し、ロードシートの再送信を依頼します。返信には、当該フライトの最新のロードシート（暫定版または最終版）が転送されます。返信は不要です。
cmd_req_loadsheet_bizav:
  title: パイロットコマンド：REQ LOADSHEET（ビジネス）
  description: ビジネスフライトにおける「REQ LOADSHEET」コマンド：ロードシートは発行されず、乗務員が重量・バランス計算を行います。
  hint: ビジネスフライトにおける「REQ LOADSHEET」への回答：フライトサポートからはロードシートは発行されません。重量・バランス計算は乗務員が行います。返信は不要です。
cmd_req_loadsheet_cargo:
  title: パイロットコマンド：REQ LOADSHEET（貨物）
  description: 貨物便における「REQ LOADSHEET」コマンド：貨物ロードシートを再送信します。
  hint: REQ LOADSHEETは、積荷管理にロードシートの再送信を依頼するものです。回答には、当該貨物便の最新のロードシート（暫定版または最終版）が繰り返されます。返信は不要です。
cmd_req_loadsheet_ferry:
  title: パイロットコマンド：REQ LOADSHEET（フェリー）
  description: フェリーフライトにおける「REQ LOADSHEET」コマンド：乗務員専用のロードシートを再送します。
  hint: REQ LOADSHEETは、積載管理にロードシートの再送を依頼するものです。返信には、当該フェリーフライトの乗務員専用ロードシートが繰り返されます。返信は不要です。
cmd_req_loadsheet_ferry_none:
  title: パイロットコマンド：REQ LOADSHEET、まだなし（フェリー）
  description: ロードシートがまだ作成されていないフェリー飛行中の「REQ LOADSHEET」指令。
  hint: フェリー飛行中の「REQ LOADSHEET」への回答：ロードシートはまだ発行されていません。発行され次第、その旨をメッセージで通知します。返信は不要です。
cmd_req_loadsheet_none:
  title: パイロットコマンド：REQ LOADSHEET、まだありません
  description: ロードシートがまだ存在しない状態での「REQ LOADSHEET」コマンド。
  hint: REQ LOADSHEETへの回答：このフライトのロードシートはまだ発行されていません。予備のロードシートが発行された際は、その旨がメッセージで通知されます。返信は不要です。
cmd_req_wx:
  title: パイロットコマンド：REQ WX
  description: REQ WXコマンド：OFPのMETARに基づく気象情報。
  hint: REQ WX <ICAO>：OPSに対し、空港（空欄の場合は目的地）の気象情報を問い合わせます。この回答には、飛行計画に基づくMETARが含まれます。返信は不要です。
cmd_req_wx_live:
  title: パイロットコマンド：REQ WX（リアルタイム）
  description: リアルタイムの気象データを含む「REQ WX」コマンド。
  hint: REQ WX <ICAO>：OPSに対し、空港（空欄の場合は目的地）の気象情報を問い合わせるものです。この回答には、最新のMETARおよびTAFが含まれます。返信は不要です。
cmd_req_wx_no_data:
  title: パイロットコマンド：REQ WX、データなし
  description: 空港の気象データがない場合のREQ WXコマンド。
  hint: REQ WXへの回答：OPSにはその空港の気象情報がありません。ICAOコードを確認するか、後で再度お問い合わせください。返信は不要です。
connection_held:
  title: 接続便の待機
  description: 乗り継ぎ時間が15～40分残っている短時間の乗り継ぎ後、待機中：乗客のために次の便が待機しています。
  hint: 乗り継ぎ：乗り継ぎ乗客の次の便は、その乗客のために待機しており、出発が遅れます。ゲートには乗り継ぎバスが待機しています。乗り継ぎ乗客を先に降機させてください。返信は不要です。
connection_made:
  title: 乗り継ぎ完了
  description: 短い乗り継ぎで残り時間が40分以上ある場合の待機状態：次の便は待機しています。
  hint: 乗り継ぎ：乗り継ぎ客の次の便は、その乗客を待ちます。乗り継ぎバスがゲートに待機しています。返信は不要です。
connection_missed:
  title: 乗り継ぎに失敗しました
  description: 残り15分未満の短い乗り継ぎ後の待機中：乗客は再予約されました。
  hint: 乗り継ぎ：次の乗り継ぎ便のチェックインは終了しており、乗り継ぎの乗客は再予約済みで、乗り継ぎカウンターが対応いたします。返信は不要です。
connex_list:
  title: 目的地での乗り継ぎ便
  description: TOD前：目的地からの当該航空会社の出発便最大4便について、目的地、STD、ゲート情報を含みます（AeroDataBox、お客様のRapidAPIキー）。
  hint: 乗り継ぎ便（CONNEX）：目的地からの自社航空会社の出発便（フライト番号、目的地、STD、ゲートを含む、AeroDataBoxより取得）で、乗り継ぎ便に関する乗客へのアナウンス用です。返信は不要です。
crew_duty_limit:
  title: 乗務員の勤務時間が上限に達しました
  description: 30分以上の遅延が発生した後のゲートにて：最終離ブロック時刻。EXTEND（機長の裁量）を選択した場合は、次のフライトへのメモを残します。NO（デフォルト）を選択した場合は、待機乗務員が配置されます。
  hint: 乗務管理部：この遅延は、乗務員が勤務できる時間であるフライト勤務期間（FDP）に食い込みます。このメッセージには、ブロック離脱の最終時刻が示されています。これを過ぎた場合、機長は裁量権に基づき勤務時間を延長する必要があります。延長するかどうかを返信してください。
  steps:
    reply:
      reply_hints:
        EXTEND: 機長は裁量権を行使し、必要に応じて勤務時間を延長いたします。
        NO: 当直は延長されません。
    extend:
      hint: 乗務管理部は、機長の裁量決定を記録しました。裁量報告書を提出してください。乗務員は、次の勤務前に延長休息を取得します。返信は不要です。
    no:
      hint: 乗務管理部は待機乗務員に通知を行いました。指定された最終時刻までにブロックを離脱できない場合、乗務員が交代となります。返信は不要です。
    met:
      hint: 最終離ブロック時刻を過ぎました：乗務員交代が命じられ、新しい乗務員の報告時刻および予想される遅延時間が通知されます。返信は不要です。
crew_info:
  title: 乗務員情報
  description: 乗務員の氏名および客室乗務員の人数。
  hint: 乗務員管理部からの当該フライトの乗務員リスト：機長（CPT）、副操縦士（FO）、上級客室乗務員（SCCM）、および客室乗務員の人数。返信は不要です。
curfew_dest:
  title: 目的地での夜間飛行禁止時間
  description: 巡航中に、推定着陸時刻が目的地での夜間飛行禁止時間（実際の規制がある空港のみ、通常は遅延が発生した場合）に近づいている場合。ABLE：優先扱いを要請済み；UNABLE：代替空港へ迂回。
  hint: 目的地には夜間騒音規制（夜間騒音制限）が設けられています。最遅着陸時刻（UTCおよび現地時間）と、それまでの余裕時間をご確認ください。可能であれば飛行を早め、夜間騒音規制前に着陸できるかどうかをOPSに伝えてください。
  steps:
    reply:
      reply_hints:
        ABLE: 夜間飛行禁止時間前に着陸できる見込みです。
        UNABLE: 夜間飛行禁止時間前に着陸することはできません。
    able:
      hint: OPSが貴便の優先処理を要請しており、ハンドリングは待機中です。万が一遅れる場合は、代替空港への対応を計画してください。返信は不要です。
    unable:
      hint: OPSが代替空港へのダイバートを計画しています。ホテルとバスを手配しており、乗客は陸路で目的地へ向かいます。返信は不要です。
deicing_holdover:
  title: 除氷およびホールドオーバー時間
  description: 出発地が3℃以下の場合、ゲートにて：除氷液の種類とパッド。READYの後に：除氷車とホールドオーバー時間。
  hint: 出発地では気温が低いため、除氷が必要です。除氷液の種類、除氷用パッド、およびその場所での所要時間をご確認ください。ドアが閉まったら「READY」と返信してください。
  steps:
    reply:
      reply_hints:
        READY: ドアが閉まりました。除氷の準備が整いました。
    deicing:
      hint: 除氷車が貴機の駐機スポットに配属されており、除氷液の配合およびホールドオーバー時間（除氷液が機体を新たな着氷から保護し続ける時間）が指定されています。離陸前にホールドオーバー時間の表をご確認ください。返信は不要です。
dep_fire:
  title: 出発空港での火災
  description: 予定出発時刻の30分前から離陸滑走開始まで：出発空港内またはその付近（予定滑走路の脇のランダムな地点）で火災が発生しており、出発は20～90分間停止され、20分ごとに最新情報が提供されます。
  hint: 出発空港のOPS：空港内またはその付近で火災が発生しており、救助隊が現場に駆けつけており、出発が停止されています。遅延が見込まれますので、ATCの指示に従ってください。このメッセージには次回の更新時刻が記載されています。返信は不要です。
  steps:
    met:
      hint: 出発空港のOPS：火災は鎮火し、出発が再開されました。ATCから許可が出次第、エンジンを始動してください。返信は不要です。
departure_report:
  title: 出発報告（OUT/OFF）
  description: 遅延コード付きの離ブロック時刻および離陸時刻。
  hint: 出発報告：実際のオフブロック（OUT）および離陸（OFF）時刻、ならびに予定時刻（STA）に対する到着予定時刻（ETA）；遅延が発生した場合は、そのIATA遅延コードも記載されます。返信は不要です。
dest_fire:
  title: 目的地空港での火災
  description: 目的地まで約120NMの地点：目的地空港内またはその付近（計画された滑走路の脇のランダムな地点）で火災が発生しており、煙が風下へ流れています。20分から2時間以内に鎮火する見込みで、20分ごとに最新情報が提供されます。HOLD（デフォルト）または代替空港へのDIVERTを行ってください。
  hint: 目的地空港のOPS：空港内またはその付近で火災が発生しており、煙が風に乗って流れており、その範囲内では視界が悪化しています。現場には救助隊が到着しています。現時点では状況の予測が立ちません。代替空港へのダイバート準備を行い、待機するかダイバートするかをOPSに伝えてください。
  steps:
    reply:
      reply_hints:
        HOLD: 待機し、空港からの指示をお待ちください。OPSより指定された時間に最新情報をお伝えします。
        DIVERT: 代替空港、または「DIVERT EDDM」という語句の後に空港名を付記した別の空港へ迂回してください。
    hold:
      hint: OPSは、待機中であることを確認しております。次回の更新は指定された時刻に行われます。燃料が危機的状況になった場合は、自由文テレックスでOPSに連絡してください。
    reply_2:
      reply_hints:
        HOLD: ホールディングを継続し、次の更新情報を待ってください。
        DIVERT: 代替空港、または「DIVERT EDDM」という語句の後に空港名を記載した別の空港へ迂回してください。
    hold_2:
      hint: 目的地OPSからの最新情報：火災は依然として燃え続けています。待機を続けるか、迂回するかをOPSにお知らせください。
    divert:
      hint: OPSは、ダイバートおよびその距離を記録し、現地でのハンドリングおよび燃料の手配を指示しています。可能になり次第、自由文テレックスにてETAをお送りください。
    met:
      hint: 火災は鎮火し、目的地への到着便は再開されています。通常の進入を予定してください。返信は不要です。
    divert_2:
      hint: OPSは、ダイバートおよびその距離を記録し、現地でのハンドリングおよび燃料の手配を指示しています。可能になり次第、自由文テレックスにてETAをお送りください。
dest_weather:
  title: TOD前の目的地気象情報
  description: OFPのMETARに基づく目的地および代替空港の気象情報（TOD前）。
  hint: 降下開始点（TOD）前の目的地および代替空港の気象状況（飛行計画に基づくMETAR）。これはアプローチブリーフィング用です。返信は不要です。
dest_weather_live:
  title: TOD前の目的地気象（リアルタイム）
  description: TOD前のリアルタイムMETAR/TAFに基づく目的地および代替空港の気象情報。
  hint: 降下開始前の目的地（METARおよびTAF）および代替空港（METAR）の現在の気象状況。これはアプローチブリーフィング用です。返信は不要です。
dg_notoc:
  title: 危険物（NOTOC）
  description: 出発前：機内に危険物が搭載されていること、UN番号、クラス、配置場所。機長の署名としてACKで返信してください。
  hint: NOTOC（機長への通知）：危険物が積載されており、UN番号、分類、貨物室内の配置位置、および梱包数が記載されています。「CAO NO」と記載されている場合は、旅客機への搭載が許可されていることを意味します。「ACK」で受領確認を行ってください。これが機長の署名として扱われます。
  steps:
    reply:
      reply_hints:
        ACK: NOTOCをお読みになりました。これは署名とみなされます。
    notoc:
      hint: 積載管理部門はあなたの確認を受領しました。その写しはフライトフォルダーに保管され、積載監督者にも通知されます。返信は不要です。
discretion_followup:
  title: 裁量に基づく乗務員の休息（次のフライト）
  description: 機長の裁量による措置後の次のフライト前：休息期間が延長され、予備の副操縦士が乗務に加わります。
  hint: 乗務管理：前のフライトで機長の裁量により（勤務時間が制限を超えて延長された場合）、乗務員は延長休息を取得し、予備の副操縦士が乗務に加わります。ブリーフィングの時間はメッセージに記載されています。返信は不要です。
divert_arrival:
  title: ダイバート空港への到着
  description: ダイバート後の待機中：ハンドリング、燃料、乗客の手配を行い、新しい飛行計画の申請を行います。その空港から出発する次の便のためにメモを残します。
  hint: ダイバート後のOPS：ハンドリングと燃料の手配が行われ、乗客のケアが行われ、目的地行きの乗客の再予約が行われます。OPSは、自由文テレックスで燃料要求と新しい出発時刻（ETD）を照会します。
drone_activity:
  title: 目的地でのドローンの活動
  description: 約90NMの地点：ドローンの影響により、到着便が30分から3時間の間停止されています。状況は20分ごとに更新されます。HOLD（デフォルト）または代替空港へのDIVERTを行ってください。
  hint: "| 目的地側のOPSより：空港付近でドローンの目撃情報が報告され、到着便の運航が停止されています。再開の見通しはまだ立っておりません。待機するか、代替空港へ迂回するかをOPSにお知らせください。"
  steps:
    reply:
      reply_hints:
        HOLD: 空港からの指示を待機してください。OPSより指定された時間に最新情報をお伝えします。
        DIVERT: 代替空港、または「DIVERT EDDM」という語句で指定された別の空港へ迂回してください。
    hold:
      hint: OPSは、貴機がホールディング中であることを記録します。次回の更新は指定された時刻に行われます。燃料が危機的な状態になった場合は、自由文テレックスでOPSにその旨をお知らせください。
    reply_2:
      reply_hints:
        HOLD: ホールディングを継続し、次の更新をお待ちください。
        DIVERT: 代替空港、または「DIVERT EDDM」という語句で指定された別の空港へ迂回してください。
    hold_2:
      hint: 目的地側のOPSからの最新情報：到着便の受け入れは依然として停止されています。待機を続けるか、迂回するかをOPSにお知らせください。
    divert:
      hint: OPSは、ダイバートおよびその距離を記録します。現地でのハンドリングが指示され、乗客情報が送信されます。返信は不要です。
    met:
      hint: ドローンの活動が終了し、目的地への到着便が再開されました：通常の進入を予定してください。返信は不要です。
    divert_2:
      hint: OPSは、ダイバートおよびその距離を記録します。現地でのハンドリングが指示され、乗客情報が送信されます。返信は不要です。
earthquake_dest:
  title: 目的地付近での地震
  description: 過去24時間以内に目的地から100 km圏内で発生したM5.0以上の地震（USGS）。
  hint: OPS情報：目的地付近で最近発生した地震について、マグニチュード、発生場所、空港からの距離、および震源の深さ（USGS）を記載しています。空港の状況についてはNOTAMをご確認ください。返信は不要です。
emergency_mayday:
  title: MAYDAYを発令
  description: 乗務員は、XATC局を通じてATCにMAYDAYを発信しました。航空会社の緊急対応デスクは、最寄りの適切な空港へのDIVERTを提案し（5分経過後はデフォルトでDIVERT）、現地の救助隊および医療サービスに連絡します。地上では、航空機がスポットに停泊している空港のサービス機関に連絡します。XATC局へのMAYDAY発信後にのみ開始されます。
  hint: 航空会社の緊急対応デスクは、ATCを通じてMAYDAYの通報を受け取り、最寄りの適切な空港とその距離を通知します。迂回するか、そのまま飛行を続けるかをOPSに伝えてください。
  steps:
    ground:
      hint: 地上にいる間に、航空会社の緊急対応デスクがATCを通じてMAYDAYからあなたのMAYDAYを受信しました。空港の救助隊および消防隊には通報済みです。今後の対応方針を自由文テレックスでOPSに伝えてください。
    reply:
      reply_hints:
        DIVERT: 最寄りの適切な空港、または「DIVERT EDDM」という語句で指定された別の空港へ迂回してください。
        CONTINUE: 目的地へ飛行を継続してください。
    divert:
      hint: OPSがダイバート先空港とその距離を確認します。救助隊および消防隊に通報し、医療支援およびハンドリングの手配が行われます。可能になりましたら、自由文テレックスにて新しいETAをお送りください。
    continue:
      hint: OPSは、目的地へ直行することを確認します。現地の救助隊および消防隊には通報済みです。計画に変更がある場合は、OPSまでお知らせください。返信は不要です。
emergency_pan:
  title: PAN PANを発信しました
  description: 乗務員は、XATC局を通じてATCにPAN PANを宣言しました。航空会社のデスクは、DIVERTまたはCONTINUE（5分経過後はデフォルトでCONTINUE）の選択肢を提示し、目的地での救助および医療サービスを待機状態にします。地上では、航空機が停泊している空港のサービスが待機状態となります。PAN PANをXATCに送信した後にのみ開始されます。
  hint: 航空会社の緊急対応デスクは、ATCを通じてPAN PANからあなたのPAN PANを受信しました。目的地は通知されており、現地の救助隊および医療サービスが待機しています。最寄りの適切な空港を案内し、迂回するか、そのまま飛行を続けるかを尋ねます。
  steps:
    ground:
      hint: 地上にいる間に、航空会社の緊急対応デスクがATCを通じてあなたのPAN PANを受信しました。空港の救助隊および医療サービスは待機しています。自由文テレックスでOPSに今後の対応方針をお知らせください。
    reply:
      reply_hints:
        DIVERT: 最寄りの適切な空港、または「DIVERT EDDM」という指示に従って指定された別の空港へ迂回してください。
        CONTINUE: 目的地へ飛行を継続してください。
    divert:
      hint: OPSが、ダイバート先の空港とその距離を確認します。当該空港への救助隊およびハンドリングの手配が行われます。可能になり次第、自由文テレックスで新しいETAをお送りください。
    continue:
      hint: OPSは、目的地へ直行することを確認します。状況に変化があった場合は、OPSに連絡してください。返信は不要です。
f1_result:
  title: F1の結果
  description: フライト中に終了したグランプリ：表彰台（Jolpica）。
  hint: OPS情報：フライト中に終了したF1グランプリの結果です。返信は不要です。
ferry_after_mx:
  title: 整備後のフェリー飛行（フェリー）
  description: フェリー飛行前：航空機が整備を終え、運航許可が下りています。技術ログを確認してください。
  hint: 整備管理：航空機は整備を終え、運航許可が下りています。出発前に技術ログの記載内容を確認してください。返信は不要です。
ferry_loadsheet:
  title: ロードシート（フェリー）
  description: フェリー飛行のロードシート：乗務員のみ、乗客および貨物なし。
  hint: フェリーまたはポジショニングフライトのロードシート：乗務員のみ、乗客および貨物はなし。重量（ZFW、TOW、LAWと最大許容値の比較）および離陸燃料と航行燃料が記載されています。数値を確認し、FMSに入力してください。返信は不要です。
ferry_permit:
  title: フェリー許可（ferry）
  description: フェリー飛行の前：航空機は、特別飛行許可（US）または飛行許可に基づき、整備拠点へ向かいます。ACKと返信してください。
  hint: 整備管制：当該航空機は耐空性要件を完全に満たしていませんが、フェリー許可証に基づき整備基地へ飛行することが可能です。許可証およびその制限事項は航空機書類に記載されています。内容をご確認の上、ACKで受領確認を行ってください。
  steps:
    reply:
      reply_hints:
        ACK: 許可証およびその制限事項をお読みになりました。
    ack:
      hint: 整備管制は、あなたの確認応答を受信しました。目的地の整備基地では、航空機の到着を待っています。返信は不要です。
ferry_positioning:
  title: 次のフライトに向けた位置調整（フェリー）
  description: フェリー飛行の巡航中：航空機は次の出発に向けて位置を調整します（実際のAeroDataBoxデータのみ）。
  hint: 運航：このフライトでは、AeroDataBoxからのフライト番号、ルート、STDに基づき、目的地からの次回の出発に向けた機体の位置調整を行います。返信は不要です。
final_loadsheet:
  title: 最終ロードシート
  description: 予備版に対する直前の変更が反映された最終ロードシート。
  hint: 積載管理部門からの最終ロードシート：制限値（ZFW：燃料ゼロ、TOW：離陸、LAW：着陸）に対する実際の重量、離陸燃料および航行燃料（TOF、TIF）、乗客および貨物；LMCは、予備ロードシートに対する直前の変更です。数値を確認し、FMSに入力してください。返信は不要です。
fuel_monitoring:
  title: 燃料が計画値を下回っています
  description: 巡航中、搭載燃料がその地点におけるOFP計画より5％以上（少なくとも500 kg）下回った場合、運航管理は理由（WX、ATC、LEAK、またはNORMAL）を尋ねます。
  hint: 運航管理は、機内の燃料量が、この地点における飛行計画上の数値より、指定された量だけ不足していることを確認しました。その理由を尋ねてきます。
  steps:
    reply:
      reply_hints:
        WX: 気象：逸脱、風、着氷。
        ATC: ATC：予定とは異なる航路、高度、またはホールディング。
        LEAK: 燃料漏れが疑われます。
        NORMAL: 異常はなく、この差異は想定の範囲内です。
    wx:
      hint: 運航管理は、理由として気象を挙げ、目的地および代替空港での燃料量を再確認するよう求めています。燃料量が規定の最低量を下回っている場合は、自由文テレックスで運航管理に報告してください。返信は不要です。
    atc:
      hint: 運航管理は、理由としてATCを挙げており、ATCに直行ルートまたはより適切な高度を依頼するよう提案しています。燃料が規定の最低量を下回った場合は、自由文テレックスで運航管理に連絡してください。返信は不要です。
    leak:
      hint: 運航管理は燃料漏れを疑っています。燃料系統を確認してください。最寄りの代替空港とその距離が通知されます。漏れが確認された場合は、その空港へ迂回してください。返信は不要です。
    normal:
      hint: 運航管理はこれを記録しました。燃料量を注視し、差が拡大した場合は運航管理に報告してください。返信は不要です。
fuel_slip:
  title: 燃料スリップ
  description: 給油後：給油量および計画からの逸脱。
  hint: 給油後の燃料スリップ：ランプ燃料計画量、搭載燃料量、給油量および計画からの逸脱量、ならびに飛行計画における燃料の内訳（タキシング、航行、予備、代替空港、最終予備、追加）が記載されています。返信は不要です。
gate_assignment:
  title: ゲート割り当て
  description: 出発ゲートの割り当て。
  hint: OPSから、目的地での予想ゲートまたはスポットが通知されます。返信は不要です。
gate_reassignment:
  title: ゲートの再割り当て
  description: 降下開始時に割り当てられたゲートが使用中となっている場合：新しいゲートが割り当てられ、それ以降は到着情報およびREQ GATEでその新しいゲートが使用されます。
  hint: ゲート変更：割り当てられたゲートが使用中（理由はメッセージに記載されています）のため、新しいゲートが割り当てられます。手荷物受取所の位置は変わりません。到着情報およびREQ GATEには、新しいゲートが表示されます。返信は不要です。
hard_landing_check:
  title: ハードランディングの確認
  description: ブロック上で、着陸速度が350 ft/minを超えていた場合（ブリッジの測定値が必要です）：整備担当者がハードランディングのCONFIRMを求めます。「CONFIRM」と回答すると、当該航空機の次回飛行前に点検が実施されます。
  hint: 整備管理：フライトデータモニタリング（FDM）により、指定された速度での着陸が記録されました。乗務員がハードランディングを感じたかどうかをお伺いします。
  steps:
    reply:
      reply_hints:
        CONFIRM: はい、乗務員はハードランディングを確認しました。
        NEGATIVE: いいえ、乗務員は感じていませんでした。
    confirm:
      hint: 技術日誌にハードランディングを記録してください：次の飛行の前に、航空機は整備マニュアル（AMM）に基づいて点検を受けます。返信は不要です。
    negative:
      hint: 整備担当者は、乗務員からハードランディングの報告がなかったことを記録し、飛行データを保管します。返信は不要です。
hard_landing_followup:
  title: ハードランディングの点検完了
  description: ハードランディングが確認された後の同一機体での飛行前：整備部門より、点検が完了し、機体が運航許可されたとの報告があります。
  hint: 整備管理：本機でハードランディングが報告された後、点検が完了し、損傷は確認されず、機体は飛行許可されました。返信は不要です。
hold_fuel_watch:
  title: ホールディング中の最低ダイバート用燃料量
  description: 航空会社による閉鎖の発表を受けてホールディング中に、燃料残量がダイバート最低基準に達した場合：DIVERTが推奨されます（ホールディングを継続する場合はSTAYと返信してください）。5分以内に回答がない場合、当該便は代替空港へ誘導されます。
  hint: 目的地側のOPS：待機中に、燃料残量が代替空港へのダイバートに必要な最低量まで減少しました。OPSは直ちにダイバートすることを推奨しており、ダイバートするか、それとも待機を続けるかを確認しています。
  steps:
    reply:
      reply_hints:
        DIVERT: 直ちに代替空港へ迂回してください。
        STAY: ホールディング状態を維持します。機長の判断によります。
    divert:
      hint: OPSは、代替空港へのダイバートを承知し、現地でのハンドリングおよび燃料の手配を指示しました。可能になり次第、自由文テレックスにてETAをお知らせください。
    stay:
      hint: OPSは、機長の判断によりホールディング状態を維持していることを確認し、自由文テレックスにて燃料残量を報告するよう求めています。
holiday_dest:
  title: 目的地での祝日
  description: 到着日の現地時間において、目的地国で国民の祝日があります（Nager.Date）。
  hint: OPS情報：本日、目的地国で祝日です。空港サービスの祝日営業時間が適用される見込みです。返信は不要です。
landing_data:
  title: 着陸データ
  description: OFPからの着陸データ：滑走路、気象状況、フラップ、およびVREF（VREFに情報が記載されている場合）。
  hint: 飛行計画に基づく着陸データ：滑走路およびSTAR、空港標高、遷移高度、着陸重量と制限値との比較、着陸用燃料および代替空港までの燃料量；飛行計画に記載がある場合は、フラップおよびVREF。アプローチブリーフィングについては、返信の必要はありません。
lost_baggage:
  title: 置き忘れられた手荷物
  description: 「On block」：出発地で手荷物が置き忘れられた（乗り継ぎ漏れ）、ベルトコンベア横のPIRカウンター。次の便で件は解決となります。
  hint: 手荷物：一部の手荷物が出発地で積み込まれませんでした（乗り継ぎ漏れ）。乗客は手荷物受取所（PIR、Property Irregularity Report）でその旨を報告します。手荷物は次の便で送られます。返信は不要です。
medical_onboard:
  title: 機内での医療事案
  description: 巡航中に、客室乗務員から体調不良の乗客が報告されました。「CONTINUE」または「DIVERT」と返信してください（10分経過後はデフォルトで「CONTINUE」となります）。「DIVERT」を選択した場合は、出発地および代替空港のうち最も近い場所へ迂回します。
  hint: OPS：客室乗務員から、機内での医療事案の報告があり、座席番号、乗客の年齢、症状、および医師が搭乗しているかどうかの情報が伝えられます。乗務員に助言を行う地上の医師チームであるMedLinkが、続いて助言を行います。
  steps:
    met:
      hint: 機内に医師がいないため、MedLinkは直ちに迂回することを強く勧告しています。継続するか迂回するかをOPSに伝えてください。
    timeout:
      hint: MedLinkからは、乗客の容態が改善しない場合は迂回するよう助言があります。継続するか迂回するかをOPSに伝えてください。
    reply:
      reply_hints:
        CONTINUE: 目的地へ引き続き向かってください。その言葉の後に短いメモを追加しても構いません。
        DIVERT: 迂回してください。ICAOコードと、(DIVERT EDDM PAX STABLE)という文言の後に簡単なメモを追加しても構いません。
    divert:
      hint: OPSより、ダイバート先の空港とその距離が確認され、現地の救急車およびハンドリング手配が済んでおります。可能になりましたら、自由文テレックスにて新しいETAをお知らせください。
    divert_2:
      hint: 救急隊員が機体のドアで待機しています。患者は他の乗客より先に機外へ降機します。返信は不要です。
    continue:
      hint: OPSより、目的地へ引き続き飛行すること、およびATCに優先措置を要請するよう指示がありました。返信は不要です。
    continue_2:
      hint: 救急隊員が機体のドアで待機しています。患者は他の乗客より先に機外へ降ります。返信は不要です。
mel_carry_over:
  title: 以前のフライトからの未解決のMEL項目
  description: 同一機体での飛行前：延期されていたMEL項目は依然として未解決です。到着後、整備部門がこれを解決します。
  hint: 本機のMEL状況：前回のフライトでMEL（最低装備リスト）に基づき対応が先送りされた不具合が、依然として未解決のままです。当該不具合に対するMEL運航手順に従って飛行し、性能および燃料消費量の増加を確認してください。目的地では整備の枠が確保されています。返信は不要です。
  steps:
    mel_status:
      hint: MELの状況：整備部門がこの空港で先送りされていた不具合を修正し、MEL項目は完了処理され、技術日誌に署名済みです。返信は不要です。
natural_event:
  title: 航路付近の自然現象
  description: 前方のルート付近で自然現象（NASA EONET）が発生しています。
  hint: OPS勧告：NASA EONETにより、あなたの航路の先で報告された自然現象（山火事、嵐、火山活動など）について、前方および航路からの距離を明記したものです。気象レーダーおよびSIGMETを確認し、必要に応じて迂回してください。返信は不要です。
next_leg:
  title: 次の区間
  description: 同一機体での次の区間。
  hint: OPSより、同一機体での次のセクター（フライト、ルート、STD、ターンアラウンド時間）が通知されました。返信は不要です。
nhl_results:
  title: NHLの結果
  description: フライト中に終了したNHLの試合（レギュラーシーズンおよびプレーオフ）。
  hint: OPS情報：フライト中に終了したNHL試合の最終スコアです。返信は不要です。
ped_fire_cabin:
  title: 機内でのリチウム電池の火災
  description: 巡航中、客室乗務員から乗客の電子機器のバッテリー火災が報告されました。FAA SAFO 09013に従って対応してください。「CONTINUE」または「DIVERT」と返信してください（5分経過後はデフォルトで「DIVERT」となります）。
  hint: OPS：客室乗務員からの報告によると、乗客の個人用電子機器（PED）のリチウム電池が発火しており、座席付近での発生状況および消火方法（水またはハロン、水で電池を冷却、防火袋は使用しない）が伝えられています。飛行を継続するか、迂回するかをOPSにお知らせください。
  steps:
    reply:
      reply_hints:
        CONTINUE: 火災は鎮火しました。目的地へ飛行を継続してください。
        DIVERT: 最寄りの適切な空港、または「DIVERT EDDM」という語句で指定された別の空港へ迂回してください。
    divert:
      hint: OPSはダイバートおよびその距離を確認し、現地の消防隊に手配を行いました。可能になりましたら、自由文テレックスにて新しいETAをお知らせください。
    divert_2:
      hint: 消防隊が機体のドアまで出向き、その装置を引き取ります。返信は不要です。
    continue:
      hint: OPSより、目的地へ引き続き飛行することを確認いたしました。機内を注視し続け、万一火災が再発した場合はOPSまでご連絡ください。返信は不要です。
    continue_2:
      hint: 消防隊が機体のドアまで出向き、その装置を引き取ります。返信は不要です。
prelim_loadsheet:
  title: 暫定ロードシート
  description: OFPの計画数値を含む暫定ロードシート。
  hint: 暫定ロードシート：飛行計画に基づく計画重量および燃料量（ZFW、TOF、TOW、TIF、LAWの各最大許容値との比較）、乗客および貨物。FMSの準備にご利用ください。最終的な数値は最終ロードシートに記載されます。返信は不要です。
recovery_followup:
  title: ダイバート後の復旧
  description: 以前のダイバート空港からのフライト前：当該機は前のフライトからダイバートしたものであり、乗務員の勤務状況および新しい飛行計画を確認します。
  hint: 以前のダイバート先空港からの復行便前のOPS：乗務員の勤務時間を確認し、新しい飛行計画と燃料を手配します。乗客や手荷物の遅延が見込まれます。返信は不要です。
runway_closure_dest:
  title: 目的地滑走路閉鎖中
  description: 降下開始時点で、予定していた滑走路が閉鎖されています（30分から3時間、まれに「追って通知があるまで」の場合あり）。状況は20分ごとに更新されます。HOLD（デフォルト）または代替空港へのDIVERTを行ってください。
  hint: 目的地のOPSより：予定していた滑走路が閉鎖されています（理由はメッセージに記載されています）。再開の見込みはまだありません。燃料残量を確認の上、待機するか、代替空港へ迂回するかをOPSへお知らせください。
  steps:
    reply:
      reply_hints:
        HOLD: 待機し、滑走路が使用可能になるのを待ってください。OPSより指定された時間に最新情報をお伝えします。
        DIVERT: 代替空港、または「DIVERT EDDM」という語句の後に空港名が記載された別の空港へ迂回してください。
    hold:
      hint: OPSは、スポットにいることを確認しました。駐機位置およびハンドリングの手配は予定通りであり、次回の更新は指定された時刻に行われます。
    reply_2:
      reply_hints:
        HOLD: ホールディングを継続し、次の更新情報を待ってください。
        DIVERT: 代替空港、または「DIVERT EDDM」という語句の後に空港名が記載された別の空港へ迂回してください。
    hold_2:
      hint: OPS：目的地空港は追って通知があるまで（UFN）閉鎖されていますので、代替空港へ迂回してください。現地でのハンドリングおよび燃料の手配は済んでいます。返信は不要です。
    hold_3:
      hint: 目的地OPSからの最新情報：滑走路は依然として閉鎖されており、到着便の受け入れは停止されています。待機を続けるか、迂回するかをOPSにお知らせください。
    divert:
      hint: OPSは、ダイバート先およびその距離を記録し、現地でのハンドリングおよび燃料の手配を指示しています。可能になりましたら、自由文テレックスでETAをお送りください。
    met:
      hint: 滑走路が再開され、目的地への到着便の受け入れが再開されました。通常通りのアプローチを行ってください。返信は不要です。
    divert_2:
      hint: OPSは、ダイバート先およびその距離を記録し、現地でのハンドリングおよび燃料の手配を指示しています。可能になり次第、自由文テレックスでETAをお送りください。
rush_bags_followup:
  title: 緊急手荷物の配達（次の便）
  description: 次のフライト前：置き忘れられた手荷物が所有者に届き、件は解決しました。
  hint: 手荷物：前のフライトで置き忘れられた手荷物は所有者に引き渡され、手荷物案件（PIR）は解決済みです。返信は不要です。
short_connection:
  title: 乗客の乗り継ぎ時間が短い場合
  description: 降下開始前、次の便への乗り継ぎ時間が1時間未満の場合：乗客数、便名、STD；迅速な対応をお願いいたします。
  hint: 乗り継ぎ：当便の乗客が、次の便への乗り継ぎ時間が短い状況です。メッセージには、便名、STD、および時間的余裕が記載されています。OPSからは、可能であれば到着を早めるよう依頼されています。乗り継ぎスタッフがゲートでお迎えします。返信は不要です。
slot_ctot:
  title: スロット／CTOT
  description: ATCフローのスロットで、CTOTにより出発が遅延する場合。
  hint: ATCフロー制限：当該フライトにはスロット、計算された離陸時刻（CTOT）、およびそれによって生じる遅延があります。CTOTに離陸できるよう、搭乗およびプッシュバックを計画してください。「RDY」コマンドは、OPSに対し、予定より早く準備が整ったことを伝えます。返信は不要です。
slot_missed:
  title: スロット未達成
  description: CTOTより10分以上遅れて離陸した場合（スロット許容範囲 -5/+10分）：スロットを逃したと報告されます。
  hint: CTOT（-5/+10分）前後のスロット枠外で離陸したため、航空会社はフロー管理（ATFM）に対し、スロット未遵守として報告します。返信は不要です。
solar_eclipse:
  title: 航路上の日食
  description: 前方にあるルート上の地点が、通過時に日食帯（マグニチュード0.5以上）にあり、かつ太陽が地平線より上にある場合（NASA）。
  hint: OPS情報：当該ルートから日食が観測可能です。日食の種類、食分、時刻、場所、および太陽の高度が記載されています。保護具なしに太陽を直視しないでください。返信は不要です。
space_launch:
  title: 航路付近での宇宙ロケット打ち上げ
  description: 到着前に、前方ルートから300NM以内の範囲で、打ち上げが確定しました（TheSpaceDevs、ステータス：Go）。
  hint: OPS勧告：航路付近でロケット打ち上げが計画されています。打ち上げの「最低打ち上げ時刻（NET）」、打ち上げウィンドウ、および距離が記載されています。周辺の空域規制が予想されますので、NOTAMをご確認ください。返信は不要です。
space_launch_done:
  title: 航路付近での宇宙ロケット打ち上げ（打ち上げ済み）
  description: 離陸後の打ち上げ（TheSpaceDevs）が、前方航路から300NM以内の範囲で発生しています。
  hint: OPS勧告：離陸後、航路付近でロケットが打ち上げられました。打ち上げ時刻と状況が記載されています。落下物による閉鎖区域が設定されている可能性がありますので、NOTAMをご確認ください。返信は不要です。
space_weather:
  title: 宇宙気象注意報
  description: NOAAスケール R3+、S2+（緯度60度以上のルート）またはG3+（現在または24時間以内の予報）。
  hint: OPS注意報：NOAAより、強い宇宙気象（太陽ラジオブラックアウト、放射線嵐、または地磁気嵐）が報告されています。HF無線、SATCOM、GNSSに支障をきたす可能性がありますので、確認してください。返信は不要です。
takeoff_data:
  title: 離陸データ
  description: OFPからの出発データ：滑走路、気象状況、フラップ、推力、およびOFPに情報が記載されている場合のV速度。
  hint: 飛行計画からの離陸データ：滑走路およびSID、標高、遷移高度、制限に対する離陸重量、離陸燃料、巡航高度、コスト指数、および出発時の気象状況；飛行計画に記載がある場合は、フラップ、推力、V速度。ご自身の計算と照合してください。返信は不要です。
tankering:
  title: タンカーリングの提案
  description: 出発前：目的地での燃料代が高いため、着陸重量に余裕がある場合は追加燃料の提供が提案されます。「ACCEPT」または「DECLINE」（デフォルト）を選択してください。
  hint: 燃料ディスパッチ：目的地での燃料代が高いため、タンカーリング（ここから次の区間に向けて余分な燃料を積載すること）が推奨されています。メッセージには、追加燃料量、新しいブロック燃料量、および最大着陸重量に対する推定着陸重量が記載されています。運航管理に、これを受け入れるかどうかをお知らせください。
  steps:
    reply:
      reply_hints:
        ACCEPT: 追加燃料を積載してください。
        DECLINE: 計画通りの燃料量を維持します。
    accept:
      hint: タンカーリングを承諾：給油担当者に新しいブロック燃料量が通知され、それに伴うロードシートが送付されます。返信は不要です。
    decline:
      hint: 運航管理が記録します：計画された燃料量は飛行計画通り維持されます。返信は不要です。
tech_defect_mel:
  title: 技術的不具合とMEL
  description: 巡航中に、整備担当者がシステムの故障を報告します。「CONFIRM」を選択すると、MELに基づき対応を延期し、当該航空機においてこの不具合を未解決のまま保持します。「NEGATIVE」（デフォルト）を選択すると、誤報として処理され、未解決状態が解除されます。
  hint: 整備管制：航空機の整備システム（CMS）が、MEL項目を含む故障を報告しました。乗務員が乗務員警報システム上で同じ表示を確認しているかどうかを尋ねています。
  steps:
    reply:
      reply_hints:
        CONFIRM: はい、乗務員は表示された故障を確認しています。
        NEGATIVE: いいえ、コックピットにはそのような表示はありません。
    confirm:
      hint: 技術日誌に不具合を記録してください。これはMEL（最低装備リスト）に基づき、修理カテゴリーCとして対応が延期されており、航空機はMELに従って次の区間を飛行します。整備担当者は目的地で航空機を迎えます。返信は不要です。
    negative:
      hint: 整備部門は、これを整備システムの誤報とみなします。措置は不要です。返信は不要です。
unruly_followup:
  title: 問題行動を起こした乗客へのフォローアップ（次のフライト）
  description: 次のフライト前：前のフライトの乗客が当社の搭乗禁止リストに登録されています。
  hint: 保安情報：前の便で問題を起こした乗客は、当社の搭乗禁止リストに登録され、警察への通報も行われました。返信は不要です。
unruly_passenger:
  title: 迷惑な乗客
  description: 巡航中に、乗務員から迷惑な乗客の報告がありました。「RESTRAIN（拘束）」：到着時に警察が手配されます。「DIVERT（迂回）」：最寄りの空港へ。「CONTINUE（継続）」（デフォルト）：監視を継続してください。「RESTRAIN」および「DIVERT」を選択した場合は、次の便への連絡を残してください。
  hint: OPSセキュリティ：客室乗務員から、座席番号と経緯を伴う迷惑な乗客の報告がありました。乗務員はすでに正式な警告を行っています。OPSに対し、乗客の拘束、迂回、または飛行継続のいずれの措置を講じるかをお知らせください。
  steps:
    reply:
      reply_hints:
        RESTRAIN: 乗務員が当該乗客を拘束し、飛行を継続しています。
        DIVERT: 最寄りの適切な空港、または「DIVERT EDDM」というキーワードで指定された別の空港へ迂回してください。
        CONTINUE: 飛行を継続してください。乗務員は当該乗客を注視し続けてください。
    restrain:
      hint: OPSより拘束措置の報告を受けました。警察は目的地で機体に出迎えます。警察が到着するまではドアを開けないでください。また、機内インシデント報告書を提出してください。返信は不要です。
    restrain_2:
      hint: 指定された座席の乗客について、警察が機体のドアに待機しています。警察が搭乗するまで、他の乗客には着席したままにしておいてください。返信は不要です。
    divert:
      hint: OPSは、貴機のダイバートを把握しました。警察およびハンドリング要員が現地へ手配されています。機内インシデント報告書を提出してください。返信は不要です。
    continue:
      hint: OPSより、通常通り飛行を継続し、乗務員が当該乗客を監視し続けているとの報告を受けました。状況に変化があった場合はOPSへご連絡ください。返信は不要です。
vatsim_atc:
  title: 目的地でVATSIMのATCがオンライン中
  description: TOD（VATSIM）前の目的地でのオンラインATC。
  hint: 現在、目的地でオンライン中のVATSIM管制官とATISのメッセージです。到着時の周波数を計画するためにご活用ください。返信は不要です。
vatsim_atc_none:
  title: 目的地でVATSIMのATCが利用できません
  description: VATSIMのATCが、TOD前に目的地でオンラインになっていません。
  hint: 現在、目的地にはVATSIMの管制官がオンラインになっていません。UNICOM 122.800を使用し、ご自身で現在位置を報告してください。アプローチ前に再度確認してください。返信は不要です。
vdgs_arrival:
  title: ドッキングディスプレイ（GSX）
  description: 目的地スポットのGSX VDGSに表示されるフライト、出発地、到着ゲート。
  hint: メッセージではありません：駐機スポットのGSXドッキングディスプレイに表示される、ご自身のフライト、出発地、および到着ゲートです。
vdgs_departure:
  title: 出発ボード（GSX）
  description: A-CDM空港の場合：出発スポットのGSX VDGS（SID）には、フライト、目的地、カウントダウン付きの航空会社のTOBT、滑走路、およびSIDが表示されます。
  hint: （注：これはメッセージではありません）出発スポットのGSXドッキングディスプレイには、便名、目的地、滑走路、SIDが表示され、出発の30分前からは、航空会社の目標オフブロック時刻（TOBT）がカウントダウン形式で表示されます。DELAYが発生するとTOBTが変更されます。TOBTから15分経過してもオフブロックできない場合、ディスプレイは新しいTOBTの入力を求めます。
vdgs_departure_etd:
  title: 出発案内板、non-A-CDM（GSX）
  description: 実際の表示ではありません：A-CDM空港以外では、出発スポットのGSXVDGSに、便名、目的地、カウントダウン付きのETD、滑走路、SIDが表示されます。
  hint: これはメッセージではなく、実際の表示を再現したものでもありません。A-CDMを導入していない空港では、出発スポットのGSXドッキングディスプレイに、フライト番号、目的地、滑走路、SIDが表示され、出発の30分前からは、すべての遅延情報を反映した推定オフブロック時刻（ETD）とカウントダウンが表示されます。
vdgs_divert:
  title: ドッキングディスプレイ、ダイバート（GSX）
  description: フライト：ダイバート空港のGSXVDGSに、赤い「DIVERTED」の行と出発地が表示されています。
  hint: メッセージではありません：ご自身のフライトにおいて、ダイバート空港のGSXドッキングディスプレイに、赤い「DIVERTED」の行と出発地が表示されている場合。
vip_onboard:
  title: 機内にVIPが搭乗中
  description: 出発前：VIPと座席；待機中：最初に降機、ゲートには儀礼用車両が待機しています。
  hint: OPS：VIPが搭乗しており、座席が確保されています。VIPは最後に搭乗し、最初に降機します。機内ではこの件についてアナウンスを行わないでください。返信は不要です。
  steps:
    ops_msg:
      hint: 到着時のOPS：VIPが最初に降機し、ゲートには儀礼用車両が待機しています。指定された時間、他の乗客を機内に待機させてください。返信は不要です。
volcanic_ash:
  title: 航路付近の火山灰
  description: 今後の航路付近で有効なSIGMET VA。
  hint: OPSアドバイザリー：今後の飛行経路付近で火山灰に関するSIGMETが発効中です。火山名、火山灰雲の高さ、距離、有効期間が含まれています。火山灰区域を避け、SIGMETを確認してください。返信は不要です。
welcome_turnaround:
  title: ウェルカムおよびターンアラウンド
  description: ターンアラウンド計画を含むウェルカムメッセージ。
  hint: 目的地管制局からのウェルカムメッセージ（ターンアラウンド計画付き）：ターン時間、次のフライトとSTD、機内清掃および機内食の手配（航路中）。返信は不要です。
