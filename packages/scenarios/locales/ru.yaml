# Russian UI texts of the scenarios (T85): title, description, hint and the step hints by id.
# Keys are scenario ids; the English texts stay in the scenario files. Telexes are never translated.
aircraft_change:
  title: Смена самолёта
  description: Смена самолёта на следующий рейс.
  hint: "Центр управления полётами (OPS) сообщает, что следующий рейс выполняется на другом самолёте: этот после прилёта уходит в техобслуживание, экипаж пересаживается. Ответ не нужен."
airshow_dest:
  title: Авиашоу в пункте назначения
  description: Авиашоу в пределах 50 км от аэропорта назначения в день прилёта (справочник с официальных сайтов).
  hint: "Информация OPS: в день рейса у аэропорта назначения или рядом проходит авиашоу. Ожидайте ограничений на время показа и плотного движения, проверьте NOTAM. Ответ не нужен."
altn_wx_deterioration:
  title: Ухудшение погоды на запасном
  description: Перед TOD погода на запасном ухудшается. OK (по умолчанию) или LOW — ближайший аэропорт и расстояние до него.
  hint: "Диспетчер авиакомпании (dispatch): погода на вашем запасном ухудшается (причина — в сообщении). Рассмотрите запасной на маршруте или дополнительное топливо и сообщите диспетчеру авиакомпании, как у вас с топливом."
  steps:
    reply:
      reply_hints:
        OK: Топлива достаточно с учётом ситуации.
        LOW: Топлива с учётом ситуации мало.
    ok:
      hint: Диспетчер авиакомпании принял, что с топливом всё в порядке, и следит за погодой на запасном; обновление придёт до начала снижения. Ответ не нужен.
    met:
      hint: Обновление погоды на запасном от диспетчера авиакомпании перед началом снижения. Сообщите ему telex свободным текстом, если по топливу нужно что-то предпринять.
    timeout:
      hint: Обновление погоды на запасном от диспетчера авиакомпании перед началом снижения. Сообщите ему telex свободным текстом, если по топливу нужно что-то предпринять.
    low:
      hint: Диспетчер авиакомпании называет ближайший запасной и расстояние до него от текущего места. При необходимости объявите УВД минимальный остаток топлива (MIN FUEL). Ответ не нужен.
arrival_info:
  title: Информация о прилёте
  description: Гейт, лента багажа, трансферные пассажиры и наземное обслуживание на снижении.
  hint: "Информация о прилёте от OPS: гейт или стоянка, лента выдачи багажа, сколько пассажиров пересаживается на другие рейсы и какое наземное обслуживание запланировано. Ответ не нужен."
atc_flow_delay:
  title: Перенос слота ATC
  description: Незадолго до вылета ранее выданный CTOT (slot_ctot) переносится на более позднее время из-за ограничения потока.
  hint: "Служба организации потоков (ATFM) перенесла ваш слот на более позднее время: причина, старый и новый CTOT и дополнительная задержка. Планируйте запуск и буксировку к новому CTOT. Ответ не нужен."
atis_update:
  title: Сменилась ATIS назначения
  description: "На снижении сменилась буква онлайн-ATIS VATSIM аэропорта назначения: новая буква и METAR."
  hint: У ATIS аэропорта назначения (VATSIM) новая буква информации вместо прежней; с ней — последний METAR. Называйте новую букву при первом выходе на связь с подходом. Ответ не нужен.
aurora_on_route:
  title: Северное сияние на маршруте
  description: Вероятность сияния ≥ 30 % в точке маршрута в ближайший час, ночью (NOAA OVATION).
  hint: "Информация OPS: по прогнозу NOAA на вашем маршруте возможно полярное сияние; в сообщении — где и когда. Бортпроводники могут сообщить пассажирам. Ответ не нужен."
aviation_history:
  title: В этот день в истории авиации
  description: Факт из истории авиации с сегодняшней датой (справочник с источниками).
  hint: "Информация OPS: событие из истории авиации, случившееся в этот день. Ответ не нужен."
bizav_arrival:
  title: Встреча по прилёте (бизнес)
  description: "Перед TOD на бизнес-рейсе: машина встретит пассажиров у самолёта, отель и транспорт экипажа подтверждены."
  hint: "Служба сопровождения в аэропорту назначения: у самолёта пассажиров встретит машина, отель экипажа и транспорт от FBO забронированы. Ответ не нужен."
bizav_catering:
  title: Бортпитание (бизнес)
  description: "Перед вылетом бизнес-рейса: заказ бортпитания подтверждён и будет доставлен к самолёту."
  hint: "Служба сопровождения: заказ бортпитания для ваших пассажиров подтверждён и будет доставлен к самолёту к указанному времени. Ответ не нужен."
bizav_eapis:
  title: Манифест eAPIS (бизнес, США)
  description: "Перед вылетом бизнес-рейса в США: прилётный манифест eAPIS отправлен в CBP."
  hint: "Служба сопровождения: прилётный манифест экипажа и пассажиров отправлен в Таможенно-пограничную службу США (CBP) через eAPIS — для частных самолётов это нужно не позже чем за 60 минут до вылета в США. Ответ не нужен."
bizav_fuel_release:
  title: Топливный релиз (бизнес)
  description: "Перед вылетом бизнес-рейса: выпущен топливный релиз для аэропорта вылета."
  hint: "Служба сопровождения: топливный релиз (договорённость с поставщиком топлива) для этого аэропорта выпущен на плановое топливо; у заправщика он есть. Ответ не нужен."
bizav_handling:
  title: Обслуживание подтверждено (бизнес)
  description: "Перед вылетом бизнес-рейса: служба сопровождения подтверждает наземное обслуживание в обоих аэропортах."
  hint: "Служба сопровождения (компания, которая организует поездки бизнес-самолётов): наземное обслуживание в аэропортах вылета и назначения подтверждено, FBO (терминал бизнес-авиации) знает ваше время. Ответ не нужен."
bizav_principal_late:
  title: Опоздание принципала (бизнес)
  description: "Перед вылетом бизнес-рейса: принципал опаздывает, вылет задерживается на 15–45 минут."
  hint: "Служба сопровождения: принципал (главный пассажир — владелец или клиент) опаздывает; вылет задерживается на указанные минуты. Планируйте с учётом этого. Ответ не нужен."
block_report:
  title: Время блоков (OOOI)
  description: Время блоков и коды задержки после постановки на стоянку.
  hint: "Отчёт о рейсе после постановки на стоянку: время OUT, OFF, ON, IN (отход от стоянки, взлёт, посадка, постановка на стоянку), время в блоке и в полёте, остаток топлива; при задержке — коды причин IATA. Для учёта авиакомпании; ответ не нужен."
cargo_act_failure:
  title: Отказ термоконтейнера (грузовой)
  description: "Перед вылетом грузового рейса: активный термоконтейнер с фармацевтикой неисправен и заменяется, вылет задерживается на 15–30 минут."
  hint: "Служба груза: активный термоконтейнер (ACT) с фармацевтикой сообщил о неисправности до загрузки. Его заменяют, вылет задерживается на указанные минуты. Ответ не нужен."
cargo_final_loadsheet:
  title: Окончательный лоадшит (грузовой)
  description: Окончательный лоадшит грузового рейса с изменением груза в последний момент.
  hint: "Окончательная загрузочная ведомость грузового рейса от службы загрузки: фактические массы против ограничений (ZFW, TOW, LAW), топливо на взлёт и на рейс (TOF, TIF) и груз; LMC — изменение груза в последний момент против предварительной ведомости. Проверьте цифры и используйте их в FMS; ответ не нужен."
cargo_late_truck:
  title: Опоздавший грузовик (грузовой)
  description: "Перед вылетом грузового рейса: грузовик с запланированным грузом опаздывает, приём груза продлён, вылет задерживается на 10–30 минут."
  hint: "Служба груза: грузовик с грузом, забронированным на ваш рейс, опаздывает — приём груза продлён, вылет задерживается на указанные минуты. Планируйте с учётом этого. Ответ не нужен."
cargo_notoc:
  title: Опасный груз (NOTOC, грузовой)
  description: "Перед вылетом грузового рейса: опасный груз на борту, часть — только для грузовых самолётов (CAO YES). Ответ ACK — подпись КВС."
  hint: "NOTOC (уведомление командиру) грузового рейса: загруженные опасные грузы — номер ООН (UN), класс, код обработки, место в отсеке и число мест; CAO YES значит, что груз разрешён только на грузовых самолётах. Подтвердите ответом ACK — он заменяет подпись командира."
  steps:
    reply:
      reply_hints:
        ACK: Вы прочитали NOTOC; это считается вашей подписью.
    notoc:
      hint: "Служба груза получила подтверждение: копия — в полётную папку, руководитель загрузки в курсе. Ответ не нужен."
cargo_prelim_loadsheet:
  title: Предварительный лоадшит (грузовой)
  description: "Предварительный лоадшит грузового рейса: плановые цифры из OFP, груз без пассажиров."
  hint: "Предварительная загрузочная ведомость грузового рейса от службы загрузки: плановые массы и топливо из плана полёта (ZFW, TOF, TOW, TIF, LAW против максимумов) и груз. Используйте её для подготовки FMS; окончательные цифры придут в окончательном лоадшите. Ответ не нужен."
cargo_sort_shift:
  title: Сдвиг сортировки на хабе (грузовой)
  description: "В крейсере грузового рейса: сортировка на хабе назначения начнётся позже, спешить не нужно."
  hint: "Служба груза: сортировка груза на хабе назначения начнётся позже плана на указанные минуты, так что спешить ради неё не нужно. Для сведения; ответ не нужен."
cargo_special_load:
  title: Особый груз (грузовой)
  description: "Перед вылетом грузового рейса: на борту особый груз (живые животные, скоропортящийся, фармацевтика, человеческие останки или ценности) с кодом обработки. Ответ ACK."
  hint: "Уведомление об особом грузе от службы груза: отправка, которой нужен особый уход в полёте или по прилёте, — код особой обработки IATA, место в отсеке и что нужно (температура, первоочередная выгрузка). Подтвердите ответом ACK."
  steps:
    reply:
      reply_hints:
        ACK: Вы знаете об особом грузе.
    ack:
      hint: "Служба груза получила подтверждение и сообщила обработке в аэропорту назначения. Ответ не нужен."
cargo_uld_damaged:
  title: Повреждённый ULD (грузовой)
  description: "Перед вылетом грузового рейса: повреждённый ULD заменён, часть груза снята; в окончательном лоадшите — то же изменение груза."
  hint: "Служба загрузки: при загрузке обнаружено повреждённое средство пакетирования (контейнер или паллета). Груз переложен на другое, а то, что не поместилось, остаётся; окончательный лоадшит покажет это изменение. Ответ не нужен."
cargo_weight_error:
  title: Поправка веса (грузовой)
  description: "Перед вылетом грузового рейса: ULD перевзвешен и оказался тяжелее брони; в окончательном лоадшите — то же изменение груза."
  hint: "Служба загрузки: одно место перевзвесили, оно тяжелее, чем в брони. Разница — изменение в последний момент (LMC), она будет в окончательном лоадшите. Ответ не нужен."
charter_group_lmc:
  title: Изменение туристической группы (чартер)
  description: "Перед вылетом чартера: часть туристической группы не явилась или добавлена опоздавшая группа; в окончательном лоадшите — то же изменение числа пассажиров."
  hint: "Обработка чартера: туроператор сообщает об изменении в группе — не явившиеся пассажиры или добавленные опоздавшие. Это число — изменение в последний момент (LMC), его покажет окончательный лоадшит. Ответ не нужен."
  steps:
    no_show:
      hint: "Обработка чартера: часть туристической группы не явилась; их багаж снимают, окончательный лоадшит покажет изменение. Ответ не нужен."
    added:
      hint: "Обработка чартера: принята опоздавшая часть туристической группы; багаж загружен, окончательный лоадшит покажет изменение. Ответ не нужен."
charter_sports_team:
  title: Спортивная команда (чартер)
  description: "Перед вылетом чартера: на борту спортивная команда, негабаритное спортивное снаряжение в отсеке и особое бортпитание по заказу фрахтователя."
  hint: "Обработка чартера: с вами летит спортивная команда. Её негабаритное снаряжение загружено в указанный отсек, бортпитание заказал фрахтователь. Ответ не нужен."
charter_tour_rep:
  title: Представитель туроператора (чартер)
  description: "Перед вылетом чартера: представитель туроператора зарегистрировал группу и просит короткое приветствие по громкой связи."
  hint: "Обработка чартера: представитель туроператора у выхода, регистрация группы закончена; после посадки он просит сказать короткое приветствие по громкой связи. Ответ не нужен."
charter_transfer:
  title: Трансфер в аэропорту назначения (чартер)
  description: "Перед TOD на чартере: в аэропорту назначения пассажиров ждут автобусы трансфера, представитель туроператора встречает их."
  hint: "Обработка чартера в аэропорту назначения: автобусы туроператора ждут ваших пассажиров, представитель встречает их в зале прилёта. Пригодится для объявления в салоне. Ответ не нужен."
charter_vip:
  title: VIP-чартер
  description: "Перед вылетом чартера: VIP-группа приезжает на машине к самолёту и садится последней; бортпитание по её заказу."
  hint: "Обработка чартера: это VIP-чартер. Группа подъезжает на машине к самолёту и садится последней, бортпитание — по её заказу. Ответ не нужен."
cmd_delay:
  title: "Команда пилота: DELAY"
  description: "Команда DELAY: подтверждает новое время отхода от стоянки."
  hint: "OPS подтверждает ваш DELAY: минуты и причина, которые вы указали, новое расчётное время отхода от стоянки (EOBT) и общая задержка рейса. Ответ не нужен."
cmd_divert:
  title: "Команда пилота: DIVERT"
  description: "Команда DIVERT: подтверждение ухода на запасной."
  hint: OPS подтверждает ваш DIVERT и уже предупредил хендлинг в аэропорту диверсии. Он спрашивает причину, чтобы подготовить там всё необходимое.
  steps:
    reply:
      reply_hints:
        WX: Погода в аэропорту назначения.
        TECH: Техническая неисправность самолёта.
        MEDICAL: Медицинский случай на борту.
        FUEL: Топлива не хватает, чтобы лететь дальше до назначения.
        OTHER: Любая другая причина.
    medical:
      hint: OPS заказал медицинскую бригаду в аэропорт диверсии и просит прислать данные о пассажире telex свободным текстом, когда сможете.
    tech:
      hint: Техслужба в курсе, в аэропорту диверсии вас встретит инженер. Пришлите короткое описание неисправности telex свободным текстом.
    fuel:
      hint: OPS заказал для вас заправку в аэропорту диверсии. Ответ не нужен.
    wx:
      hint: OPS принял диверсию по погоде и переоформляет пассажиров на другие рейсы. Ответ не нужен.
    msg:
      hint: Стоянка в аэропорту диверсии пока не известна. Сообщите ETA туда telex свободным текстом, когда сможете.
cmd_divert_eta:
  title: "Команда пилота: DIVERT, расстояние и ETA"
  description: "После DIVERT на аэропорт из плана полёта: расстояние от текущей позиции и ETA по текущей путевой скорости."
  hint: Расстояние от текущего места до названного вами аэропорта диверсии и ETA туда при текущей путевой скорости. Ответ не нужен.
cmd_eta:
  title: "Команда пилота: ETA"
  description: Команда ETA в полёте по плановому времени.
  hint: "Ответ на ETA: расчётное время прилёта против расписания (STA), ваш гейт или стоянка и пассажиры на пересадку, о которых OPS предупредил стыковочные рейсы. Ответ не нужен."
cmd_eta_ground:
  title: "Команда пилота: ETA до взлёта"
  description: Команда ETA до взлёта.
  hint: "Ответ на ETA до вылета: расчётное время отхода от стоянки (EOBT) и постановки (EST IN) против расписания (STA) и пассажиры на пересадку. Ответ не нужен."
cmd_eta_gs:
  title: "Команда пилота: ETA по скорости"
  description: Команда ETA по путевой скорости и оставшемуся расстоянию.
  hint: "Ответ на ETA в полёте: время прилёта по путевой скорости и оставшемуся расстоянию против расписания (STA), ваш гейт или стоянка и пассажиры на пересадку, о которых OPS предупредил стыковочные рейсы. Ответ не нужен."
cmd_gate_change:
  title: "Команда пилота: REQ GATE CHANGE"
  description: "REQ GATE CHANGE [гейт] [причина] до прилёта на стоянку: OPS соглашается (70 %, запрошенный гейт, если он есть среди известных) или отвечает, что все заняты. Дальше arrival info называет новый гейт."
  hint: "OPS отвечает на ваш REQ GATE CHANGE: новый гейт, если смену одобрили, или почему это невозможно и какой гейт остаётся. Ответ не нужен."
cmd_gate_change_none:
  title: "Команда пилота: REQ GATE CHANGE, данных нет"
  description: REQ GATE CHANGE, когда гейта ещё нет, другого гейта нет или рейс на диверсии.
  hint: "OPS не может сменить гейт сейчас: гейт ещё не известен, другого нет или вы уходите на запасной. В сообщении — то, что OPS знает о вашем гейте. Ответ не нужен."
cmd_help:
  title: "Команда пилота: HELP"
  description: "Команда HELP: список команд пилота."
  hint: Свободный текст уходит в OPS как telex; HELP возвращает список команд, которые OPS понимает. Команды отправляйте telex на станцию авиакомпании; ATC LOGON и запрос разрешения на вылет (DCL) — на станции XATC (X + FIR, X + аэропорт вылета).
cmd_medical:
  title: "Команда пилота: MEDICAL"
  description: "MEDICAL <текст> в воздухе: экипаж сам сообщает о медицинском случае. OPS спрашивает CONTINUE или DIVERT (через 10 мин — CONTINUE); DIVERT — на ближайший из аэропорта вылета и запасных; на стоянке встречают медики."
  hint: OPS получил ваше сообщение о медицинском случае и передал его в MedLink — наземным врачам, которые консультируют экипажи в полёте. Он спрашивает, летите ли вы дальше до назначения или уходите на запасной.
  steps:
    reply:
      reply_hints:
        CONTINUE: Продолжать полёт до аэропорта назначения.
        DIVERT: Уйти на запасной; после слова можно указать ICAO аэропорта (DIVERT EDDM).
    divert:
      hint: OPS подтверждает аэропорт диверсии и заказал туда скорую и хендлинг. Сообщите новое ETA telex свободным текстом, когда сможете.
    divert_2:
      hint: Медики ждут у двери самолёта; пациент выходит раньше остальных пассажиров. Ответ не нужен.
    continue:
      hint: OPS принял, что вы продолжаете полёт до назначения, и просит запросить у УВД приоритет. Ответ не нужен.
    continue_2:
      hint: Медики ждут у двери самолёта; пациент выходит раньше остальных пассажиров. Ответ не нужен.
cmd_req_notam:
  title: "Команда пилота: REQ NOTAM"
  description: "REQ NOTAM [ICAO]: значимые NOTAM аэропорта из OFP (без ICAO — назначения); для других аэропортов — NO NOTAM DATA."
  hint: "REQ NOTAM <ICAO> запрашивает значимые NOTAM аэропорта вашего плана полёта (пусто — назначения): та же сводка, что перед началом снижения (TOD); NOTAM — из плана полёта на момент его выпуска, не живые данные. Для аэропорта не из плана OPS отвечает NO NOTAM DATA. Ответ не нужен."
cmd_rdy:
  title: "Команда пилота: RDY"
  description: "RDY при выданном CTOT, до OUT: READY MSG SENT; затем (в 40 % случаев) более ранний CTOT или NO IMPROVEMENT."
  hint: "OPS передал ваше сообщение о готовности (RDY: экипаж может вылететь раньше слота) в службу управления потоками УВД. Пока не придёт ответ, планируйте вылет по текущему CTOT. Ответ не нужен."
  steps:
    met:
      hint: "Ответ на сообщение о готовности: служба потоков дала более ранний слот. Планируйте взлёт к новому CTOT. Ответ не нужен."
    timeout:
      hint: "Ответ на сообщение о готовности: более раннего слота нет, CTOT остаётся прежним. Ответ не нужен."
cmd_rdy_none:
  title: "Команда пилота: RDY, слота нет"
  description: "RDY без выданного CTOT или слишком рано/поздно (окно: от EOBT-15 мин до CTOT минус время руления)."
  hint: "OPS не может отправить сообщение о готовности сейчас: у рейса нет слота (CTOT) или для него слишком рано или поздно. Отправьте RDY, когда будете готовы ближе к EOBT. Ответ не нужен."
cmd_req_atis:
  title: "Команда пилота: REQ ATIS"
  description: "REQ ATIS [ICAO]: текст ATIS онлайн-станции VATSIM аэропорта (без ICAO — назначение). Если ATIS нет в эфире: NO ATIS AVBL и METAR."
  hint: REQ ATIS <ICAO> запрашивает ATIS аэропорта (пусто — назначения). Ответ — текст ATIS, который сейчас в эфире на VATSIM, с буквой информации. Ответ не нужен.
cmd_req_atis_none:
  title: "Команда пилота: REQ ATIS, ATIS нет"
  description: "REQ ATIS, когда ATIS не в эфире: NO ATIS AVBL и последний METAR."
  hint: "Ответ на REQ ATIS: ATIS этого аэропорта на VATSIM сейчас нет, поэтому OPS присылает последний METAR. Ответ не нужен."
cmd_req_gate:
  title: "Команда пилота: REQ GATE"
  description: "Команда REQ GATE: гейт прилёта."
  hint: REQ GATE запрашивает у OPS гейт прилёта. В ответе — ожидаемый гейт или стоянка в аэропорту назначения, лента багажа и STA. Ответ не нужен.
cmd_req_gate_divert:
  title: "Команда пилота: REQ GATE при диверсии"
  description: Команда REQ GATE во время ухода на запасной.
  hint: "Ответ на REQ GATE при уходе на запасной: стоянка в аэропорту диверсии пока не известна, её даст местный хендлинг. Ответ не нужен."
cmd_req_loadsheet:
  title: "Команда пилота: REQ LOADSHEET"
  description: "Команда REQ LOADSHEET: повтор лоадшита."
  hint: REQ LOADSHEET просит OPS прислать загрузочную ведомость ещё раз. Ответ повторяет последнюю ведомость рейса — предварительную или окончательную. Ответ не нужен.
cmd_req_loadsheet_bizav:
  title: "Команда пилота: REQ LOADSHEET (бизнес)"
  description: "Команда REQ LOADSHEET на бизнес-рейсе: лоадшит не выпускается, центровку считает экипаж."
  hint: "Ответ на REQ LOADSHEET на бизнес-рейсе: служба сопровождения лоадшит не выпускает; массу и центровку считает экипаж. Ответ не нужен."
cmd_req_loadsheet_cargo:
  title: "Команда пилота: REQ LOADSHEET (грузовой)"
  description: "Команда REQ LOADSHEET на грузовом рейсе: повтор грузового лоадшита."
  hint: "REQ LOADSHEET просит службу загрузки прислать лоадшит ещё раз. В ответ приходит последний лоадшит этого грузового рейса, предварительный или окончательный. Ответ не нужен."
cmd_req_loadsheet_ferry:
  title: "Команда пилота: REQ LOADSHEET (перегон)"
  description: "Команда REQ LOADSHEET на перегоне: повтор лоадшита «только экипаж»."
  hint: "REQ LOADSHEET просит службу загрузки прислать лоадшит ещё раз. В ответ приходит лоадшит этого перегона — только экипаж. Ответ не нужен."
cmd_req_loadsheet_ferry_none:
  title: "Команда пилота: REQ LOADSHEET, ещё нет (перегон)"
  description: "Команда REQ LOADSHEET на перегоне до выпуска лоадшита."
  hint: "Ответ на REQ LOADSHEET на перегоне: лоадшит ещё не выпущен; в сообщении сказано, когда он придёт. Ответ не нужен."
cmd_req_loadsheet_none:
  title: "Команда пилота: REQ LOADSHEET, ещё нет"
  description: Команда REQ LOADSHEET, когда лоадшита ещё нет.
  hint: "Ответ на REQ LOADSHEET: ведомость для рейса ещё не выпущена; в сообщении сказано, когда придёт предварительная. Ответ не нужен."
cmd_req_wx:
  title: "Команда пилота: REQ WX"
  description: "Команда REQ WX: погода по METAR из OFP."
  hint: REQ WX <ICAO> запрашивает у OPS погоду аэропорта (пусто — назначения). В этом ответе — METAR из плана полёта. Ответ не нужен.
cmd_req_wx_live:
  title: "Команда пилота: REQ WX (живые данные)"
  description: Команда REQ WX по живым данным о погоде.
  hint: REQ WX <ICAO> запрашивает у OPS погоду аэропорта (пусто — назначения). В этом ответе — текущие METAR и TAF. Ответ не нужен.
cmd_req_wx_no_data:
  title: "Команда пилота: REQ WX, нет данных"
  description: Команда REQ WX, когда для аэропорта нет погоды.
  hint: "Ответ на REQ WX: у OPS нет погоды для этого аэропорта. Проверьте код ICAO или запросите позже. Ответ не нужен."
connection_held:
  title: "Стыковка: рейс задержан"
  description: "На стоянке после короткой стыковки, если осталось от 15 до 40 мин: стыковочный рейс задержан до прибытия пассажиров."
  hint: "Стыковки: дальнейший рейс ваших пассажиров на пересадку задержан ради них и вылетит позже. У гейта ждёт трансферный автобус; выпустите пассажиров на пересадку первыми. Ответ не нужен."
connection_made:
  title: "Стыковка: успели"
  description: "На стоянке после короткой стыковки, если осталось 40 мин и больше: стыковочный рейс подождёт."
  hint: "Стыковки: дальнейший рейс ваших пассажиров на пересадку их дождётся; у гейта трансферный автобус. Ответ не нужен."
connection_missed:
  title: "Стыковка: не успели"
  description: "На стоянке после короткой стыковки, если осталось меньше 15 мин: пассажиры переоформлены."
  hint: "Стыковки: дальнейший рейс закрыт, пассажиров на пересадку переоформили на другие рейсы, их встретит трансферная стойка. Ответ не нужен."
company_notam:
  title: NOTAM компании до начала снижения
  description: "Значимые NOTAM назначения и запасного из OFP (ВПП, ILS, заход, огни, стоянки) перед началом снижения (TOD)."
  hint: "Сводка компании по NOTAM, важным для прилёта: закрытия ВПП и аэродрома, изменения ILS и схем захода, огни и стоянки в аэропортах назначения и запасном, действующие около вашего ETA. В каждом пункте — номер NOTAM и конец действия, его текст и, если он действует только в определённые часы, расписание (SKED). NOTAM — из плана полёта на момент его выпуска, не живые данные. Ответ не нужен."
connex_list:
  title: Стыковочные рейсы в пункте назначения
  description: "Перед TOD: до 4 вылетов авиакомпании из пункта назначения — направление, STD, гейт (AeroDataBox, ваш ключ RapidAPI)."
  hint: "Стыковки (CONNEX): вылеты вашей авиакомпании из аэропорта назначения — рейс, куда, STD и гейт (данные AeroDataBox), для объявлений пассажирам о стыковочных рейсах. Ответ не нужен."
crew_duty_limit:
  title: Рабочее время экипажа на пределе
  description: "На стоянке при задержке 30 мин и больше: последнее допустимое время отхода. EXTEND (продление по решению КВС) оставляет запись для следующего рейса; NO (по умолчанию) — резервный экипаж."
  hint: "Служба планирования экипажей: задержка сокращает запас рабочего времени экипажа (FDP — сколько экипажу можно быть на работе). В сообщении — самое позднее время отхода от стоянки; позже него командиру пришлось бы продлить рабочее время своим решением (commander's discretion). Ответьте, готовы ли вы."
  steps:
    reply:
      reply_hints:
        EXTEND: Командир при необходимости продлит рабочее время своим решением.
        NO: Рабочее время продлеваться не будет.
    extend:
      hint: Служба экипажей зафиксировала решение командира. Оформите отчёт о продлении (discretion report); перед следующей сменой экипаж получит увеличенный отдых. Ответ не нужен.
    no:
      hint: "Служба экипажей подняла резервный экипаж: если вы не отойдёте от стоянки к крайнему сроку, экипаж заменят. Ответ не нужен."
    met:
      hint: "Крайний срок отхода от стоянки прошёл: заказана смена экипажа — когда прибудет новый экипаж и какую задержку ожидать. Ответ не нужен."
crew_info:
  title: Информация об экипаже
  description: Имена экипажа и численность бортпроводников.
  hint: "Состав экипажа рейса от службы планирования экипажей: командир (CPT), второй пилот (FO), старший бортпроводник (SCCM) и число бортпроводников. Ответ не нужен."
curfew_dest:
  title: Ночной запрет в аэропорту назначения
  description: В крейсере, если расчётная посадка близка к ночному запрету аэропорта назначения (только аэропорты с настоящим запретом, обычно после задержки). ABLE — запрошен приоритет, UNABLE — диверсия на запасной.
  hint: "В аэропорту назначения ночной запрет на полёты по шуму (curfew): самое позднее время посадки (UTC и местное) и ваш запас до него. По возможности ускорьтесь и сообщите OPS, успеваете ли вы сесть до запрета."
  steps:
    reply:
      reply_hints:
        ABLE: Вы рассчитываете сесть до запрета.
        UNABLE: Сесть до запрета вы не успеваете.
    able:
      hint: OPS запросил для вас приоритет, хендлинг наготове; если всё же опоздаете — планируйте запасной. Ответ не нужен.
    unable:
      hint: "OPS планирует вашу диверсию на запасной: гостиница и автобусы заказаны, пассажиров доставят до назначения наземным транспортом. Ответ не нужен."
deicing_holdover:
  title: Противообледенительная обработка
  description: "На стоянке, если в аэропорту вылета 3 °C или холоднее: тип жидкости и площадка. После READY — машина обработки и holdover time."
  hint: "В аэропорту вылета нужна противообледенительная обработка из-за холода: тип жидкости, площадка и сколько ожидать на ней. Ответьте READY, когда двери закрыты."
  steps:
    reply:
      reply_hints:
        READY: Двери закрыты, вы готовы к обработке.
    deicing:
      hint: "На вашей площадке назначена машина обработки — смесь жидкости и время защитного действия (holdover: сколько жидкость защищает от нового льда). Перед взлётом сверьтесь с таблицей времени защитного действия. Ответ не нужен."
dep_fire:
  title: Пожар в аэропорту вылета
  description: "От 30 мин до планового вылета и до разбега: пожар на территории аэропорта вылета или рядом (случайная точка у плановой ВПП), вылеты приостановлены на 20–90 мин, обновления каждые 20 мин."
  hint: "OPS аэропорта вылета: пожар на территории аэропорта или рядом, аварийные службы на месте, вылеты приостановлены. Ожидайте задержки и следуйте указаниям УВД; в сообщении — время следующего обновления. Ответ не нужен."
  steps:
    met:
      hint: "OPS аэропорта вылета: пожар под контролем, вылеты возобновлены. Запуск — по разрешению УВД. Ответ не нужен."
departure_report:
  title: Отчёт о вылете (OUT/OFF)
  description: Время отхода от стоянки и взлёта с кодами задержки.
  hint: "Отчёт о вылете: фактическое время отхода от стоянки (OUT) и взлёта (OFF), расчётное время прилёта (ETA) против расписания (STA); при задержке — её коды IATA. Ответ не нужен."
dest_fire:
  title: Пожар в аэропорту назначения
  description: "Примерно за 120 NM: пожар на территории аэропорта назначения или рядом (случайная точка у плановой ВПП), дым сносит по ветру, потушат за 20 мин – 2 ч, обновления каждые 20 мин. HOLD (по умолчанию) — ожидание или DIVERT — на запасной."
  hint: "OPS аэропорта назначения: пожар на территории аэропорта или рядом, дым сносит ветром, в нём плохая видимость, аварийные службы на месте. Оценки пока нет: подготовьте уход на запасной и сообщите OPS, будете ли вы ждать в зоне ожидания или уходите."
  steps:
    reply:
      reply_hints:
        HOLD: Ждать в зоне ожидания; OPS сообщит новости к указанному времени.
        DIVERT: Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM).
    hold:
      hint: OPS принял, что вы ждёте; следующее обновление — к указанному времени. Если топливо станет критическим, сообщите OPS telex свободным текстом.
    reply_2:
      reply_hints:
        HOLD: Продолжать ожидание до следующего обновления.
        DIVERT: Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM).
    hold_2:
      hint: "Обновление от OPS аэропорта назначения: пожар продолжается. Сообщите OPS, продолжаете ли вы ожидание или уходите на запасной."
    divert:
      hint: OPS принял вашу диверсию и расстояние до аэропорта, заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете.
    met:
      hint: "Пожар под контролем, приём рейсов в аэропорту назначения возобновлён: ожидайте обычного захода. Ответ не нужен."
    divert_2:
      hint: OPS принял вашу диверсию и расстояние до аэропорта, заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете.
dest_weather:
  title: Погода назначения до TOD
  description: Погода назначения и запасного по METAR из OFP перед TOD.
  hint: Погода в аэропорту назначения и на запасном (METAR из плана полёта) перед началом снижения — для брифинга на заход. Ответ не нужен.
dest_weather_live:
  title: Погода назначения до TOD (живые данные)
  description: Погода назначения и запасного по живым METAR/TAF перед TOD.
  hint: Текущая погода в аэропорту назначения (METAR и TAF) и на запасном (METAR) перед началом снижения — для брифинга на заход. Ответ не нужен.
dg_notoc:
  title: Опасный груз (NOTOC)
  description: "Перед вылетом: опасный груз на борту — номер ООН, класс, позиция. Ответ ACK — подпись КВС."
  hint: "NOTOC (уведомление командиру): на борту опасные грузы — номер ООН (UN), класс, место в багажном отсеке и число мест; CAO NO значит, что их можно возить на пассажирском самолёте. Подтвердите ответом ACK — он заменяет подпись командира."
  steps:
    reply:
      reply_hints:
        ACK: Вы прочитали NOTOC; это считается вашей подписью.
    notoc:
      hint: "Служба загрузки получила подтверждение: копия — в полётную папку, руководитель загрузки в курсе. Ответ не нужен."
discretion_followup:
  title: Отдых после продления (следующий рейс)
  description: "Перед следующим рейсом после продления смены: увеличенный отдых, в экипаж вводится резервный второй пилот."
  hint: "Служба планирования экипажей: после решения командира продлить рабочее время сверх лимита (commander's discretion) на прошлом рейсе экипаж получает увеличенный отдых, к нему присоединяется резервный второй пилот. Время брифинга — в сообщении. Ответ не нужен."
divert_arrival:
  title: Прилёт на запасной (диверсия)
  description: "На стоянке после диверсии: наземное обслуживание, заправка и пассажиры, запрос нового плана. Оставляет запись для следующего рейса из этого аэропорта."
  hint: "OPS после вашей диверсии: хендлинг и заправка заказаны, о пассажирах позаботятся, пассажиров до назначения переоформляют. OPS просит прислать заявку на топливо и новое время вылета (ETD) telex свободным текстом."
drone_activity:
  title: Дрон у аэропорта назначения
  description: "Примерно за 90 NM: прилёты приостановлены из-за дрона на срок от 30 мин до 3 ч, обновления каждые 20 мин. HOLD (по умолчанию) или DIVERT — на запасной."
  hint: "OPS аэропорта назначения: у аэропорта замечен дрон, приём рейсов приостановлен, оценки пока нет. Сообщите OPS, будете ли вы ждать в зоне ожидания или уходите на запасной."
  steps:
    reply:
      reply_hints:
        HOLD: Ждать в зоне ожидания; OPS сообщит новости к указанному времени.
        DIVERT: Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM).
    hold:
      hint: OPS принял, что вы ждёте; следующее обновление — к указанному времени. Если топливо станет критическим, сообщите OPS telex свободным текстом.
    reply_2:
      reply_hints:
        HOLD: Продолжать ожидание до следующего обновления.
        DIVERT: Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM).
    hold_2:
      hint: "Обновление от OPS аэропорта назначения: приём рейсов всё ещё приостановлен. Сообщите OPS, продолжаете ли вы ожидание или уходите на запасной."
    divert:
      hint: OPS принял вашу диверсию и расстояние до аэропорта; хендлинг там заказан, данные о пассажирах отправлены. Ответ не нужен.
    met:
      hint: "Активность дрона прекратилась, приём рейсов в аэропорту назначения возобновлён: ожидайте обычного захода. Ответ не нужен."
    divert_2:
      hint: OPS принял вашу диверсию и расстояние до аэропорта; хендлинг там заказан, данные о пассажирах отправлены. Ответ не нужен.
earthquake_dest:
  title: Землетрясение у аэропорта назначения
  description: Землетрясение M ≥ 5,0 в пределах 100 км от аэропорта назначения за последние сутки (USGS).
  hint: "Информация OPS: недавнее землетрясение рядом с аэропортом назначения — магнитуда, место, расстояние от аэропорта и глубина (USGS). Проверьте в NOTAM состояние аэропорта. Ответ не нужен."
emergency_mayday:
  title: Объявлен MAYDAY
  description: Экипаж объявил MAYDAY станции XATC. Аварийный центр авиакомпании предлагает диверсию на ближайший подходящий аэропорт (через 5 мин — DIVERT) и поднимает пожарных и медиков; на земле — службы аэропорта, где стоит самолёт. Запускается только после MAYDAY на станцию XATC.
  hint: Аварийный центр авиакомпании получил ваш MAYDAY через УВД и называет ближайший подходящий аэропорт и расстояние до него. Сообщите OPS, уходите ли вы на него или продолжаете полёт.
  steps:
    ground:
      hint: "Аварийный центр авиакомпании получил ваш MAYDAY через УВД, пока вы на земле: аварийно-спасательная служба аэропорта поднята. Сообщите OPS telex свободным текстом, что вы намерены делать."
    reply:
      reply_hints:
        DIVERT: Уйти на ближайший подходящий аэропорт или на другой, названный после слова (DIVERT EDDM).
        CONTINUE: Продолжать полёт до аэропорта назначения.
    divert:
      hint: "OPS подтверждает аэропорт диверсии и расстояние до него: аварийно-спасательная служба поднята, медпомощь и хендлинг заказаны. Сообщите новое ETA telex свободным текстом, когда сможете."
    continue:
      hint: OPS принял, что вы продолжаете полёт до назначения; аварийно-спасательная служба там поднята. Сообщите OPS, если план изменится. Ответ не нужен.
emergency_pan:
  title: Объявлен PAN PAN
  description: "Экипаж объявил PAN PAN станции XATC. Центр авиакомпании предлагает DIVERT или CONTINUE (через 5 мин — CONTINUE), аэропорт назначения предупреждён: пожарные и медики в готовности; на земле — службы аэропорта, где стоит самолёт. Запускается только после PAN PAN на станцию XATC."
  hint: "Аварийный центр авиакомпании получил ваш PAN PAN через УВД: аэропорт назначения предупреждён, спасатели и медики там в готовности. Он называет ближайший подходящий аэропорт и спрашивает, уходите ли вы на него или продолжаете полёт."
  steps:
    ground:
      hint: "Аварийный центр авиакомпании получил ваш PAN PAN через УВД, пока вы на земле: спасатели и медики аэропорта в готовности. Сообщите OPS telex свободным текстом, что вы намерены делать."
    reply:
      reply_hints:
        DIVERT: Уйти на ближайший подходящий аэропорт или на другой, названный после слова (DIVERT EDDM).
        CONTINUE: Продолжать полёт до аэропорта назначения.
    divert:
      hint: OPS подтверждает аэропорт диверсии и расстояние до него; спасатели и хендлинг туда заказаны. Сообщите новое ETA telex свободным текстом, когда сможете.
    continue:
      hint: OPS принял, что вы продолжаете полёт до назначения. Сообщите OPS, если ситуация изменится. Ответ не нужен.
f1_result:
  title: Результат Формулы-1
  description: "Гран-при, завершившийся во время полёта: тройка призёров (Jolpica)."
  hint: "Информация OPS: результат Гран-при «Формулы-1», завершившегося во время рейса. Ответ не нужен."
fdm_letter:
  title: Письмо по мониторингу полётных данных (FDM)
  description: "Через 3 мин после постановки на стоянку, если мониторинг полётных данных нашёл события (вертикальная скорость снижения, шасси или закрылки на 1000 фут, скорость больше 250 узлов ниже 10 000 фут, уход на второй круг): отдел безопасности полётов перечисляет их. ACK или REPORT (отчёт о безопасности)."
  hint: "Отдел безопасности полётов: мониторинг полётных данных (FDM) нашёл в вашем рейсе эти события — величину, высоту и время UTC каждого. Это информация для вас, а не обвинение. Ответьте ACK или REPORT, если подадите отчёт о безопасности полёта (ASR)."
  steps:
    reply:
      reply_hints:
        ACK: Экипаж ознакомился с событиями.
        REPORT: Экипаж подаст отчёт о безопасности полёта (ASR) по событиям.
    ack:
      hint: Отдел безопасности полётов принял, что вы ознакомились с событиями. Ответ не нужен.
    report:
      hint: Отдел безопасности полётов ждёт ваш отчёт о безопасности (ASR) и свяжется с вами. Ответ не нужен.
ferry_after_mx:
  title: Перегон после ТО
  description: "Перед перегоном: самолёт выходит из ТО, допущен к эксплуатации; проверьте бортовой журнал."
  hint: "Служба ТО: самолёт вышел из технического обслуживания и допущен к эксплуатации. Проверьте записи в бортовом техническом журнале перед вылетом. Ответ не нужен."
ferry_loadsheet:
  title: Лоадшит (перегон)
  description: "Лоадшит перегона: только экипаж, без пассажиров и груза."
  hint: "Лоадшит перегона или позиционирования: только экипаж, без пассажиров и груза; массы (ZFW, TOW, LAW против максимумов), топливо на взлёт и на рейс. Проверьте цифры и используйте их в FMS; ответ не нужен."
ferry_permit:
  title: Разрешение на перегон
  description: "Перед перегоном: самолёт летит в ТО по специальному разрешению на полёт (США) или permit to fly. Ответ ACK."
  hint: "Служба ТО: самолёт не полностью соответствует требованиям лётной годности, но может перелететь на базу ТО по разрешению на перегон; разрешение и его ограничения — в документах самолёта. Прочитайте их и подтвердите ответом ACK."
  steps:
    reply:
      reply_hints:
        ACK: Вы прочитали разрешение и его ограничения.
    ack:
      hint: "Служба ТО получила подтверждение; база ТО в аэропорту назначения ждёт самолёт. Ответ не нужен."
ferry_positioning:
  title: Позиционирование под следующий рейс (перегон)
  description: "В крейсере на перегоне: самолёт перегоняется под следующий вылет (только по данным AeroDataBox)."
  hint: "Служба перевозок: этот рейс перегоняет самолёт под его следующий вылет из аэропорта назначения — рейс, маршрут и STD по данным AeroDataBox. Ответ не нужен."
final_loadsheet:
  title: Окончательный лоадшит
  description: Окончательный лоадшит с изменениями относительно предварительного.
  hint: "Окончательная загрузочная ведомость (лоадшит) от службы загрузки: фактические массы против ограничений (ZFW без топлива, TOW взлётная, LAW посадочная), топливо на взлёт и на рейс (TOF, TIF), пассажиры и груз; LMC — изменения в последний момент против предварительной ведомости. Проверьте цифры и используйте их в FMS; ответ не нужен."
fuel_monitoring:
  title: Топливо ниже плана
  description: "В крейсере, если топливо на борту ниже плана OFP в этой точке больше чем на 5 % (не менее 500 кг), диспетчер спрашивает причину: WX, ATC, LEAK или NORMAL."
  hint: Диспетчер авиакомпании видит, что топлива на борту меньше, чем по плану полёта в этой точке, на указанную величину. Он спрашивает причину.
  steps:
    reply:
      reply_hints:
        WX: "Погода: обходы, ветер, обледенение."
        ATC: "УВД: маршрут, эшелоны или ожидание не по плану."
        LEAK: Вы подозреваете утечку топлива.
        NORMAL: Ничего необычного, разница ожидаемая.
    wx:
      hint: Диспетчер авиакомпании принял погоду как причину и просит пересчитать топливо на назначение и запасной; если его меньше требуемого — сообщите telex свободным текстом. Ответ не нужен.
    atc:
      hint: Диспетчер авиакомпании принял УВД как причину и советует запросить у УВД прямой маршрут или более выгодный эшелон; если топлива меньше требуемого — сообщите telex свободным текстом. Ответ не нужен.
    leak:
      hint: "Диспетчер авиакомпании подозревает утечку топлива: проверьте топливную систему. Он называет ближайший запасной и расстояние; если утечка подтвердится — уходите на него. Ответ не нужен."
    normal:
      hint: Диспетчер авиакомпании принял к сведению. Следите за топливом и сообщите, если разница будет расти. Ответ не нужен.
fuel_slip:
  title: Топливная квитанция
  description: "После заправки: заправлено и отклонение от плана."
  hint: "Квитанция о заправке: топливо по плану перед рулением, на борту, сколько заправлено и отклонение от плана, а также разбивка из плана полёта (руление, рейс, навигационный запас, запасной, финальный резерв, дополнительное). Ответ не нужен."
gate_assignment:
  title: Назначение гейта
  description: Назначение гейта вылета.
  hint: OPS сообщает ожидаемый гейт или стоянку в аэропорту назначения. Ответ не нужен.
gate_reassignment:
  title: Смена гейта
  description: "В начале снижения назначенный гейт занят: новый гейт, который дальше используют arrival info и REQ GATE."
  hint: "Смена гейта: выделенный гейт занят (причина — в сообщении), вам дают новый; лента багажа прежняя. Информация о прилёте и REQ GATE теперь указывают новый гейт. Ответ не нужен."
hard_landing_check:
  title: Проверка после грубой посадки
  description: "На стоянке, если вертикальная скорость касания была выше 350 фут/мин (нужно значение от моста): техслужба просит подтвердить грубую посадку. CONFIRM — осмотр перед следующим рейсом на этом борту."
  hint: "Техслужба: система мониторинга полётных данных (FDM) записала касание с указанной вертикальной скоростью. Она спрашивает, почувствовал ли экипаж грубую посадку."
  steps:
    reply:
      reply_hints:
        CONFIRM: Да, экипаж отметил грубую посадку.
        NEGATIVE: Нет, не отметил.
    confirm:
      hint: "Запишите грубую посадку в бортовой журнал: перед следующим рейсом самолёт осмотрят по руководству по ТО (AMM). Ответ не нужен."
    negative:
      hint: Техслужба приняла, что экипаж грубой посадки не отметил; полётные данные сохранены. Ответ не нужен.
hard_landing_followup:
  title: Осмотр после грубой посадки выполнен
  description: "Перед рейсом на том же борту после подтверждённой грубой посадки: техслужба сообщает, что осмотр выполнен и борт выпущен."
  hint: "Техслужба: после грубой посадки, о которой сообщили на этом самолёте, осмотр выполнен, повреждений нет, самолёт допущен к полётам. Ответ не нужен."
hold_fuel_watch:
  title: Минимум топлива для ухода в зоне ожидания
  description: "Топливо в ожидании (дрон, закрытая ВПП, пожар) дошло до минимума для ухода: рекомендуется DIVERT (ответ STAY — остаться в ожидании), без ответа за 5 мин рейс уходит на запасной."
  hint: "OPS аэропорта назначения: пока вы в зоне ожидания, топливо снизилось до минимума для ухода на запасной. OPS рекомендует уходить сейчас и спрашивает, уходите ли вы или остаётесь в ожидании."
  steps:
    reply:
      reply_hints:
        DIVERT: Уходить на запасной сейчас.
        STAY: Оставаться в зоне ожидания — решение командира.
    divert:
      hint: OPS принял вашу диверсию на запасной и заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете.
    stay:
      hint: OPS принял, что вы остаётесь в ожидании по решению командира, и просит сообщить остаток топлива telex свободным текстом.
holiday_dest:
  title: Праздник в стране назначения
  description: Общенациональный праздник в стране назначения в день прилёта по местному времени (Nager.Date).
  hint: "Информация OPS: сегодня в стране назначения государственный праздник. Ожидайте праздничного режима работы служб в аэропорту. Ответ не нужен."
landing_data:
  title: Данные для посадки
  description: "Данные посадки из OFP: ВПП, погода, закрылки и VREF, если они есть в OFP."
  hint: "Данные на посадку из плана полёта: ВПП и STAR, превышение аэродрома, эшелон перехода, посадочная масса против ограничения, топливо на посадке и до запасного; закрылки и VREF, если они есть в плане. Для брифинга на заход, ответ не нужен."
lost_baggage:
  title: Багаж не долетел
  description: "На стоянке: часть багажа осталась в аэропорту вылета (не успели при трансфере), стойка розыска у ленты. Следующий рейс получит закрытие дела."
  hint: "Багаж: часть багажа не погрузили в аэропорту вылета (не успели при пересадке). Пассажиры оформляют заявку на стойке розыска (PIR, Property Irregularity Report) у ленты; багаж доставят следующим рейсом. Ответ не нужен."
medical_onboard:
  title: Медицинский случай на борту
  description: В крейсере бортпроводники сообщают о плохом самочувствии пассажира. Ответ CONTINUE или DIVERT (через 10 мин — CONTINUE). DIVERT — диверсия на ближайший из аэропорта вылета и запасных.
  hint: "OPS: бортпроводники сообщают о медицинском случае на борту — место, возраст пассажира, симптомы и есть ли на борту врач. Следом придёт совет MedLink — наземных врачей, которые консультируют экипажи."
  steps:
    met:
      hint: Врача на борту нет, MedLink настоятельно советует уходить на запасной сейчас. Сообщите OPS, продолжаете ли вы полёт или уходите.
    timeout:
      hint: MedLink советует уходить на запасной, если пассажиру не станет лучше. Сообщите OPS, продолжаете ли вы полёт или уходите.
    reply:
      reply_hints:
        CONTINUE: Продолжать полёт до назначения; после слова можно добавить короткое пояснение.
        DIVERT: Уйти на запасной; после слова можно указать ICAO аэропорта и короткое пояснение (DIVERT EDDM PAX STABLE).
    divert:
      hint: OPS подтверждает аэропорт диверсии и расстояние до него, заказал туда скорую и хендлинг. Сообщите новое ETA telex свободным текстом, когда сможете.
    divert_2:
      hint: Медики ждут у двери самолёта; пациент выходит раньше остальных пассажиров. Ответ не нужен.
    continue:
      hint: OPS принял, что вы продолжаете полёт до назначения, и просит запросить у УВД приоритет. Ответ не нужен.
    continue_2:
      hint: Медики ждут у двери самолёта; пациент выходит раньше остальных пассажиров. Ответ не нужен.
mel_carry_over:
  title: Открытый пункт MEL с прошлого рейса
  description: "Перед рейсом на том же борту: отложенный пункт MEL всё ещё открыт. После прилёта техники его закрывают."
  hint: "Статус MEL этого самолёта: неисправность, отложенная по MEL (перечню минимального оборудования) на прошлом рейсе, всё ещё открыта. Выполняйте рейс по эксплуатационной процедуре MEL для неё и проверьте поправки к характеристикам и топливу; техслужба запланировала её устранение в аэропорту назначения. Ответ не нужен."
  steps:
    mel_status:
      hint: "Статус MEL: техслужба устранила отложенную неисправность в этом аэропорту, пункт MEL закрыт и подписан в бортовом журнале. Ответ не нужен."
natural_event:
  title: Природное явление у маршрута
  description: Природное явление (NASA EONET) рядом с маршрутом впереди.
  hint: "Предупреждение OPS: впереди рядом с маршрутом природное событие по данным NASA EONET (пожар, шторм, вулкан и т. п.), с расстоянием впереди и в стороне от маршрута. Проверьте метеорадар и SIGMET, при необходимости обходите. Ответ не нужен."
next_leg:
  title: Следующий рейс
  description: Следующий рейс на том же самолёте.
  hint: "OPS сообщает ваш следующий рейс на этом же самолёте: номер, маршрут, STD и время на оборот. Ответ не нужен."
nhl_results:
  title: Результаты NHL
  description: Матчи NHL, завершившиеся во время полёта (регулярный сезон и плей-офф).
  hint: "Информация OPS: итоговые счета матчей NHL, завершившихся во время рейса. Ответ не нужен."
ped_fire_cabin:
  title: Возгорание литиевой батареи в салоне
  description: В крейсере бортпроводники сообщают о возгорании батареи пассажирского устройства. Рекомендации по FAA SAFO 09013. Ответ CONTINUE или DIVERT (через 5 мин — DIVERT).
  hint: "OPS: бортпроводники сообщают о возгорании литиевой батареи в личном электронном устройстве пассажира (PED), указано место, и как тушить: водой или галоном, охлаждать элементы водой, без огнестойкого мешка. Сообщите OPS, продолжаете ли вы полёт или уходите на запасной."
  steps:
    reply:
      reply_hints:
        CONTINUE: Огонь потушен, продолжать полёт до назначения.
        DIVERT: Уйти на ближайший подходящий аэропорт или на другой, названный после слова (DIVERT EDDM).
    divert:
      hint: OPS подтверждает диверсию и расстояние, заказал туда пожарную службу. Сообщите новое ETA telex свободным текстом, когда сможете.
    divert_2:
      hint: Пожарные встречают у двери самолёта и забирают устройство. Ответ не нужен.
    continue:
      hint: OPS принял, что вы продолжаете полёт до назначения. Следите за салоном и сообщите OPS, если огонь возобновится. Ответ не нужен.
    continue_2:
      hint: Пожарные встречают у двери самолёта и забирают устройство. Ответ не нужен.
prelim_loadsheet:
  title: Предварительный лоадшит
  description: Предварительный лоадшит по плановым цифрам из OFP.
  hint: "Предварительная загрузочная ведомость: плановые массы и топливо из плана полёта (ZFW, TOF, TOW, TIF, LAW против максимумов), пассажиры и груз. По ней готовят FMS; окончательные цифры придут в финальной ведомости. Ответ не нужен."
recovery_followup:
  title: Продолжение после диверсии
  description: "Перед рейсом из аэропорта прежней диверсии: борт сюда уходил на запасной, проверяются рабочее время экипажа и новый план полёта."
  hint: "OPS перед рейсом из аэропорта прошлой диверсии: рабочее время экипажа проверено, новый план полёта и топливо заказаны; ожидайте опоздания пассажиров и багажа. Ответ не нужен."
runway_closure_dest:
  title: Закрыта ВПП назначения
  description: В начале снижения плановая ВПП закрыта (от 30 мин до 3 ч, изредка — на неопределённый срок), обновления каждые 20 мин. HOLD (по умолчанию) — ожидание или DIVERT — на запасной.
  hint: "OPS аэропорта назначения: ваша плановая ВПП закрыта (причина — в сообщении), оценки пока нет. Проверьте топливо и сообщите OPS, будете ли вы ждать в зоне ожидания или уходите на запасной."
  steps:
    reply:
      reply_hints:
        HOLD: Ждать в зоне ожидания открытия ВПП; OPS сообщит новости к указанному времени.
        DIVERT: Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM).
    hold:
      hint: OPS принял, что вы ждёте; стоянка и обслуживание без изменений, следующее обновление — к указанному времени.
    reply_2:
      reply_hints:
        HOLD: Продолжать ожидание до следующего обновления.
        DIVERT: Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM).
    hold_2:
      hint: "OPS: аэродром назначения закрыт до особого распоряжения (UFN), поэтому вы уходите на запасной; хендлинг и топливо там заказаны. Ответ не нужен."
    hold_3:
      hint: "Обновление от OPS аэропорта назначения: ВПП всё ещё закрыта, приём рейсов приостановлен. Сообщите OPS, продолжаете ли вы ожидание или уходите на запасной."
    divert:
      hint: OPS принял вашу диверсию и расстояние до аэропорта, заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете.
    met:
      hint: "ВПП снова открыта, приём рейсов в аэропорту назначения возобновлён: ожидайте обычного захода. Ответ не нужен."
    divert_2:
      hint: OPS принял вашу диверсию и расстояние до аэропорта, заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете.
rush_bags_followup:
  title: Багаж доставлен (следующий рейс)
  description: "Перед следующим рейсом: оставшийся багаж доставлен владельцам, дело закрыто."
  hint: "Багаж: багаж, оставшийся на прошлом рейсе, доставлен владельцам, дело о розыске (PIR) закрыто. Ответ не нужен."
short_connection:
  title: Короткая стыковка пассажиров
  description: "Перед снижением, если до стыковочного рейса меньше часа: сколько пассажиров, рейс, STD; просьба ускориться."
  hint: "Стыковки: у пассажиров вашего рейса короткая пересадка на дальнейший рейс; в сообщении — рейс, его STD и запас времени. OPS просит по возможности ускорить прилёт; у гейта их встретят сотрудники трансфера. Ответ не нужен."
slot_ctot:
  title: Слот / CTOT
  description: Слот управления потоками с CTOT, задерживающий вылет.
  hint: "Ограничение потока УВД: рейсу выдан слот — расчётное время взлёта (CTOT) — и задержка из-за него. Планируйте посадку пассажиров и буксировку так, чтобы взлететь к CTOT; командой RDY можно сообщить OPS, что вы готовы раньше. Ответ не нужен."
slot_missed:
  title: Слот пропущен
  description: "Взлёт позже CTOT + 10 мин (допуск -5/+10 мин): сообщение о пропущенном слоте."
  hint: Вы взлетели вне окна слота вокруг CTOT (−5/+10 мин), и авиакомпания сообщает о нарушении слота в службу организации потоков (ATFM). Ответ не нужен.
solar_eclipse:
  title: Солнечное затмение на маршруте
  description: Точка маршрута впереди в полосе затмения (фаза ≥ 0,5) в момент пролёта, солнце над горизонтом (NASA).
  hint: "Информация OPS: с вашего маршрута будет видно солнечное затмение — вид, фаза, время, место и высота солнца. Не смотрите на солнце без защиты глаз. Ответ не нужен."
space_launch:
  title: Пуск ракеты рядом с маршрутом
  description: Подтверждённый пуск (TheSpaceDevs, статус Go) в пределах 300 NM от маршрута впереди, до прилёта.
  hint: "Предупреждение OPS: рядом с маршрутом запланирован пуск ракеты — время «не ранее» (NET), окно пуска и расстояние. Ожидайте ограничений воздушного пространства вокруг и проверьте NOTAM. Ответ не нужен."
space_launch_done:
  title: Пуск ракеты рядом с маршрутом (состоялся)
  description: Пуск, состоявшийся после взлёта (TheSpaceDevs), в пределах 300 NM от маршрута впереди.
  hint: "Предупреждение OPS: после вашего взлёта рядом с маршрутом состоялся пуск ракеты — время и результат. Могут действовать зоны, закрытые из-за падающих обломков; проверьте NOTAM. Ответ не нужен."
space_weather:
  title: Космическая погода
  description: Шкала NOAA R3+, S2+ (маршрут выше 60° широты) или G3+ (сейчас или в прогнозе на сутки).
  hint: "Предупреждение OPS: NOAA сообщает о сильной космической погоде (радиозатмение, радиационная или геомагнитная буря). Она может мешать КВ-связи, SATCOM и GNSS — проверьте их. Ответ не нужен."
takeoff_data:
  title: Данные для взлёта
  description: "Данные вылета из OFP: ВПП, погода, закрылки, тяга и V-скорости, если они есть в OFP."
  hint: "Данные на взлёт из плана полёта: ВПП и SID, превышение, высота перехода, взлётная масса против ограничения, топливо на взлёт, крейсерский эшелон, cost index и погода на вылете; закрылки, тяга и скорости V, если они есть в плане. Сверьте со своим расчётом; ответ не нужен."
tankering:
  title: Танкеровка топлива
  description: "Перед вылетом: топливо в пункте назначения дорогое, предлагается взять дополнительно, если позволяет посадочный вес. ACCEPT или DECLINE (по умолчанию)."
  hint: "Топливная служба: топливо в аэропорту назначения дорогое, поэтому она советует танкеровку — взять отсюда дополнительное топливо на следующий рейс. В сообщении — сколько добавить, новое топливо перед рулением и расчётная посадочная масса против максимальной. Сообщите, согласны ли вы."
  steps:
    reply:
      reply_hints:
        ACCEPT: Взять дополнительное топливо.
        DECLINE: Оставить топливо по плану.
    accept:
      hint: "Танкеровка принята: заправщику передано новое топливо, следом придёт ведомость с ним. Ответ не нужен."
    decline:
      hint: "Диспетчер авиакомпании принял: топливо остаётся по плану полёта. Ответ не нужен."
tech_defect_mel:
  title: Технический отказ и MEL
  description: В крейсере техслужба сообщает об отказе системы. CONFIRM — пункт откладывается по MEL и остаётся открытым на этом борту; NEGATIVE (по умолчанию) — ложное сообщение.
  hint: "Техслужба: бортовая система технического обслуживания (CMS) сообщает об отказе, указан пункт MEL. Она спрашивает, видит ли экипаж ту же индикацию в системе предупреждений."
  steps:
    reply:
      reply_hints:
        CONFIRM: Да, экипаж видит индикацию этого отказа.
        NEGATIVE: Нет, в кабине такой индикации нет.
    confirm:
      hint: "Запишите неисправность в бортовой журнал: она отложена по MEL (перечню минимального оборудования), категория устранения C, следующий рейс самолёт выполняет по MEL. Техслужба встретит самолёт в аэропорту назначения. Ответ не нужен."
    negative:
      hint: "Техслужба считает это ложным сообщением системы ТО: никаких действий не требуется. Ответ не нужен."
unruly_followup:
  title: "Дебошир: итог (следующий рейс)"
  description: "Перед следующим рейсом: пассажир с прошлого рейса внесён в чёрный список авиакомпании."
  hint: "Информация безопасности: дебошир с прошлого рейса внесён в список лиц, которым авиакомпания отказывает в перевозке, в полицию подано заявление. Ответ не нужен."
unruly_passenger:
  title: Пассажир-дебошир
  description: В крейсере экипаж сообщает о дебоширящем пассажире. RESTRAIN — полиция по прилёте, DIVERT — ближайший аэропорт, CONTINUE (по умолчанию) — наблюдать. RESTRAIN и DIVERT оставляют запись для следующего рейса.
  hint: "Служба безопасности OPS: бортпроводники сообщают о дебошире — место и что случилось; экипаж сделал официальное предупреждение. Сообщите OPS, что вы делаете: ограничиваете пассажира в действиях, уходите на запасной или продолжаете полёт."
  steps:
    reply:
      reply_hints:
        RESTRAIN: Экипаж ограничивает пассажира в действиях, вы продолжаете полёт.
        DIVERT: Уйти на ближайший подходящий аэропорт или на другой, названный после слова (DIVERT EDDM).
        CONTINUE: Продолжать полёт; экипаж наблюдает за пассажиром.
    restrain:
      hint: "OPS принял, что пассажир ограничен: полиция встретит самолёт в аэропорту назначения. Не открывайте двери до прихода полиции и оформите отчёт об инциденте в салоне. Ответ не нужен."
    restrain_2:
      hint: Полиция у двери самолёта за пассажиром с указанного места. Не выпускайте остальных пассажиров, пока полиция не поднимется на борт. Ответ не нужен.
    divert:
      hint: OPS принял вашу диверсию; полиция и хендлинг туда заказаны. Оформите отчёт об инциденте в салоне. Ответ не нужен.
    continue:
      hint: OPS принял, что вы продолжаете полёт, а экипаж наблюдает за пассажиром. Сообщите OPS, если ситуация изменится. Ответ не нужен.
vatsim_atc:
  title: Диспетчеры VATSIM в аэропорту назначения
  description: Онлайн-диспетчеры VATSIM в аэропорту назначения перед TOD.
  hint: Какие диспетчеры VATSIM сейчас онлайн в аэропорту назначения и буква ATIS — чтобы спланировать частоты на прилёт. Ответ не нужен.
vatsim_atc_none:
  title: Нет диспетчеров VATSIM в аэропорту назначения
  description: В аэропорту назначения нет онлайн-диспетчеров VATSIM перед TOD.
  hint: "В аэропорту назначения сейчас нет диспетчеров VATSIM: работайте на UNICOM 122.800 и сами сообщайте своё местоположение. Проверьте ещё раз перед заходом. Ответ не нужен."
vdgs_arrival:
  title: Табло стоянки (GSX)
  description: Номер рейса, аэропорт вылета и гейт на табло VDGS от GSX на стоянке прилёта.
  hint: "Не сообщение: ваш рейс, аэропорт вылета и гейт на табло стыковки GSX (VDGS) на стоянке."
vdgs_departure:
  title: Табло вылета (GSX)
  description: "В аэропорту A-CDM: рейс, назначение, TOBT авиакомпании с обратным отсчётом, ВПП и SID на табло VDGS от GSX на стоянке вылета."
  hint: "Не сообщение: табло стыковки GSX на стоянке вылета показывает рейс, назначение, ВПП и SID, а за 30 мин — целевое время готовности авиакомпании (TOBT) с обратным отсчётом. DELAY сдвигает TOBT; если через 15 мин после него вы не ушли с блоков, табло просит новый TOBT."
vdgs_departure_etd:
  title: Табло вылета вне A-CDM (GSX)
  description: "Не реальное табло: в аэропортах без A-CDM — рейс, назначение, ETD с обратным отсчётом, ВПП и SID на табло VDGS от GSX на стоянке вылета."
  hint: "Не сообщение и не копия реального табло: в аэропортах без A-CDM табло стыковки GSX на стоянке вылета показывает рейс, назначение, ВПП и SID, а за 30 мин — ожидаемое время ухода с блоков (ETD) со всеми задержками и обратным отсчётом."
vdgs_divert:
  title: Табло стоянки при диверсии (GSX)
  description: Номер рейса, красная строка DIVERTED и аэропорт вылета на табло VDGS от GSX в аэропорту диверсии.
  hint: "Не сообщение: ваш рейс, красная строка DIVERTED и аэропорт вылета на табло стыковки GSX (VDGS) в аэропорту диверсии."
vip_onboard:
  title: VIP на борту
  description: "Перед вылетом: VIP и его место; на стоянке после прилёта — выходит первым, протокольная машина у гейта."
  hint: "OPS: на борту VIP-пассажир, указано место. Он садится последним и выходит первым; объявлений о нём на борту не делать. Ответ не нужен."
  steps:
    ops_msg:
      hint: "OPS по прилёте: VIP выходит первым, у гейта ждёт протокольная машина; задержите остальных пассажиров на борту на указанное время. Ответ не нужен."
volcanic_ash:
  title: Вулканический пепел у маршрута
  description: Действующий SIGMET VA в пределах 300 NM от маршрута впереди.
  hint: "Предупреждение OPS: впереди рядом с маршрутом действует SIGMET о вулканическом пепле — вулкан, высоты облака пепла, расстояния и срок действия. Держитесь в стороне от зоны пепла и проверьте SIGMET. Ответ не нужен."
welcome_turnaround:
  title: Приветствие и оборот
  description: Приветствие и план оборота самолёта.
  hint: "Приветствие от станции в аэропорту назначения с планом оборота: время на оборот, следующий рейс и STD, уборка и бортпитание в пути. Ответ не нужен."
