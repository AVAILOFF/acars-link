# DELAY <min> <reason>: the core has already moved the schedule (est_*, time triggers) by
# the minutes; this confirms it with the new off-block time.
id: cmd_delay
version: 1
category: ops
title: "Pilot command: DELAY"
title_ru: "Команда пилота: DELAY"
description: "DELAY command: confirms the new off-block time."
description_ru: "Команда DELAY: подтверждает новое время отхода от стоянки."
hint: "OPS confirms your DELAY report: the minutes and the reason you gave, the new estimated off-block time (EOBT) and the total delay of the flight. No reply needed."
hint_ru: "OPS подтверждает ваш DELAY: минуты и причина, которые вы указали, новое расчётное время отхода от стоянки (EOBT) и общая задержка рейса. Ответ не нужен."
enabled_by_default: true
trigger:
  on: command
  command: DELAY
steps:
  - send:
      header: DELAY RCVD
      body: |
        {ofp.callsign} DELAY {cmd.minutes} MIN
        REASON {cmd.reason|or:NOT GIVEN}
        NEW EOBT {ofp.est_out|hhmm}Z
        TOTAL DELAY {flight.delay_min} MIN
      footer: "OPS {name:ops}"
