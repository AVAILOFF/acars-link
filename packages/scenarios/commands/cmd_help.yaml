# HELP: the list of pilot commands (docs/05 "Входящие команды пилота").
id: cmd_help
version: 1
category: ops
title: "Pilot command: HELP"
title_ru: "Команда пилота: HELP"
description: "HELP command: the list of pilot commands."
description_ru: "Команда HELP: список команд пилота."
enabled_by_default: true
trigger:
  on: command
  command: HELP
steps:
  - send:
      header: OPS COMMANDS
      body: |
        REQ WX ICAO
        REQ GATE
        REQ LOADSHEET
        DELAY MIN REASON
        DIVERT ICAO
        ETA
        RDY
        REQ ATIS ICAO
        REQ GATE CHANGE
        MEDICAL TEXT
        ATC LOGON X+FIR
        DCL TELEX TO X{ofp.orig}
      footer: SEND AS FREE TEXT TELEX
