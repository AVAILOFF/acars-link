# HELP: the list of pilot commands (docs/05 "Входящие команды пилота").
id: cmd_help
version: 1
category: ops
title: "Pilot command: HELP"
description: "HELP command: the list of pilot commands."
hint: "Free text goes to OPS as a telex; HELP returns the list of commands OPS understands. Send a command as a telex to the airline station; ATC LOGON and the departure clearance (DCL) go to the XATC stations (X + FIR, X + departure airport)."
enabled_by_default: true
trigger:
  on: command
  command: HELP
steps:
  - send:
      header: OPS COMMANDS
      body: |
        REQ WX ICAO
        REQ GATE
        REQ LOADSHEET
        DELAY MIN REASON
        DIVERT ICAO
        ETA
        RDY
        REQ ATIS ICAO
        REQ NOTAM ICAO
        REQ GATE CHANGE
        MEDICAL TEXT
        ATC LOGON X+FIR
        DCL TELEX TO X{ofp.orig}
      footer: SEND AS FREE TEXT TELEX
