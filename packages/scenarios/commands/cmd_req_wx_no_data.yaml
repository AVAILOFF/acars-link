# REQ WX for an airport without weather: not in the OFP and no live report (T13 data off,
# the API had none, or the fetch failed).
id: cmd_req_wx_no_data
version: 1
category: ops
title: "Pilot command: REQ WX, no data"
description: "REQ WX command when there is no weather for the airport."
hint: "Answer to REQ WX: OPS has no weather for that airport. Check the ICAO code or ask again later. No reply needed."
enabled_by_default: true
trigger:
  on: command
  command: REQ_WX
conditions:
  - "cmd.metar == null"
steps:
  - send:
      header: WX {cmd.icao}
      body: |
        NO WX AVBL FOR {cmd.icao}
        CHECK ICAO CODE OR RETRY LATER
