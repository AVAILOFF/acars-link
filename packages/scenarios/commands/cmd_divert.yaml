# DIVERT <ICAO> in flight: acknowledge, ask for the reason, arrange what fits it.
# The core records the airport (flight.divert); arrival scenarios for the destination stop.
id: cmd_divert
version: 1
category: irregular
title: "Pilot command: DIVERT"
description: "DIVERT command: acknowledges the diversion."
hint: "OPS acknowledges your DIVERT and has told the handling at the diversion airport. It asks for the reason to arrange what is needed there."
enabled_by_default: true
trigger:
  on: command
  command: DIVERT
steps:
  - send:
      header: DIVERSION
      body: |
        {ofp.callsign} DIVERT {cmd.icao} RCVD
        OPS AND HANDLING ADVISED
        REPLY REASON
        WX TECH MEDICAL FUEL OTHER
  - wait:
      reply:
        id: reply
        options: [WX, TECH, MEDICAL, FUEL, OTHER]
        timeout_min: 10
        default: OTHER
        reply_hints:
          WX: "Weather at the destination."
          TECH: "A technical problem with the aircraft."
          MEDICAL: "A medical case on board."
          FUEL: "Not enough fuel to go on to the destination."
          OTHER: "Any other reason."
  - branch:
      MEDICAL:
        - send:
            id: medical
            body: |
              MEDICAL TEAM ORDERED AT {cmd.icao}
              ADVISE PAX DETAILS WHEN ABLE
            hint: "OPS has ordered a medical team at the diversion airport and asks for passenger details by free-text telex when you can."
      TECH:
        - send:
            id: tech
            body: |
              MAINT CONTROL ADVISED
              ENGINEER ORDERED AT {cmd.icao}
              SEND DEFECT DETAILS
            hint: "Maintenance control knows and an engineer will meet you at the diversion airport. Send a short description of the fault by free-text telex."
      FUEL:
        - send:
            id: fuel
            body: |
              REFUEL ORDERED AT {cmd.icao}
            hint: "OPS has ordered fuel for you at the diversion airport. No reply needed."
      WX:
        - send:
            id: wx
            body: |
              WX DIVERSION NOTED
              PAX REBOOKING IN PROGRESS
            hint: "OPS notes a weather diversion and is rebooking the passengers. No reply needed."
  - send:
      id: msg
      body: |
        STAND AT {cmd.icao} TBA
        SEND ETA WHEN ABLE
      hint: "The stand at the diversion airport is not known yet. Send your ETA there by free-text telex when you can."
