# REQ LOADSHEET before any loadsheet was sent.
id: cmd_req_loadsheet_none
version: 1
category: docs
title: "Pilot command: REQ LOADSHEET, none yet"
title_ru: "Команда пилота: REQ LOADSHEET, ещё нет"
description: "REQ LOADSHEET command before any loadsheet exists."
description_ru: "Команда REQ LOADSHEET, когда лоадшита ещё нет."
hint: "Answer to REQ LOADSHEET: no loadsheet has been issued for this flight yet; the message says when the preliminary one comes. No reply needed."
hint_ru: "Ответ на REQ LOADSHEET: ведомость для рейса ещё не выпущена; в сообщении сказано, когда придёт предварительная. Ответ не нужен."
enabled_by_default: true
trigger:
  on: command
  command: REQ_LOADSHEET
conditions:
  - "not ('final_loadsheet' in flight.sent or 'prelim_loadsheet' in flight.sent)"
steps:
  - send:
      header: LOADSHEET
      body: |
        {ofp.callsign} NO LOADSHEET ISSUED YET
        PRELIM AT STD-25 MIN
