# ETA in flight: by ground speed and the distance left (T44); without telemetry the planned
# en-route time after the actual take-off. The gate and the transfer passengers.
id: cmd_eta
version: 1
category: ops
title: "Pilot command: ETA"
description: "ETA command in flight, based on planned times."
hint: "Answer to ETA: the estimated arrival against the schedule (STA), your gate or stand and the transfer passengers OPS has told the connecting flights about. No reply needed."
enabled_by_default: true
trigger:
  on: command
  command: ETA
conditions:
  - "flight.eta != null"
  - "flight.dist_to_dest_nm == null or tm.gs_kt < 60 or flight.on != null"
steps:
  - send:
      header: ETA {ofp.dest}
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest}
        ETA {flight.eta_live|hhmm}Z STA {ofp.sched_in|hhmm}Z
        {ops.gate_place}
        ~TRANSFER PAX {ops.transfer_pax}
        CONNECTIONS ADVISED
