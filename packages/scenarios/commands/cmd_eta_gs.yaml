# ETA in flight with telemetry (T44): ground speed and the distance left to the destination.
id: cmd_eta_gs
version: 1
category: ops
title: "Pilot command: ETA, by ground speed"
title_ru: "Команда пилота: ETA по скорости"
description: "ETA command by ground speed and the distance left."
description_ru: "Команда ETA по путевой скорости и оставшемуся расстоянию."
hint: "Answer to ETA in flight: the arrival time from your ground speed and the distance to go, against the schedule (STA), with your gate or stand and the transfer passengers OPS has told the connecting flights about. No reply needed."
hint_ru: "Ответ на ETA в полёте: время прилёта по путевой скорости и оставшемуся расстоянию против расписания (STA), ваш гейт или стоянка и пассажиры на пересадку, о которых OPS предупредил стыковочные рейсы. Ответ не нужен."
enabled_by_default: true
trigger:
  on: command
  command: ETA
conditions:
  - "flight.eta != null"
  - "flight.dist_to_dest_nm != null"
  - "tm.gs_kt >= 60"
  - "flight.on == null"
steps:
  - send:
      header: ETA {ofp.dest}
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest}
        ETA {flight.eta_live|hhmm}Z STA {ofp.sched_in|hhmm}Z
        GS {tm.gs_kt} KT {flight.dist_to_dest_nm} NM TO GO
        {ops.gate_place}
        TRANSFER PAX {ops.transfer_pax}
        CONNECTIONS ADVISED
