# REQ ATIS without an ATIS station online (T44): NO ATIS AVBL and the METAR when there is one.
id: cmd_req_atis_none
version: 1
category: ops
title: "Pilot command: REQ ATIS, no ATIS"
description: "REQ ATIS when no ATIS is online: NO ATIS AVBL and the latest METAR."
hint: "Answer to REQ ATIS: no ATIS of that airport is online on VATSIM, so OPS sends the latest METAR instead. No reply needed."
enabled_by_default: true
trigger:
  on: command
  command: REQ_ATIS
conditions:
  - "cmd.atis == null"
steps:
  - send:
      header: "ATIS {cmd.icao}"
      body: |
        NO ATIS AVBL
        {cmd.metar|or:NO METAR AVBL}
