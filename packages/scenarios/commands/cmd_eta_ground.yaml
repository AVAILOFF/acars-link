# ETA before take-off: the estimates (moved by any delay).
id: cmd_eta_ground
version: 1
category: ops
title: "Pilot command: ETA, before takeoff"
title_ru: "Команда пилота: ETA до взлёта"
description: "ETA command before takeoff."
description_ru: "Команда ETA до взлёта."
hint: "Answer to ETA before departure: the estimated off-block (EOBT) and on-block (EST IN) times against the schedule (STA) and the transfer passengers. No reply needed."
hint_ru: "Ответ на ETA до вылета: расчётное время отхода от стоянки (EOBT) и постановки (EST IN) против расписания (STA) и пассажиры на пересадку. Ответ не нужен."
enabled_by_default: true
trigger:
  on: command
  command: ETA
conditions:
  - "flight.eta == null"
steps:
  - send:
      header: ETA {ofp.dest}
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest}
        EOBT {ofp.est_out|hhmm}Z
        EST IN {ofp.est_in|hhmm}Z STA {ofp.sched_in|hhmm}Z
        TRANSFER PAX {ops.transfer_pax}
