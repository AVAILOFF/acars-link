# NHL: regular-season and playoff games that went final during the flight (api-web.nhle.com).
# T29 (docs/07): our template (no real airline format for such news exists), signed OPS, the
# source as the last line. In cruise, not later than 30 min before TOD.
id: nhl_results
version: 1
category: external
title: NHL results
description: "NHL games that finished during the flight (regular season and playoffs)."
hint: "OPS information: final scores of NHL games that finished during your flight. No reply needed."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
conditions:
  - "ext.nhl_count != null"
  - "flight.minutes_to_tod == null || flight.minutes_to_tod > 30"
group: special_news
priority: 0
steps:
  - send:
      header: OPS INFO
      body: |
        NHL FINAL SCORES
        {ext.nhl_lines}
        SOURCE NHL.COM
      footer: OPS
