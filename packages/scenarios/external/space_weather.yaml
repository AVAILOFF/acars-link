# Space weather at NOAA scale R3+, S2+ (route above 60 deg latitude) or G3+ (now or forecast
# today/tomorrow). A safety advisory: outside the one-special-event-per-flight limit.
# T29 (docs/07): our template (no real airline format for such news exists), signed OPS, the
# source as the last line. In cruise, not later than 30 min before TOD.
id: space_weather
version: 1
category: external
title: Space weather advisory
description: "NOAA scale R3+, S2+ (route above 60 deg latitude) or G3+ (current or forecast within 24 h)."
hint: "OPS advisory: NOAA reports strong space weather (solar radio blackout, radiation storm or geomagnetic storm). It can disturb HF radio, SATCOM and GNSS; check them. No reply needed."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
conditions:
  - "ext.swx_alert == true"
  - "flight.minutes_to_tod == null || flight.minutes_to_tod > 30"
priority: 1
steps:
  - send:
      header: OPS ADVISORY
      body: |
        SPACE WEATHER ADVISORY
        {ext.swx_lines}
        CHECK HF/SATCOM AND GNSS
        SOURCE NOAA SWPC
      footer: OPS
