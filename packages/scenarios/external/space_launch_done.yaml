# A space launch that happened since take-off (TheSpaceDevs Launch Library: in flight,
# successful, payload deployed, failure, partial failure) near the route ahead (T28). The pad
# is within 300 NM of the route. Our template, as `space_launch` (approved 2026-10-09,
# docs/07 T28). One launch message per flight.
id: space_launch_done
version: 1
category: external
title: Space launch near the route (launched)
title_ru: Пуск ракеты рядом с маршрутом (состоялся)
description: "A launch after takeoff (TheSpaceDevs) within 300 NM of the route ahead."
description_ru: Пуск, состоявшийся после взлёта (TheSpaceDevs), в пределах 300 NM от маршрута впереди.
hint: "OPS advisory: a rocket was launched near your route after your take-off, with its time and status. Areas closed for falling debris may be active; check the NOTAMs. No reply needed."
hint_ru: "Предупреждение OPS: после вашего взлёта рядом с маршрутом состоялся пуск ракеты — время и результат. Могут действовать зоны, закрытые из-за падающих обломков; проверьте NOTAM. Ответ не нужен."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
conditions:
  - "ext.launch_id != null"
  - "ext.launch_done"
  - "flight.minutes_to_tod == null || flight.minutes_to_tod > 15"
excludes: [space_launch]
priority: 0
steps:
  # After a failure the FAA may activate a Debris Response Area (faa.gov, checked 2026-10-15):
  # the line is added for FAILURE and PARTIAL FAILURE only; whether an area exists is not
  # known (no data), so the text says "may" and sends the crew to the NOTAMs. The pad's country
  # is not known to the scenario: the same wording for every pad (approved 2026-10-15).
  - wait: { until: "ext.launch_status in ['FAILURE','PARTIAL FAILURE']", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: OPS ADVISORY
            body: |
              SPACE LAUNCH NEAR ROUTE
              {ext.launch_rocket} / {ext.launch_mission|or:UNKNOWN PAYLOAD}
              {ext.launch_pad}
              LAUNCHED {ext.launch_net|hhmm}Z {ext.launch_status}
              {ext.launch_ahead_nm} NM AHEAD / {ext.launch_off_nm} NM FROM ROUTE
              DEBRIS RESPONSE AREA MAY BE ACTIVE
              CHECK NOTAM
            footer: SOURCE THESPACEDEVS
      TIMEOUT:
        - send:
            header: OPS ADVISORY
            body: |
              SPACE LAUNCH NEAR ROUTE
              {ext.launch_rocket} / {ext.launch_mission|or:UNKNOWN PAYLOAD}
              {ext.launch_pad}
              LAUNCHED {ext.launch_net|hhmm}Z {ext.launch_status}
              {ext.launch_ahead_nm} NM AHEAD / {ext.launch_off_nm} NM FROM ROUTE
              EXPECT AIRSPACE RESTRICTIONS CHECK NOTAM
            footer: SOURCE THESPACEDEVS
