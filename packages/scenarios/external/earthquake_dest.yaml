# Earthquake M5.0+ within 100 km of the destination in the last 24 h (USGS). Independent of
# natural_event: both may come.
# T29 (docs/07): our template (no real airline format for such news exists), signed OPS, the
# source as the last line. In cruise, not later than 30 min before TOD.
id: earthquake_dest
version: 1
category: external
title: Earthquake near the destination
title_ru: Землетрясение у аэропорта назначения
description: "An M5.0+ earthquake within 100 km of the destination in the last 24 h (USGS)."
description_ru: "Землетрясение M ≥ 5,0 в пределах 100 км от аэропорта назначения за последние сутки (USGS)."
hint: "OPS information: a recent earthquake near the destination, with magnitude, place, distance from the airport and depth (USGS). Check the NOTAMs for the airport status. No reply needed."
hint_ru: "Информация OPS: недавнее землетрясение рядом с аэропортом назначения — магнитуда, место, расстояние от аэропорта и глубина (USGS). Проверьте в NOTAM состояние аэропорта. Ответ не нужен."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
conditions:
  - "ext.quake_mag != null"
  - "flight.minutes_to_tod == null || flight.minutes_to_tod > 30"
group: special_news
priority: 0
steps:
  - send:
      header: OPS INFO
      body: |
        EARTHQUAKE NEAR {ofp.dest}
        M{ext.quake_mag} AT {ext.quake_time|hhmm}Z {ext.quake_time|ddmmm}
        {ext.quake_place}
        {ext.quake_dist_km} KM FROM AIRPORT DEPTH {ext.quake_depth_km} KM
        CHECK NOTAM FOR AIRPORT STATUS
        SOURCE USGS
      footer: OPS
