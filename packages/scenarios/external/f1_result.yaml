# Formula 1: a Grand Prix that finished between take-off and now (Jolpica, CC BY-NC-SA 4.0).
# T29 (docs/07): our template (no real airline format for such news exists), signed OPS, the
# source as the last line. In cruise, not later than 30 min before TOD.
id: f1_result
version: 1
category: external
title: Formula 1 result
title_ru: Результат Формулы-1
description: "A Grand Prix that finished during the flight: the podium (Jolpica)."
description_ru: "Гран-при, завершившийся во время полёта: тройка призёров (Jolpica)."
hint: "OPS information: the result of a Formula 1 Grand Prix that finished during your flight. No reply needed."
hint_ru: "Информация OPS: результат Гран-при «Формулы-1», завершившегося во время рейса. Ответ не нужен."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
conditions:
  - "ext.f1_race != null"
  - "flight.minutes_to_tod == null || flight.minutes_to_tod > 30"
group: special_news
priority: 0
steps:
  - send:
      header: OPS INFO
      body: |
        F1 {ext.f1_race} RESULT
        {ext.f1_podium}
        FINISHED {ext.f1_finish|hhmm}Z
        SOURCE JOLPICA F1 API
      footer: OPS
