# No VATSIM ATC at the destination: uncontrolled, use UNICOM (VATSIM 122.800).
id: vatsim_atc_none
version: 1
category: external
title: No VATSIM ATC at destination
description: "No VATSIM ATC online at the destination before TOD."
hint: "No VATSIM controller is online at the destination now: use UNICOM 122.800 and announce your positions yourself. Check again before the approach. No reply needed."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: tod, lte_nm: 80 }
conditions:
  - "flight.divert == null"
  - "phase in ['CLIMB','CRUISE']"
  - "ext.dest_atc_count == 0"
priority: 0
steps:
  - send:
      header: VATSIM ATC {ofp.dest}
      body: |
        NO ATC ONLINE AT {ofp.dest}
        USE UNICOM 122.800
        CHECK AGAIN BEFORE APPROACH
