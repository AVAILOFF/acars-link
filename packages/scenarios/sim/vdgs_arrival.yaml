# Arrival text on the GSX docking display (T22): flight, origin and gate, shown by GSX at the
# destination only. Without GSX Pro nothing happens. Widths: narrow 6, wide 9, x 10 characters
# (FSDreamTeam VGDS developer manual, 2025-07-29); `x` falls back to `wide` lines below.
id: vdgs_arrival
version: 1
category: ops
title: Docking display (GSX)
title_ru: Табло стоянки (GSX)
description: Flight, origin and arrival gate on the GSX VDGS at the destination stand.
description_ru: Номер рейса, аэропорт вылета и гейт на табло VDGS от GSX на стоянке прилёта.
hint: "Not a message: your flight, origin and arrival gate on the GSX docking display at the stand."
hint_ru: "Не сообщение: ваш рейс, аэропорт вылета и гейт на табло стыковки GSX (VDGS) на стоянке."
enabled_by_default: true
trigger:
  on: phase_enter
  phase: LANDED
conditions:
  - "flight.divert == null"
  - "ops.gate_known"
  - "ofp.airline != null"
steps:
  - vdgs:
      narrow: ["{ofp.airline}", "{ofp.flight}", "FROM", "{ofp.orig}", "GATE", "{ops.arr_gate}"]
      wide: ["{ofp.airline} {ofp.flight}", "FROM {ofp.orig}", "GATE {ops.arr_gate}"]
      x: ["{ofp.airline} {ofp.flight}", "FROM {ofp.orig}", "GATE {ops.arr_gate}"]
