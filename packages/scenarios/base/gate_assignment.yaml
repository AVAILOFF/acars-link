# Expected arrival gate, only a real one from the OSM stands (T43; nothing is invented). The
# same gate appears in arrival_info.
id: gate_assignment
version: 1
category: ops
title: Gate assignment
title_ru: "Назначение гейта"
description: "Departure gate assignment."
description_ru: "Назначение гейта вылета."
hint: "OPS tells you the gate or stand expected for you at the destination. Information only, no reply needed."
hint_ru: "OPS сообщает гейт или стоянку, которые ожидаются для вас в аэропорту назначения. Только для сведения, ответ не нужен."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: tod, lte_nm: 120 }
conditions:
  - "flight.divert == null"
  - "ops.gate_known"
  - "phase in ['CLIMB','CRUISE','DESCENT']"
priority: 1
steps:
  - send:
      header: GATE ASSIGNMENT
      body: |
        {ofp.callsign} ARR {ofp.dest}
        {ops.gate_expected}
        STA {ofp.sched_in|hhmm}Z
