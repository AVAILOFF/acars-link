# Expected arrival gate, only a real one from the OSM stands (T43; nothing is invented). The
# same gate appears in arrival_info.
id: gate_assignment
version: 1
category: ops
title: Gate assignment
description: "Departure gate assignment."
hint: "OPS gives your expected gate or stand at the destination. No reply needed."
enabled_by_default: true
# T92: airline handling; a business flight has flight support (bizav/), no gate, no VDGS.
operations: [sched_pax, charter_pax, cargo, ferry, medevac]
trigger:
  on: distance
  dist: { to: tod, lte_nm: 120 }
conditions:
  - "flight.divert == null"
  - "ops.gate_known"
  - "phase in ['CLIMB','CRUISE','DESCENT']"
priority: 1
steps:
  - send:
      header: GATE ASSIGNMENT
      body: |
        {ofp.callsign} ARR {ofp.dest}
        {ops.gate_expected}
        STA {ofp.sched_in|hhmm}Z
