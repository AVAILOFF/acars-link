# OOOI departure log: OUT and OFF times, ETA from the actual take-off. Off-block after STD: the
# MVT delay element with IATA delay codes (T43, core delay-codes.ts).
id: departure_report
version: 1
category: ops
title: Departure report (OUT/OFF)
title_ru: "Отчёт о вылете (OUT/OFF)"
description: "Off-block and take-off times with delay codes."
description_ru: "Время отхода от стоянки и взлёта с кодами задержки."
hint: "Departure report: actual off-block (OUT) and take-off (OFF) times and the estimated arrival (ETA) against the schedule (STA); after a delay also its IATA delay codes. No reply needed."
hint_ru: "Отчёт о вылете: фактическое время ухода со стоянки (OUT) и взлёта (OFF), расчётное время прилёта (ETA) против расписания (STA); при задержке — её коды IATA. Ответ не нужен."
enabled_by_default: true
trigger:
  on: event
  event: OOOI_OFF
steps:
  - wait: { minutes: 3 }
  # On time first: the message keeps its time (TIMEOUT comes a tick later).
  - wait: { until: "flight.delay_codes == null", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: DEPARTURE REPORT
            body: |
              {ofp.callsign} {ofp.orig}-{ofp.dest}
              OUT {flight.out|hhmm}Z
              OFF {flight.off|hhmm}Z
              ETA {flight.eta|hhmm}Z
              STA {ofp.sched_in|hhmm}Z
      TIMEOUT:
        - send:
            header: DEPARTURE REPORT
            body: |
              {ofp.callsign} {ofp.orig}-{ofp.dest}
              OUT {flight.out|hhmm}Z
              OFF {flight.off|hhmm}Z
              ETA {flight.eta|hhmm}Z
              STA {ofp.sched_in|hhmm}Z
              {flight.delay_codes}
