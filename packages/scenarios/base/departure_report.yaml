# OOOI departure log: OUT and OFF times, ETA from the actual take-off.
id: departure_report
version: 1
category: ops
title: Departure report (OUT/OFF)
enabled_by_default: true
trigger:
  on: event
  event: OOOI_OFF
steps:
  - wait: { minutes: 3 }
  - send:
      header: DEPARTURE REPORT
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest}
        OUT {flight.out|hhmm}Z
        OFF {flight.off|hhmm}Z
        ETA {flight.eta|hhmm}Z
        STA {ofp.sched_in|hhmm}Z
