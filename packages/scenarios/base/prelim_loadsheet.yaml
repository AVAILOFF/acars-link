# Preliminary loadsheet: planned (OFP) figures. The final one carries the LMC.
id: prelim_loadsheet
version: 1
category: docs
title: Preliminary loadsheet
description: "Preliminary loadsheet with the planned figures from the OFP."
hint: "Preliminary loadsheet: the planned weights and fuel from the flight plan (ZFW, TOF, TOW, TIF, LAW against the maximums), passengers and cargo. Use it to prepare the FMS; the final figures come in the final loadsheet. No reply needed."
enabled_by_default: true
# T90-T92: cargo and ferry flights have their own loadsheets (cargo/, ferry/), business aviation none.
operations: [sched_pax, charter_pax, medevac]
trigger:
  on: time
  at: { rel: sched_out, offset_min: -25 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
priority: 3
steps:
  - send:
      header: PRELIMINARY LOADSHEET
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest} {flight.date|ddmmm}
        A/C {ofp.ac_reg} {ofp.ac_icao}
        ZFW {ofp.zfw_kg|kg1} MAX {ofp.max_zfw_kg|kg1}
        TOF {ofp.fuel_takeoff_kg|kg1}
        TOW {ofp.tow_kg|kg1} MAX {ofp.max_tow_kg|kg1}
        TIF {ofp.fuel_burn_kg|kg1}
        LAW {ofp.ldw_kg|kg1} MAX {ofp.max_ldw_kg|kg1}
        PAX {ofp.pax} CGO {ofp.cargo_kg|kg1}
        ALL WEIGHTS IN TONNES
      footer: "PREPARED BY {name:ops}"
