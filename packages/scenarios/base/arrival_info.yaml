# Arrival info on the way down: gate confirmed, belt, transfer passengers.
id: arrival_info
version: 1
category: ops
title: Arrival info
title_ru: "Информация о прилёте"
description: "Gate, baggage belt, transfer passengers and ground support on the way down."
description_ru: "Гейт, лента багажа, трансферные пассажиры и наземное обслуживание на снижении."
hint: "Arrival information from OPS for the destination: the gate or stand, the baggage belt, how many passengers transfer to other flights and the ground handling planned. No reply needed."
hint_ru: "Информация о прилёте от OPS: гейт или стоянка, лента выдачи багажа, сколько пассажиров пересаживается на другие рейсы и какое наземное обслуживание запланировано. Ответ не нужен."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: dest, lte_nm: 60 }
conditions:
  - "flight.divert == null"
  - "phase in ['DESCENT','APPROACH']"
steps:
  - send:
      header: ARRIVAL INFO
      body: |
        {ofp.callsign} {ofp.dest}
        {ops.gate_line}
        BAGGAGE BELT {ops.belt}
        TRANSFER PAX {ops.transfer_pax}
        {ops.ground_support}
