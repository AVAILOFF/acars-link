# MVP base set (docs/02). Crew list for the flight before boarding.
id: crew_info
version: 1
category: docs
title: Crew information
title_ru: "Информация об экипаже"
description: "Crew names and cabin crew head count."
description_ru: "Имена экипажа и численность бортпроводников."
hint: "Crew list of the flight from crew control: captain (CPT), first officer (FO), senior cabin crew member (SCCM) and the number of cabin crew. No reply needed."
hint_ru: "Состав экипажа рейса от службы планирования экипажей: командир (CPT), второй пилот (FO), старший бортпроводник (SCCM) и число бортпроводников. Ответ не нужен."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -45 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
priority: 5
steps:
  - send:
      header: CREW INFO
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest} {flight.date|ddmmm}
        STD {ofp.sched_out|hhmm}Z STA {ofp.sched_in|hhmm}Z
        CPT {name:crew}
        FO {name:crew}
        SCCM {name:crew}
        CABIN CREW {ops.cabin_crew}
      footer: "CREW CONTROL {name:ops}"
