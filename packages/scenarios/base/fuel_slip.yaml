# Fuel slip after refuelling (T43): sent when the fuel on board is stable (unchanged within
# 100 kg for a minute after the refuelling), at the latest at STD-12. UPLIFT is the fuel now
# minus the first reading before any refuelling; DIFF is the fuel against the planned ramp.
id: fuel_slip
version: 1
category: docs
title: Fuel slip
description: "After refuelling: uplift and deviation from plan."
hint: "Fuel slip from the refuelling: ramp fuel planned, fuel on board, the uplift and the deviation from plan, with the fuel breakdown of the flight plan (taxi, trip, contingency, alternate, final reserve, extra). No reply needed."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -18 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "tm.fuel_kg != null"
priority: 2
steps:
  # T98: while GSX refuels (requested or in progress) the slip waits for the end of it, at most
  # 10 min (the game number approved for the final loadsheet, 2026-11-07), then as without GSX.
  - if: "ground.refuel_busy"
    steps:
      - wait: { until: "not ground.refuel_busy", timeout_min: 10 }
  - wait: { until: "flight.fuel_stable", timeout_min: 6 }
  - send:
      header: FUEL SLIP
      body: |
        {ofp.callsign} {ofp.ac_reg} {ofp.orig}
        PLAN RAMP {ofp.fuel_ramp_kg|w1}
        FOB {tm.fuel_kg|w1}
        UPLIFT {flight.fuel_uplift_kg|w1}
        DIFF {flight.fuel_diff_kg|w|sign} {units.mass}
        TAXI {ofp.fuel_taxi_kg|w1}
        TRIP {ofp.fuel_burn_kg|w1}
        CONT {ofp.fuel_cont_kg|w1}
        ALTN {ofp.fuel_altn_kg|w1}
        FINRES {ofp.fuel_reserve_kg|w1}
        EXTRA {ofp.fuel_extra_kg|w1}
        FUEL IN {units.mass_big}
      footer: "FUELLER {name:ops}"
