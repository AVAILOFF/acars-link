# Aircraft change for the next leg (only when next_leg did not come: see its excludes).
id: aircraft_change
version: 1
category: ops
title: Aircraft change
description: "Aircraft change for the next leg."
hint: "Operations control (OPS) says the next sector will be flown on another aircraft: this one goes to maintenance after arrival and the crew changes aircraft. No reply needed."
enabled_by_default: true
# T91/T92: the next leg may be made up (T53): not on ferry (ferry/ferry_positioning) and business flights.
operations: [sched_pax, charter_pax, cargo, medevac]
trigger:
  on: time
  at: { rel: off, offset_min: 55 }
conditions:
  - "phase in ['CLIMB','CRUISE']"
probability: 0.2
steps:
  - send:
      header: A/C CHANGE
      body: |
        NEXT SECTOR {ops.next_flight}
        {ops.next_orig}-{ops.next_dest}
        STD {ops.next_std|hhmm}Z
        {ofp.ac_reg} TO MAINT AFTER ARR
        CREW CHANGES A/C
        NEW REG ADVISED ON BLOCK
        {ops.next_src}
