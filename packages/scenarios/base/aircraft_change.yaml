# Aircraft change for the next leg (only when next_leg did not come: see its excludes).
id: aircraft_change
version: 1
category: ops
title: Aircraft change
title_ru: "Смена самолёта"
description: "Aircraft change for the next leg."
description_ru: "Смена воздушного судна на следующий рейс."
hint: "Operations control (OPS) tells you that the next sector will be flown with another aircraft: this one goes to maintenance after arrival and the crew changes aircraft. Information only, no reply needed."
hint_ru: "Центр управления полётами (OPS) сообщает, что следующий рейс выполняется на другом самолёте: этот после прилёта уходит в техобслуживание, экипаж пересаживается. Только для сведения, ответ не нужен."
enabled_by_default: true
trigger:
  on: time
  at: { rel: off, offset_min: 55 }
conditions:
  - "phase in ['CLIMB','CRUISE']"
probability: 0.2
steps:
  - send:
      header: A/C CHANGE
      body: |
        NEXT SECTOR {ops.next_flight}
        {ops.next_orig}-{ops.next_dest}
        STD {ops.next_std|hhmm}Z
        {ofp.ac_reg} TO MAINT AFTER ARR
        CREW CHANGES A/C
        NEW REG ADVISED ON BLOCK
        {ops.next_src}
