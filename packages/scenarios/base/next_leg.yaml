# Next leg with the same aircraft (T53: from the hub after a flight into it, else back).
# Mutually exclusive with aircraft_change.
id: next_leg
version: 1
category: ops
title: Next leg
title_ru: "Следующий рейс"
description: "Next leg with the same aircraft."
description_ru: "Следующий рейс на том же самолёте."
enabled_by_default: true
trigger:
  on: time
  at: { rel: off, offset_min: 40 }
conditions:
  - "phase in ['CLIMB','CRUISE']"
probability: 0.7
excludes: [aircraft_change]
steps:
  - send:
      header: NEXT LEG
      body: |
        NEXT SECTOR {ops.next_flight}
        {ops.next_orig}-{ops.next_dest}
        STD {ops.next_std|hhmm}Z
        SAME A/C {ofp.ac_reg}
        TURNAROUND {ops.turnaround_min} MIN
