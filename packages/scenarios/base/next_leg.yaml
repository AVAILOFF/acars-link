# Next leg with the same aircraft (T53: from the hub after a flight into it, else back;
# T55: a real departure or route of the airline from AeroDataBox, with its attribution line).
# Mutually exclusive with aircraft_change.
id: next_leg
version: 1
category: ops
title: Next leg
description: "Next leg with the same aircraft."
hint: "OPS gives your next sector with the same aircraft: flight, route, STD and the turnaround time. No reply needed."
enabled_by_default: true
# T91/T92: the next leg may be made up (T53): not on ferry (ferry/ferry_positioning) and business flights.
operations: [sched_pax, charter_pax, cargo, medevac]
trigger:
  on: time
  at: { rel: off, offset_min: 40 }
conditions:
  - "phase in ['CLIMB','CRUISE']"
probability: 0.7
excludes: [aircraft_change]
steps:
  - send:
      header: NEXT LEG
      body: |
        NEXT SECTOR {ops.next_flight}
        {ops.next_orig}-{ops.next_dest}
        STD {ops.next_std|hhmm}Z
        SAME A/C {ofp.ac_reg}
        TURNAROUND {ops.turnaround_min} MIN
        {ops.next_src}
