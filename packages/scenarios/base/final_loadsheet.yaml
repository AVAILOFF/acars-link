# Final loadsheet with the last-minute change (LMC) against the preliminary one.
id: final_loadsheet
version: 1
category: docs
title: Final loadsheet
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -7 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING','PUSHBACK','TAXI_OUT']"
priority: 3
steps:
  - send:
      header: FINAL LOADSHEET
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest} {flight.date|ddmmm}
        A/C {ofp.ac_reg} {ofp.ac_icao}
        ZFW {load.zfw_kg|kg1} MAX {ofp.max_zfw_kg|kg1}
        TOF {ofp.fuel_takeoff_kg|kg1}
        TOW {load.tow_kg|kg1} MAX {ofp.max_tow_kg|kg1}
        TIF {ofp.fuel_burn_kg|kg1}
        LAW {load.ldw_kg|kg1} MAX {ofp.max_ldw_kg|kg1}
        UNDERLOAD {load.underload_kg|kg1}
        PAX {load.pax} CGO {load.cargo_kg|kg1}
        LMC PAX {load.pax_lmc|sign} CGO {load.cargo_lmc_kg|sign} KG
        ALL WEIGHTS IN TONNES
      footer: "PREPARED BY {name:ops}"
