# Welcome at the destination and the turnaround plan. After a late arrival the turn is
# shortened to the time left before the next STD (T43); past the STD the new time is open.
id: welcome_turnaround
version: 1
category: ops
title: Welcome and turnaround
description: "Welcome message with the turnaround plan."
hint: "Welcome from the destination station with the turnaround plan: turn time, next flight and STD, cleaning and catering en route. No reply needed."
enabled_by_default: true
# T91/T92: the next leg may be made up (T53): not on ferry (ferry/ferry_positioning) and business flights.
operations: [sched_pax, charter_pax, cargo, medevac]
trigger:
  on: event
  event: OOOI_IN
conditions:
  - "flight.divert == null"
steps:
  - wait: { minutes: 2 }
  - wait: { until: "ops.quick_turn", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: "WELCOME TO {ofp.dest}"
            body: |
              QUICK TURN, TARGET {ops.turn_avail_min} MIN
              NEXT {ops.next_flight}
              STD {ops.next_std|hhmm}Z
              CLEANING AND CATERING
              ON THE WAY
              {ops.next_src}
            footer: "STATION OPS {name:ops}"
      TIMEOUT:
        - wait: { until: "ops.turn_avail_min <= 0", timeout_min: 0.02 }
        - branch:
            MET:
              - send:
                  header: "WELCOME TO {ofp.dest}"
                  body: |
                    NEXT {ops.next_flight}
                    STD {ops.next_std|hhmm}Z PASSED
                    NEW TIME WILL BE ADVISED
                    CLEANING AND CATERING
                    ON THE WAY
                    {ops.next_src}
                  footer: "STATION OPS {name:ops}"
            TIMEOUT:
              - send:
                  header: "WELCOME TO {ofp.dest}"
                  body: |
                    TURNAROUND {ops.turnaround_min} MIN
                    NEXT {ops.next_flight}
                    STD {ops.next_std|hhmm}Z
                    CLEANING AND CATERING
                    ON THE WAY
                    {ops.next_src}
                  footer: "STATION OPS {name:ops}"
