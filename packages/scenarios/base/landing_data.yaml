# Arrival / landing data before TOD. Flaps and VREF only from SimBrief TLR for the planned
# runway (T43); without TLR the message has none.
id: landing_data
version: 1
category: docs
title: Landing data
title_ru: "Данные для посадки"
description: "Landing data from the OFP: runway, weather, flaps and VREF when the OFP has them."
description_ru: "Данные посадки из OFP: ВПП, погода, закрылки и VREF, если они есть в OFP."
hint: "Landing data from the flight plan: runway and STAR, airport elevation, transition level, landing weight against the limit, landing fuel and fuel to the alternate; flaps and VREF when the flight plan has them. For the approach briefing, no reply needed."
hint_ru: "Данные на посадку из плана полёта: ВПП и STAR, превышение аэродрома, эшелон перехода, посадочная масса против ограничения, топливо на посадке и до запасного; закрылки и VREF, если они есть в плане. Для брифинга на заход, ответ не нужен."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: tod, lte_nm: 150 }
conditions:
  - "flight.divert == null"
  - "phase in ['CLIMB','CRUISE']"
priority: 2
steps:
  # Without TLR first: the message keeps its trigger time (TIMEOUT comes a tick later).
  - wait: { until: "ofp.vref == null", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: LANDING DATA
            body: |
              {ofp.callsign} {ofp.dest} RWY {ofp.dest_rwy}
              STAR {ofp.star}
              ELEV {ofp.dest_elev_ft} FT
              TRANS LVL {ofp.dest_trans_level_ft} FT
              LAW {load.ldw_kg|kg1} MAX {ofp.max_ldw_kg|kg1}
              LDG FUEL {ofp.fuel_landing_kg|kg1}
              ALTN {ofp.altn} FUEL {ofp.fuel_altn_kg|kg1}
      TIMEOUT:
        - send:
            header: LANDING DATA
            body: |
              {ofp.callsign} {ofp.dest} RWY {ofp.dest_rwy}
              STAR {ofp.star}
              ELEV {ofp.dest_elev_ft} FT
              TRANS LVL {ofp.dest_trans_level_ft} FT
              LAW {load.ldw_kg|kg1} MAX {ofp.max_ldw_kg|kg1}
              FLAPS {ofp.ldg_flaps} VREF {ofp.vref}
              LDG FUEL {ofp.fuel_landing_kg|kg1}
              ALTN {ofp.altn} FUEL {ofp.fuel_altn_kg|kg1}
