# OOOI arrival log: all four times, block and flight time, fuel on block. Off-block after STD:
# the delay element with IATA delay codes, as in the departure report (T43).
id: block_report
version: 1
category: ops
title: Block times (OOOI)
description: "Block times and delay codes after on-block."
hint: "Block report after parking: OUT, OFF, ON and IN times (off-block, takeoff, landing, on-block), block and flight time and fuel on board; after a delay also the IATA delay codes of its causes. For the airline records; no reply needed."
enabled_by_default: true
trigger:
  on: event
  event: OOOI_IN
priority: 2
steps:
  # On time first: the message keeps its time (TIMEOUT comes a tick later).
  - wait: { until: "flight.delay_codes == null", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: BLOCK TIMES
            body: |
              {ofp.callsign} {ofp.orig}-{ofp.dest}
              OUT {flight.out|hhmm} OFF {flight.off|hhmm}
              ON {flight.on|hhmm} IN {flight.in|hhmm}
              BLOCK {flight.block_min} MIN
              FLIGHT {flight.air_min} MIN
              FOB {tm.fuel_kg|kg1}
      TIMEOUT:
        - send:
            header: BLOCK TIMES
            body: |
              {ofp.callsign} {ofp.orig}-{ofp.dest}
              OUT {flight.out|hhmm} OFF {flight.off|hhmm}
              ON {flight.on|hhmm} IN {flight.in|hhmm}
              BLOCK {flight.block_min} MIN
              FLIGHT {flight.air_min} MIN
              FOB {tm.fuel_kg|kg1}
              {flight.delay_codes}
