# The slot was missed (T44/T43 item 2): airborne later than CTOT + 10 min. The tolerance window
# (-5/+10 min around the CTOT) is the Network Manager rule (EUROCONTROL ATFCM; AIP Ireland
# ENR 1.9, checked 2026-10-14). No new CTOT is invented: the departure has already happened.
id: slot_missed
version: 1
category: ops
title: Slot missed
description: "Takeoff later than CTOT + 10 min (slot tolerance -5/+10 min): the slot is reported as missed."
hint: "You took off outside the slot window around the CTOT (-5/+10 min), so the airline reports a missed slot to flow management (ATFM). No reply needed."
enabled_by_default: true
trigger:
  on: event
  event: OOOI_OFF
conditions:
  - "'slot_ctot' in flight.sent"
  - "ops.slot_missed"
steps:
  - send:
      header: SLOT MISSED
      body: |
        {ofp.callsign} {ofp.orig}
        CTOT {ops.ctot|hhmm}Z TOL -5/+10
        OFF {flight.off|hhmm}Z
        DEPARTED OUTSIDE SLOT
        ATFM REPORT FILED
