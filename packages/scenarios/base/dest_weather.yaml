# Destination and alternate weather before TOD from the METAR SimBrief put into the OFP, and
# the message says so. With live weather (T13) `external/dest_weather_live` goes instead.
id: dest_weather
version: 1
category: ops
title: Destination weather before TOD
title_ru: "Погода назначения до TOD"
description: "Destination and alternate weather from the OFP METAR before TOD."
description_ru: "Погода назначения и запасного по METAR из OFP перед TOD."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: tod, lte_nm: 200 }
conditions:
  - "flight.divert == null"
  - "phase in ['CLIMB','CRUISE']"
  - "!wx.dest_live"
priority: 3
steps:
  - send:
      header: DEST WX
      body: |
        {ofp.dest_metar}
        ALTN {ofp.altn}
        {ofp.altn_metar}
      footer: WX AS OF OFP RELEASE
