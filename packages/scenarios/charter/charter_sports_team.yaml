# Sports team charter (T91): oversize sports equipment in the hold and catering ordered by the
# charterer; an assumption approved by the user 2026-11-04. One charter story per flight.
# T107: only on a sports charter; every time when the user chose that type by hand.
id: charter_sports_team
version: 1
category: ops
title: Sports team (charter)
description: "Before departure of a charter: a sports team on board with oversize sports equipment in the hold and special catering ordered by the charterer."
hint: "Charter handling: a sports team flies with you. Their oversize equipment is loaded in the hold given and the charterer ordered its own catering. No reply needed."
enabled_by_default: true
operations: [charter_pax]
charter: [sports]
charter_probability: 1
group: charter_story
trigger:
  on: time
  at: { rel: sched_out, offset_min: -45 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
probability: 0.3
steps:
  - send:
      header: CHARTER MSG
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest}
        SPORTS TEAM ON BOARD
        OVERSIZE SPORTS EQUIPMENT
        {rand:12-40} PCS IN {hold}
        SPECIAL CATERING UPLIFTED
        AS ORDERED BY CHARTERER
      footer: "CHARTER HANDLING {name:ops}"
