# The next flight from the airport of an earlier diversion (T44, flags.recovery_*): the
# aircraft is recovered, crew duty and a new plan are checked before departure.
id: recovery_followup
version: 1
category: irregular
title: Recovery after a diversion
description: "Before the flight from an earlier diversion airport: the aircraft was diverted from the earlier flight, crew duty and the new flight plan are checked."
hint: "OPS before the recovery flight from the airport of an earlier diversion: crew duty time is checked, a new flight plan and fuel are ordered; expect late passengers and bags. No reply needed."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -40 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "flags.recovery_airport == ofp.orig"
steps:
  - send:
      header: OPS MSG RECOVERY
      body: |
        {ofp.callsign} {ofp.orig}-{ofp.dest}
        AFTER DIVERSION OF {flags.recovery_flight}
        CREW DUTY TIME CHECKED
        NEW FLIGHT PLAN AND FUEL ORDERED
        ~EXPECT LATE PAX AND BAGS{flight.if_pax}
  - set: { flags.recovery_airport: null, flags.recovery_flight: null, flags.recovery_date: null }
