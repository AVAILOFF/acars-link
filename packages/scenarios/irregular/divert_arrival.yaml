# On block at the diversion airport (T44): handling, fuel and passengers; the airline remembers
# the diversion (flags.recovery_*) for the next flight from that airport (recovery_followup).
id: divert_arrival
version: 1
category: irregular
title: Arrival at the diversion airport
description: "On block after a diversion: handling, fuel and passengers are arranged, a request for the new plan. Leaves a note for the next flight from that airport."
hint: "OPS after your diversion: handling and fuel are ordered, passengers are looked after and the destination passengers rebooked. OPS asks for your fuel request and the new departure time (ETD) by free-text telex."
enabled_by_default: true
trigger:
  on: phase_enter
  phase: ON_BLOCK
conditions:
  - "flight.divert != null"
steps:
  - set: { flags.recovery_airport: "{flight.divert}", flags.recovery_flight: "{ofp.callsign}", flags.recovery_date: "{ofp.sched_out}" }
  - send:
      header: DIVERSION {flight.divert}
      body: |
        {ofp.callsign} ON BLOCK {flight.divert}
        HANDLING AND FUEL ORDERED
        PAX CARE ARRANGED
        {ofp.dest} PAX REBOOKING IN PROGRESS
        SEND FUEL REQUEST AND NEW ETD
