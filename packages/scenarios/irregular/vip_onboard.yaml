# VIP passenger: notice at boarding, protocol on arrival.
id: vip_onboard
version: 1
category: irregular
title: VIP on board
title_ru: "VIP на борту"
description: "Before departure: a VIP and the seat; on block: disembarks first, protocol car at the gate."
description_ru: "Перед вылетом: VIP и его место; на стоянке после прилёта — выходит первым, протокольная машина у гейта."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -35 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
probability: 0.04
steps:
  - set: { flags.vip_seat: "{seat:1-2}" }
  - send:
      header: OPS MSG
      body: |
        VIP ON BOARD SEAT {flags.vip_seat}
        {pick:[GOVERNMENT DELEGATION,COMPANY CEO,STATE GUEST]}
        BOARDS LAST, DISEMBARKS FIRST
        NO ANNOUNCEMENT ON BOARD
  - wait: { phase: ON_BLOCK }
  - send:
      header: OPS MSG
      body: |
        VIP SEAT {flags.vip_seat} DISEMBARKS FIRST
        PROTOCOL CAR AT {ops.gate_place}
        HOLD OTHER PAX 3 MIN
  - set: { flags.vip_seat: null }
