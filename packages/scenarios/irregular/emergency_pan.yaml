# PAN PAN sent to the ROPS station (DM55, T47): ROGER PAN at once, then the airline's desk.
# Starts by hand only (the core forces it after the PAN); CONTINUE is the default after 5 min,
# the destination is told to stand by.
id: emergency_pan
version: 1
category: irregular
title: PAN PAN declared
title_ru: "Объявлен PAN PAN"
description: "The crew declared PAN PAN to ATC through the ROPS station. The airline desk offers DIVERT or CONTINUE (default CONTINUE after 5 min) and puts rescue and medical services at the destination on standby. Starts only after a PAN PAN to ROPS."
description_ru: "Экипаж объявил PAN PAN станции ROPS. Центр авиакомпании предлагает DIVERT или CONTINUE (через 5 мин — CONTINUE), аэропорт назначения предупреждён: пожарные и медики в готовности. Запускается только после PAN PAN на станцию ROPS."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
probability: 0
steps:
  - send:
      header: OPS MSG EMERGENCY
      body: |
        PAN PAN RCVD VIA ATC
        EMERGENCY DESK ACTIVATED
        {ofp.dest} ADVISED, RESCUE AND MEDICAL STANDBY
        NEAREST SUITABLE {flight.nearest_altn|or:AIRPORT} {flight.nearest_altn_nm} NM
        REPLY DIVERT OR CONTINUE
  - wait:
      reply: { options: [DIVERT, CONTINUE], timeout_min: 5, default: CONTINUE }
  - branch:
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:flight.nearest_altn}" }
        - send:
            header: OPS MSG EMERGENCY
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              ROGER DIVERT {flight.divert|or:NEAREST SUITABLE}
              ~{flight.divert_nm} NM FROM PRESENT POS
              RESCUE AND HANDLING ORDERED
              SEND NEW ETA WHEN ABLE
      CONTINUE:
        - send:
            header: OPS MSG EMERGENCY
            body: |
              ROGER CONTINUE TO {ofp.dest}
              ADVISE IF SITUATION CHANGES
