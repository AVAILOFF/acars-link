# Medical case in cruise: the crew decides CONTINUE or DIVERT (default CONTINUE after 10 min).
# DIVERT sets the flight's diversion to the nearest of the origin and the alternates, so the
# arrival messages for the destination stop (docs/02 irregular list).
id: medical_onboard
version: 1
category: irregular
title: Medical case on board
title_ru: "Медицинский случай на борту"
description: "In cruise the cabin reports a sick passenger. Reply CONTINUE or DIVERT (default CONTINUE after 10 min). DIVERT diverts to the nearest of the origin and the alternates."
description_ru: "В крейсере кабина сообщает о плохом самочувствии пассажира. Ответ CONTINUE или DIVERT (через 10 мин — CONTINUE). DIVERT — диверсия на ближайший из аэропорта вылета и запасных."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
  # A random moment of the cruise (T51): from 10 min in to 30 min before the top of descent.
  window: { after_min: 10, before_tod_min: 30 }
conditions:
  - "flight.minutes_to_tod != null"
  - "flight.minutes_to_tod >= 30"
  - "not ('cmd_medical' in flight.sent)"
probability: 0.03
excludes: [unruly_passenger]
steps:
  - set: { flags.med_doc: "{pick:[YES,NO]}" }
  - send:
      header: OPS MSG MEDICAL
      body: |
        CABIN REPORTS MEDICAL CASE
        SEAT {seat} PAX {rand:25-80}Y
        {pick:[CHEST PAIN,FAINTED,BREATHING DIFFICULTY,SEVERE ALLERGY]}
        DOCTOR ON BOARD {flags.med_doc}
  # "if": the condition is checked at once; false for a second of flight time = TIMEOUT.
  - wait: { until: "flags.med_doc == 'NO'", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: OPS MSG MEDICAL
            body: |
              NO DOCTOR ON BOARD
              MEDLINK STRONGLY ADVISES DIVERT NOW
              REPLY CONTINUE OR DIVERT
      TIMEOUT:
        - send:
            header: OPS MSG MEDICAL
            body: |
              MEDLINK ADVISES DIVERT IF NO IMPROVEMENT
              REPLY CONTINUE OR DIVERT
  - set: { flags.med_doc: null }
  - wait:
      reply: { options: [CONTINUE, DIVERT], timeout_min: 10, default: CONTINUE }
  - branch:
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:flight.nearest_altn}" }
        - send:
            header: OPS MSG MEDICAL
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              ROGER DIVERT {flight.divert|or:NEAREST SUITABLE}
              ~{flight.divert_nm} NM FROM PRESENT POS
              CREW INFO: {reply.arg|or:NO ADDL INFO}
              AMBULANCE AND HANDLING ORDERED
              SEND NEW ETA WHEN ABLE
        - wait: { phase: ON_BLOCK }
        - send:
            header: OPS MSG MEDICAL
            body: |
              PARAMEDICS AT AIRCRAFT DOOR
              PATIENT DEPLANES FIRST
      CONTINUE:
        - send:
            header: OPS MSG MEDICAL
            body: |
              MEDICAL UPDATE NOTED
              CONTINUE TO {ofp.dest}
              CREW INFO: {reply.arg|or:NO ADDL INFO}
              PLEASE REQUEST PRIORITY WITH ATC
        - wait: { phase: ON_BLOCK }
        - send:
            header: OPS MSG MEDICAL
            body: |
              PARAMEDICS AT AIRCRAFT DOOR
              {ops.gate_place}
              PATIENT DEPLANES FIRST
