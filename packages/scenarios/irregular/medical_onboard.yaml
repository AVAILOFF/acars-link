# Medical case in cruise: the crew decides CONTINUE or DIVERT (default CONTINUE after 10 min).
# DIVERT sets the flight's diversion to the nearest of the origin and the alternates, so the
# arrival messages for the destination stop (docs/02 irregular list).
id: medical_onboard
version: 1
category: irregular
title: Medical case on board
title_ru: "Медицинский случай на борту"
description: "In cruise the cabin crew report a sick passenger. Reply CONTINUE or DIVERT (default CONTINUE after 10 min). DIVERT diverts to the nearest of the origin and the alternates."
description_ru: "В крейсере бортпроводники сообщают о плохом самочувствии пассажира. Ответ CONTINUE или DIVERT (через 10 мин — CONTINUE). DIVERT — диверсия на ближайший из аэропорта вылета и запасных."
hint: "OPS: the cabin crew report a medical case on board, with the seat, the passenger's age, the symptoms and whether a doctor is on board. MedLink, the ground doctors who advise crews, give their advice next."
hint_ru: "OPS: бортпроводники сообщают о медицинском случае на борту — место, возраст пассажира, симптомы и есть ли на борту врач. Следом придёт совет MedLink — наземных врачей, которые консультируют экипажи."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
  # A random moment of the cruise (T51): from 10 min in to 30 min before the top of descent.
  window: { after_min: 10, before_tod_min: 30 }
conditions:
  - "flight.minutes_to_tod != null"
  - "flight.minutes_to_tod >= 30"
  - "not ('cmd_medical' in flight.sent)"
probability: 0.03
excludes: [unruly_passenger]
steps:
  - set: { flags.med_doc: "{pick:[YES,NO]}" }
  - send:
      header: OPS MSG MEDICAL
      body: |
        CABIN REPORTS MEDICAL CASE
        SEAT {seat} PAX {rand:25-80}Y
        {pick:[CHEST PAIN,FAINTED,BREATHING DIFFICULTY,SEVERE ALLERGY]}
        DOCTOR ON BOARD {flags.med_doc}
  # "if": the condition is checked at once; false for a second of flight time = TIMEOUT.
  - wait: { until: "flags.med_doc == 'NO'", timeout_min: 0.02 }
  - branch:
      MET:
        - send:
            header: OPS MSG MEDICAL
            body: |
              NO DOCTOR ON BOARD
              MEDLINK STRONGLY ADVISES DIVERT NOW
              REPLY CONTINUE OR DIVERT
            hint: "There is no doctor on board and MedLink strongly advises diverting now. Tell OPS whether you continue or divert."
            hint_ru: "Врача на борту нет, MedLink настоятельно советует уходить на запасной сейчас. Сообщите OPS, продолжаете ли вы полёт или уходите."
      TIMEOUT:
        - send:
            header: OPS MSG MEDICAL
            body: |
              MEDLINK ADVISES DIVERT IF NO IMPROVEMENT
              REPLY CONTINUE OR DIVERT
            hint: "MedLink advises diverting if the passenger does not get better. Tell OPS whether you continue or divert."
            hint_ru: "MedLink советует уходить на запасной, если пассажиру не станет лучше. Сообщите OPS, продолжаете ли вы полёт или уходите."
  - set: { flags.med_doc: null }
  - wait:
      reply:
        options: [CONTINUE, DIVERT]
        timeout_min: 10
        default: CONTINUE
        reply_hints:
          CONTINUE: "Continue to the destination; you may add a short note after the word."
          DIVERT: "Divert; you may add the airport ICAO and a short note after the word (DIVERT EDDM PAX STABLE)."
        reply_hints_ru:
          CONTINUE: "Продолжать полёт до назначения; после слова можно добавить короткое пояснение."
          DIVERT: "Уйти на запасной; после слова можно указать ICAO аэропорта и короткое пояснение (DIVERT EDDM PAX STABLE)."
  - branch:
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:flight.nearest_altn}" }
        - send:
            header: OPS MSG MEDICAL
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              ROGER DIVERT {flight.divert|or:NEAREST SUITABLE}
              ~{flight.divert_nm} NM FROM PRESENT POS
              CREW INFO: {reply.arg|or:NO ADDL INFO}
              AMBULANCE AND HANDLING ORDERED
              SEND NEW ETA WHEN ABLE
            hint: "OPS confirms the diversion airport and its distance and has ordered an ambulance and handling there. Send your new ETA as a free-text telex when you can."
            hint_ru: "OPS подтверждает аэропорт диверсии и расстояние до него, заказал туда скорую и хендлинг. Сообщите новое ETA telex свободным текстом, когда сможете."
        - rescue: { level: medical }
        - wait: { phase: ON_BLOCK }
        - send:
            header: OPS MSG MEDICAL
            body: |
              PARAMEDICS AT AIRCRAFT DOOR
              PATIENT DEPLANES FIRST
            hint: "Paramedics are waiting at the aircraft door; the patient leaves the aircraft before the other passengers. No reply needed."
            hint_ru: "Медики ждут у двери самолёта; пациент выходит раньше остальных пассажиров. Ответ не нужен."
      CONTINUE:
        - send:
            header: OPS MSG MEDICAL
            body: |
              MEDICAL UPDATE NOTED
              CONTINUE TO {ofp.dest}
              CREW INFO: {reply.arg|or:NO ADDL INFO}
              PLEASE REQUEST PRIORITY WITH ATC
            hint: "OPS notes that you continue to the destination and asks you to request priority from ATC. No reply needed."
            hint_ru: "OPS принял, что вы продолжаете полёт до назначения, и просит запросить у УВД приоритет. Ответ не нужен."
        - rescue: { level: medical }
        - wait: { phase: ON_BLOCK }
        - send:
            header: OPS MSG MEDICAL
            body: |
              PARAMEDICS AT AIRCRAFT DOOR
              {ops.gate_place}
              PATIENT DEPLANES FIRST
            hint: "Paramedics are waiting at the aircraft door; the patient leaves the aircraft before the other passengers. No reply needed."
            hint_ru: "Медики ждут у двери самолёта; пациент выходит раньше остальных пассажиров. Ответ не нужен."
