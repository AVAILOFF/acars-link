# Lithium battery fire of a passenger device in the cabin (T46), in cruise. Chance 0.5 % per
# flight (set by the user 2026-10-15; adjustable in the app like the other irregular events).
# The advice follows FAA SAFO 09013 (2009-06-23; still cited by the FAA in 2017): extinguish
# with water, Halon or a replacement, cool the cells with water, never use a fire-resistant
# burn bag. CONTINUE or DIVERT (default after 5 min: DIVERT, a cabin fire is not left alone);
# DIVERT goes to the nearest suitable airport of the OFP or a reserve one (T50).
id: ped_fire_cabin
version: 1
category: irregular
title: Lithium battery fire in the cabin
title_ru: "Возгорание литиевой батареи в салоне"
description: "In cruise the cabin crew report a battery fire in a passenger device. Advice per FAA SAFO 09013. Reply CONTINUE or DIVERT (default DIVERT after 5 min)."
description_ru: "В крейсере бортпроводники сообщают о возгорании батареи пассажирского устройства. Рекомендации по FAA SAFO 09013. Ответ CONTINUE или DIVERT (через 5 мин — DIVERT)."
hint: "OPS: the cabin reports a fire of a lithium battery in a passenger's personal electronic device (PED), with the seat, and how to fight it: water or halon, cool the cells with water, no fire-containment bag. Tell OPS whether you continue or divert."
hint_ru: "OPS: бортпроводники сообщают о возгорании литиевой батареи в личном электронном устройстве пассажира (PED), указано место, и как тушить: водой или галоном, охлаждать элементы водой, без огнестойкого мешка. Сообщите OPS, продолжаете ли вы полёт или уходите на запасной."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
  # A random moment of the cruise (T51): from 10 min in to 20 min before the top of descent.
  window: { after_min: 10, before_tod_min: 20 }
conditions:
  - "flight.minutes_to_tod != null"
  - "flight.minutes_to_tod >= 20"
  - "flight.divert == null"
probability: 0.005
excludes: [medical_onboard, unruly_passenger]
steps:
  - send:
      header: OPS MSG FIRE
      body: |
        CABIN REPORTS FIRE
        PED LITHIUM BATTERY
        SEAT {seat}
        USE WATER OR HALON
        COOL CELLS WITH WATER
        NO BURN BAG
        REPLY CONTINUE
        OR DIVERT
  - wait:
      reply:
        options: [CONTINUE, DIVERT]
        timeout_min: 5
        default: DIVERT
        reply_hints:
          CONTINUE: "The fire is out; continue to the destination."
          DIVERT: "Divert to the nearest suitable airport, or to another airport named after the word (DIVERT EDDM)."
        reply_hints_ru:
          CONTINUE: "Огонь потушен, продолжать полёт до назначения."
          DIVERT: "Уйти на ближайший подходящий аэропорт или на другой, названный после слова (DIVERT EDDM)."
  - branch:
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:flight.nearest_any}" }
        - send:
            header: OPS MSG FIRE
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              ROGER DIVERT
              {flight.divert|or:NEAREST SUITABLE}
              ~{flight.divert_nm} NM FROM PRESENT POS
              FIRE SERVICE ORDERED
              SEND NEW ETA WHEN ABLE
            hint: "OPS confirms the diversion and its distance and has ordered the fire service there. Send your new ETA as a free-text telex when you can."
            hint_ru: "OPS подтверждает диверсию и расстояние, заказал туда пожарную службу. Сообщите новое ETA telex свободным текстом, когда сможете."
        - rescue: { level: full }
        - wait: { phase: ON_BLOCK }
        - send:
            header: OPS MSG FIRE
            body: |
              FIRE SERVICE AT
              AIRCRAFT DOOR
              DEVICE HANDED OVER
            hint: "The fire service meets you at the aircraft door and takes the device. No reply needed."
            hint_ru: "Пожарные встречают у двери самолёта и забирают устройство. Ответ не нужен."
      CONTINUE:
        - send:
            header: OPS MSG FIRE
            body: |
              NOTED CONTINUE
              TO {ofp.dest}
              MONITOR CABIN
              ADVISE IF FIRE
              RESTARTS
            hint: "OPS notes that you continue to the destination. Keep watching the cabin and tell OPS if the fire starts again. No reply needed."
            hint_ru: "OPS принял, что вы продолжаете полёт до назначения. Следите за салоном и сообщите OPS, если огонь возобновится. Ответ не нужен."
        - rescue: { level: full }
        - wait: { phase: ON_BLOCK }
        - send:
            header: OPS MSG FIRE
            body: |
              FIRE SERVICE AT
              AIRCRAFT DOOR
              DEVICE HANDED OVER
            hint: "The fire service meets you at the aircraft door and takes the device. No reply needed."
            hint_ru: "Пожарные встречают у двери самолёта и забирают устройство. Ответ не нужен."
