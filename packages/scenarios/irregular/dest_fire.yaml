# Fire on or near the destination airport: smoke over the field, advice to prepare a diversion,
# an update every 20 minutes (T50) until it is under control, 20 min to 2 h after the message.
# The fire is at a random point beside the planned runway, up to 0.8 NM along it from the middle and
# 0.1-0.3 NM off its axis (approved by the user 2026-10-16). Conditions are real: the planned runway (OFP) and the wind of the destination
# METAR (live, else the OFP one) for the direction the smoke drifts to.
id: dest_fire
version: 1
category: irregular
title: Fire at destination airport
title_ru: "Пожар в аэропорту назначения"
description: "About 120 NM out: fire on or near the destination airport (random point beside the planned runway), smoke drifting downwind, under control in 20 min to 2 h, with an update every 20 min. HOLD (default) or DIVERT to the alternate."
description_ru: "Примерно за 120 NM: пожар на территории аэропорта назначения или рядом (случайная точка у плановой ВПП), дым сносит по ветру, потушат за 20 мин – 2 ч, обновления каждые 20 мин. HOLD (по умолчанию) — ожидание или DIVERT — на запасной."
hint: "OPS of the destination: a fire on or near the airport, smoke drifting with the wind and poor visibility in it, rescue services on scene. There is no estimate yet: prepare the diversion to your alternate and tell OPS whether you hold or divert."
hint_ru: "OPS аэропорта назначения: пожар на территории аэропорта или рядом, дым сносит ветром, в нём плохая видимость, аварийные службы на месте. Оценки пока нет: подготовьте уход на запасной и сообщите OPS, будете ли вы ждать в зоне ожидания или уходите."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: dest, lte_nm: 120 }
conditions:
  - "phase in ['CRUISE','DESCENT']"
  - "flight.divert == null"
  - "ofp.dest_rwy != null"
  - "ofp.altn != null"
  - "wx.dest_smoke_drift != null"
probability: 0.02
excludes: [drone_activity, runway_closure_dest]
steps:
  - draw:
      - set: { run.hold_min: [20, 120] }
  # A smoke column in the simulator (T34) at a random point beside the runway; the bridge shows it
  # when we are near. Its place goes to run.fire_at for the text.
  - smoke: { start: dest, along_nm: 0.8, side_nm: [0.1, 0.3] }
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        FIRE REPORTED
        {run.fire_at}
        SMOKE DRIFTING {wx.dest_smoke_drift}, WIND {wx.dest_wind_from}/{wx.dest_wind_kt}KT
        VIS REDUCED IN SMOKE, RESCUE ON SCENE
        PREPARE DIVERSION {ofp.altn}
        NO ESTIMATE, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
        REPLY HOLD OR DIVERT
  - wait:
      reply:
        options: [HOLD, DIVERT]
        timeout_min: 8
        default: HOLD
        reply_hints:
          HOLD: "Hold and wait for the airport; OPS updates you at the time given."
          DIVERT: "Divert to the alternate, or to another airport named after the word (DIVERT EDDM)."
        reply_hints_ru:
          HOLD: "Ждать в зоне ожидания; OPS сообщит новости к указанному времени."
          DIVERT: "Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM)."
  - branch:
      HOLD:
        # The XATC station gives the holding clearance and a new time at every update (T48, T50);
        # null below ends it.
        - set: { flight.hold: 20 }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
              ADVISE IF FUEL BECOMES CRITICAL
            hint: "OPS notes that you hold; the next update comes at the time given. Tell OPS in a free-text telex if your fuel becomes critical."
            hint_ru: "OPS принял, что вы ждёте; следующее обновление — к указанному времени. Если топливо станет критическим, сообщите OPS telex свободным текстом."
        - loop:
            until: "loop.min >= run.hold_min"
            stop: "flight.divert != null or phase in ['LANDED','TAXI_IN','ON_BLOCK']"
            every_min: 20
            steps:
              - wait:
                  reply:
                    options: [HOLD, DIVERT]
                    timeout_round: true
                    default: HOLD
                    reply_hints:
                      HOLD: "Keep holding and wait for the next update."
                      DIVERT: "Divert to the alternate, or to another airport named after the word (DIVERT EDDM)."
                    reply_hints_ru:
                      HOLD: "Продолжать ожидание до следующего обновления."
                      DIVERT: "Уйти на запасной или на другой аэропорт, названный после слова (DIVERT EDDM)."
              - branch:
                  # The update comes when the round ends; the pilot's own HOLD only confirms.
                  HOLD:
                    - if: "reply.timeout"
                      steps:
                        - set: { flight.hold: 20 }
                        - send:
                            header: OPS MSG {ofp.dest}
                            body: |
                              FIRE {run.fire_at}
                              STILL BURNING
                              NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
                              REPLY HOLD OR DIVERT
                            hint: "Update from OPS of the destination: the fire is still burning. Tell OPS whether you keep holding or divert."
                            hint_ru: "Обновление от OPS аэропорта назначения: пожар продолжается. Сообщите OPS, продолжаете ли вы ожидание или уходите на запасной."
                  DIVERT:
                    - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
                    - send:
                        header: OPS MSG {ofp.dest}
                        body: |
                          ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
                          DIVERT {flight.divert} NOTED
                          ~{flight.divert_nm} NM FROM PRESENT POS
                          HANDLING AND FUEL ORDERED
                          SEND ETA WHEN ABLE
                        hint: "OPS notes your diversion and its distance and has ordered handling and fuel there. Send your ETA as a free-text telex when you can."
                        hint_ru: "OPS принял вашу диверсию и расстояние до аэропорта, заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете."
                    - break: true
        - set: { flight.hold: null }
        - branch:
            MET:
              - send:
                  header: OPS MSG {ofp.dest}
                  body: |
                    FIRE {run.fire_at}
                    UNDER CONTROL
                    ARRIVALS RESUMED AT {ofp.dest}
                    EXPECT NORMAL APPROACH
                  hint: "The fire is under control and arrivals at the destination have resumed: expect a normal approach. No reply needed."
                  hint_ru: "Пожар под контролем, приём рейсов в аэропорту назначения возобновлён: ожидайте обычного захода. Ответ не нужен."
              - smoke: stop
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              DIVERT {flight.divert} NOTED
              ~{flight.divert_nm} NM FROM PRESENT POS
              HANDLING AND FUEL ORDERED
              SEND ETA WHEN ABLE
            hint: "OPS notes your diversion and its distance and has ordered handling and fuel there. Send your ETA as a free-text telex when you can."
            hint_ru: "OPS принял вашу диверсию и расстояние до аэропорта, заказал туда хендлинг и топливо. Сообщите ETA telex свободным текстом, когда сможете."
