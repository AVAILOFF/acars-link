# Fire on or near the destination airport: smoke over the field, advice to prepare a diversion,
# an update every 20 minutes (T50) until it is under control, 20 min to 2 h after the message.
# The fire is at a random point beside the planned runway, up to 0.8 NM along it from the middle and
# 0.1-0.3 NM off its axis (approved by the user 2026-10-16). Conditions are real: the planned runway (OFP) and the wind of the destination
# METAR (live, else the OFP one) for the direction the smoke drifts to.
id: dest_fire
version: 1
category: irregular
title: Fire at destination airport
title_ru: "Пожар в аэропорту назначения"
description: "About 120 NM out: fire on or near the destination airport (random point beside the planned runway), smoke drifting downwind, under control in 20 min to 2 h, with an update every 20 min. HOLD (default) or DIVERT to the alternate."
description_ru: "Примерно за 120 NM: пожар на территории аэропорта назначения или рядом (случайная точка у плановой ВПП), дым сносит по ветру, потушат за 20 мин – 2 ч, обновления каждые 20 мин. HOLD (по умолчанию) — ожидание или DIVERT — на запасной."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: dest, lte_nm: 120 }
conditions:
  - "phase in ['CRUISE','DESCENT']"
  - "flight.divert == null"
  - "ofp.dest_rwy != null"
  - "ofp.altn != null"
  - "wx.dest_smoke_drift != null"
probability: 0.02
excludes: [drone_activity, runway_closure_dest]
steps:
  - draw:
      - set: { run.hold_min: [20, 120] }
  # A smoke column in the simulator (T34) at a random point beside the runway; the bridge shows it
  # when we are near. Its place goes to run.fire_at for the text.
  - smoke: { start: dest, along_nm: 0.8, side_nm: [0.1, 0.3] }
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        FIRE REPORTED
        {run.fire_at}
        SMOKE DRIFTING {wx.dest_smoke_drift}, WIND {wx.dest_wind_from}/{wx.dest_wind_kt}KT
        VIS REDUCED IN SMOKE, RESCUE ON SCENE
        PREPARE DIVERSION {ofp.altn}
        NO ESTIMATE, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
        REPLY HOLD OR DIVERT
  - wait:
      reply: { options: [HOLD, DIVERT], timeout_min: 8, default: HOLD }
  - branch:
      HOLD:
        # The ROPS station gives the holding clearance and a new time at every update (T48, T50);
        # null below ends it.
        - set: { flight.hold: 20 }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
              ADVISE IF FUEL BECOMES CRITICAL
        - loop:
            until: "loop.min >= run.hold_min"
            stop: "flight.divert != null or phase in ['LANDED','TAXI_IN','ON_BLOCK']"
            every_min: 20
            steps:
              - wait:
                  reply: { options: [HOLD, DIVERT], timeout_round: true, default: HOLD }
              - branch:
                  # The update comes when the round ends; the pilot's own HOLD only confirms.
                  HOLD:
                    - if: "reply.timeout"
                      steps:
                        - set: { flight.hold: 20 }
                        - send:
                            header: OPS MSG {ofp.dest}
                            body: |
                              FIRE {run.fire_at}
                              STILL BURNING
                              NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
                              REPLY HOLD OR DIVERT
                  DIVERT:
                    - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
                    - send:
                        header: OPS MSG {ofp.dest}
                        body: |
                          ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
                          DIVERT {flight.divert} NOTED
                          ~{flight.divert_nm} NM FROM PRESENT POS
                          HANDLING AND FUEL ORDERED
                          SEND ETA WHEN ABLE
                    - break: true
        - set: { flight.hold: null }
        - branch:
            MET:
              - send:
                  header: OPS MSG {ofp.dest}
                  body: |
                    FIRE {run.fire_at}
                    UNDER CONTROL
                    ARRIVALS RESUMED AT {ofp.dest}
                    EXPECT NORMAL APPROACH
              - smoke: stop
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              DIVERT {flight.divert} NOTED
              ~{flight.divert_nm} NM FROM PRESENT POS
              HANDLING AND FUEL ORDERED
              SEND ETA WHEN ABLE
