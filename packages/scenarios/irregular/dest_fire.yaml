# Fire near the destination runway: smoke over the field, advice to prepare a diversion, an
# update after about 20 minutes. Conditions are real: the planned runway (OFP) and the wind of
# the destination METAR (live, else the OFP one) for the direction the smoke drifts to.
id: dest_fire
version: 1
category: irregular
title: Fire near destination runway
title_ru: "Пожар у ВПП назначения"
description: "About 120 NM out: fire near the planned runway, smoke drifting downwind. HOLD (default) or DIVERT to the alternate."
description_ru: "Примерно за 120 NM: пожар у плановой ВПП, дым сносит по ветру. HOLD (по умолчанию) — ожидание или DIVERT — на запасной."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: dest, lte_nm: 120 }
conditions:
  - "phase in ['CRUISE','DESCENT']"
  - "flight.divert == null"
  - "ofp.dest_rwy != null"
  - "ofp.altn != null"
  - "wx.dest_smoke_drift != null"
probability: 0.02
excludes: [drone_activity, runway_closure_dest]
steps:
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        FIRE REPORTED NEAR RWY {ofp.dest_rwy}
        SMOKE DRIFTING {wx.dest_smoke_drift}, WIND {wx.dest_wind_from}/{wx.dest_wind_kt}KT
        VIS REDUCED IN SMOKE, RESCUE ON SCENE
        PREPARE DIVERSION {ofp.altn}
        UPDATE IN 20 MIN, REPLY HOLD OR DIVERT
  # A smoke column at the runway in the simulator (T34); the bridge shows it when we are near.
  - smoke: start
  - wait:
      reply: { options: [HOLD, DIVERT], timeout_min: 8, default: HOLD }
  - branch:
      HOLD:
        # The ROPS station gives the holding clearance (T48); null below ends it.
        - set: { flight.hold: 20 }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, EXPECT 20 MIN HOLDING
              ADVISE IF FUEL BECOMES CRITICAL
        - wait: { until: "phase in ['LANDED','TAXI_IN','ON_BLOCK']", timeout_min: 20 }
        - set: { flight.hold: null }
        - branch:
            TIMEOUT:
              - send:
                  header: OPS MSG {ofp.dest}
                  body: |
                    FIRE NEAR RWY {ofp.dest_rwy} UNDER CONTROL
                    ARRIVALS RESUMED AT {ofp.dest}
                    EXPECT NORMAL APPROACH
              - smoke: stop
      DIVERT:
        - set: { flight.divert: "{ofp.altn}" }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              DIVERT {ofp.altn} NOTED
              HANDLING AND FUEL ORDERED
              SEND ETA WHEN ABLE
