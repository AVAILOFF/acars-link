# Dangerous goods on board: NOTOC before departure, the captain acknowledges.
id: dg_notoc
version: 1
category: irregular
title: Dangerous goods (NOTOC)
title_ru: "Опасный груз (NOTOC)"
description: "Before departure: dangerous goods on board, UN number, class, position. Reply ACK for the captain signature."
description_ru: "Перед вылетом: опасный груз на борту — номер ООН, класс, позиция. Ответ ACK — подпись КВС."
hint: "NOTOC (notification to captain): dangerous goods are loaded, with the UN number, class, hold position and number of packages; CAO NO means they are allowed on passenger aircraft. Acknowledge with ACK, which counts as the captain's signature."
hint_ru: "NOTOC (уведомление командиру): на борту опасные грузы — номер ООН (UN), класс, место в багажном отсеке и число мест; CAO NO значит, что их можно возить на пассажирском самолёте. Подтвердите ответом ACK — он заменяет подпись командира."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -30 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
probability: 0.06
steps:
  - send:
      header: NOTOC
      body: |
        DANGEROUS GOODS ON BOARD
        {pick:[UN3481 LI-ION IN EQUIPMENT CL 9 SEC I IMP RLI,UN3481 LI-ION IN EQUIPMENT CL 9 SEC II IMP ELI,UN1845 DRY ICE CL 9 NET 25 KG,UN1845 DRY ICE CL 9 NET 50 KG,UN1845 DRY ICE CL 9 NET 100 KG,UN1266 PERFUMERY CL 3,UN2814 INFECTIOUS SUBST CL 6.2]}
        POS {hold} PKG {rand:2-12}
        CAO NO
        REPLY ACK FOR CAPT SIGNATURE
  - wait:
      reply:
        options: [ACK]
        timeout_min: 10
        default: ACK
        reply_hints:
          ACK: "You have read the NOTOC; this counts as your signature."
        reply_hints_ru:
          ACK: "Вы прочитали NOTOC; это считается вашей подписью."
  - send:
      header: NOTOC
      body: |
        NOTOC ACK RECEIVED
        COPY IN FLIGHT FOLDER
        LOADING SUPERVISOR INFORMED
      hint: "Load control received your acknowledgement: a copy goes into the flight folder and the loading supervisor knows. No reply needed."
      hint_ru: "Служба загрузки получила подтверждение: копия — в полётную папку, руководитель загрузки в курсе. Ответ не нужен."
