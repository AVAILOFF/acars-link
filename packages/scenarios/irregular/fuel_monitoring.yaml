# Fuel against the plan (T46): in cruise the fuel on board is compared with the OFP's planned
# fuel on board at the same place of the route (navlog `fuel_plan_onboard`, interpolated by the
# distance flown). More than 5 % of the plan or 500 kg below (the larger; thresholds set by the
# user 2026-10-15) -> dispatch asks for the reason. Once per flight. No plan in the OFP or no
# telemetry - nothing is sent. The advice is generic: no numbers except the data.
id: fuel_monitoring
version: 1
category: irregular
title: Fuel below plan
description: "In cruise, if the fuel on board is below the OFP plan at that place by more than 5 % (at least 500 kg), dispatch asks for the reason: WX, ATC, LEAK or NORMAL."
hint: "Dispatch sees that your fuel on board is below the flight plan figure for this point, by the amount given. It asks for the reason."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
conditions:
  - "flight.divert == null"
steps:
  - wait:
      until: "phase == 'CRUISE' && flight.fuel_below_plan_kg != null && flight.fuel_below_plan_kg > flight.fuel_plan_tol_kg"
      timeout_min: 720
  - branch:
      MET:
        - send:
            header: DISPATCH
            body: |
              FUEL BELOW PLAN
              FOB {tm.fuel_kg} KG
              {flight.fuel_below_plan_kg} KG LESS
              THAN PLANNED HERE
              REPLY REASON
              WX ATC LEAK NORMAL
        - wait:
            reply:
              id: reply
              options: [WX, ATC, LEAK, NORMAL]
              timeout_min: 15
              default: NORMAL
              reply_hints:
                WX: "Weather: deviations, wind, icing."
                ATC: "ATC: routing, levels or holding other than planned."
                LEAK: "You suspect a fuel leak."
                NORMAL: "Nothing abnormal, the difference is expected."
        - branch:
            WX:
              - send:
                  id: wx
                  header: DISPATCH
                  body: |
                    NOTED WX
                    RECHECK FUEL AT {ofp.dest}
                    AND {ofp.altn}
                    ADVISE IF BELOW REQ
                  hint: "Dispatch notes the weather as the reason and asks you to recheck the fuel at the destination and the alternate; tell dispatch by free-text telex if it is below the required minimum. No reply needed."
            ATC:
              - send:
                  id: atc
                  header: DISPATCH
                  body: |
                    NOTED ATC
                    REQUEST DIRECT OR
                    BETTER LEVEL
                    ADVISE IF BELOW REQ
                  hint: "Dispatch notes ATC as the reason and suggests asking ATC for a direct routing or a better level; tell dispatch by free-text telex if the fuel is below the required minimum. No reply needed."
            LEAK:
              - send:
                  id: leak
                  header: DISPATCH
                  body: |
                    FUEL LEAK SUSPECTED
                    CHECK FUEL SYSTEM
                    NEAREST ALTN
                    {flight.nearest_altn|or:NONE}
                    {flight.nearest_altn_nm|or:-} NM
                    DIVERT IF CONFIRMED
                  hint: "Dispatch suspects a fuel leak: check the fuel system. It gives the nearest alternate and its distance; divert if the leak is confirmed. No reply needed."
            NORMAL:
              - send:
                  id: normal
                  header: DISPATCH
                  body: |
                    NOTED
                    MONITOR FUEL
                    ADVISE IF DEVIATION
                    INCREASES
                  hint: "Dispatch notes it. Keep watching the fuel and tell dispatch if the difference grows. No reply needed."
