# A long delay eats the crew's duty time. EXTEND (commander's discretion) leaves a note for
# the next flight (discretion_followup). Crew control reacts as soon as the delay is known
# (late start or a pilot DELAY during boarding).
id: crew_duty_limit
version: 1
category: irregular
title: Crew duty time at the limit
title_ru: "Рабочее время экипажа на пределе"
description: "At the gate after a delay of 30 min or more: latest off-block time. EXTEND (commander discretion) leaves a note for the next flight; NO (default): standby crew."
description_ru: "На стоянке при задержке 30 мин и больше: последнее допустимое время отхода. EXTEND (продление по решению КВС) оставляет запись для следующего рейса; NO (по умолчанию) — резервный экипаж."
hint: "Crew control: the delay eats into the flight duty period (FDP), the time the crew may be on duty. The message gives the latest off-block time; later than that the commander would have to extend the duty at his or her discretion. Answer whether you will."
hint_ru: "Служба планирования экипажей: задержка съедает рабочее время экипажа (FDP — сколько экипажу можно быть на работе). В сообщении — самое позднее время ухода со стоянки; позже него командиру пришлось бы продлить рабочее время своим решением (commander's discretion). Ответьте, готовы ли вы."
enabled_by_default: true
trigger:
  on: phase
  phase: BOARDING
conditions:
  - "flight.delay_min >= 30"
probability: 0.6
steps:
  - send:
      header: CREW CONTROL
      body: |
        DELAY {flight.delay_min} MIN AFFECTS FDP
        LATEST OFF BLOCK {irr.latest_out|hhmm}Z
        EST OFF BLOCK {ofp.est_out|hhmm}Z
        CAPT DISCRETION MAY BE REQUIRED
        REPLY EXTEND OR NO
  - wait:
      reply:
        options: [EXTEND, NO]
        timeout_min: 10
        default: NO
        reply_hints:
          EXTEND: "The commander will use discretion and extend the duty if needed."
          NO: "The duty will not be extended."
        reply_hints_ru:
          EXTEND: "Командир при необходимости продлит рабочее время своим решением."
          NO: "Рабочее время продлеваться не будет."
  - branch:
      EXTEND:
        - set: { flags.crew_discretion: "{ofp.callsign}", flags.crew_discretion_date: "{flight.date}" }
        - send:
            header: CREW CONTROL
            body: |
              COMMANDER DISCRETION LOGGED
              FILE DISCRETION REPORT
              EXTENDED REST BEFORE NEXT DUTY
            hint: "Crew control has logged the commander's discretion. File a discretion report; the crew gets extended rest before the next duty. No reply needed."
            hint_ru: "Служба экипажей зафиксировала решение командира. Оформите отчёт о продлении (discretion report); перед следующей сменой экипаж получит увеличенный отдых. Ответ не нужен."
      NO:
        - send:
            header: CREW CONTROL
            body: |
              NOTED, STANDBY CREW ALERTED
              IF NOT OFF BLOCK BY {irr.latest_out|hhmm}Z
              CREW CHANGE WILL APPLY
            hint: "Crew control has alerted a standby crew: if you are not off block by the latest time, the crew will be changed. No reply needed."
            hint_ru: "Служба экипажей подняла резервный экипаж: если вы не уйдёте со стоянки к крайнему времени, экипаж заменят. Ответ не нужен."
        - wait: { until: "flight.out != null or flight.now >= irr.latest_out", timeout_min: 240 }
        # "if": still no OUT (false for a second of flight time = TIMEOUT).
        - wait: { until: "flight.out == null", timeout_min: 0.02 }
        - branch:
            MET:
              - send:
                  header: CREW CONTROL
                  body: |
                    LATEST OFF BLOCK {irr.latest_out|hhmm}Z PASSED
                    CREW CHANGE ORDERED
                    NEW CREW REPORTS {irr.crew_ready|hhmm}Z
                    EXPECT DELAY {irr.crew_change_min} MIN
                  hint: "The latest off-block time has passed: a crew change is ordered, with the time the new crew reports and the delay to expect. No reply needed."
                  hint_ru: "Крайнее время ухода со стоянки прошло: заказана смена экипажа — когда прибудет новый экипаж и какую задержку ожидать. Ответ не нужен."
