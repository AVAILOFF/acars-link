# Disruptive passenger. RESTRAIN or DIVERT leave a note for the next flight
# (unruly_followup: the passenger is on the no-fly list); CONTINUE clears it.
id: unruly_passenger
version: 1
category: irregular
title: Disruptive passenger
description: "In cruise the crew reports a disruptive passenger. RESTRAIN: police at arrival; DIVERT: nearest airport; CONTINUE (default): monitor. RESTRAIN and DIVERT leave a note for the next flight."
hint: "OPS security: the cabin crew report a disruptive passenger, with the seat and what happened; the crew has given a formal warning. Tell OPS what you do: restrain the passenger, divert or continue."
enabled_by_default: true
# T89: passengers in the cabin; not on cargo, ferry, business or air ambulance flights.
operations: [sched_pax, charter_pax]
trigger:
  on: phase
  phase: CRUISE
  # A random moment of the cruise (T51): from 10 min in to 30 min before the top of descent.
  window: { after_min: 10, before_tod_min: 30 }
conditions:
  - "flight.minutes_to_tod != null"
  - "flight.minutes_to_tod >= 30"
probability: 0.03
excludes: [medical_onboard]
steps:
  - set:
      flags.unruly_seat: "{seat}"
      flags.unruly_flight: "{ofp.callsign}"
      flags.unruly_date: "{flight.date}"
  - send:
      header: OPS MSG SECURITY
      body: |
        CABIN REPORTS DISRUPTIVE PAX
        SEAT {flags.unruly_seat} {pick:[INTOXICATED,AGGRESSIVE TO CREW,SMOKING IN LAV]}
        CREW ISSUED FORMAL WARNING
        REPLY RESTRAIN, DIVERT OR CONTINUE
  - wait:
      reply:
        id: reply
        options: [RESTRAIN, DIVERT, CONTINUE]
        timeout_min: 10
        default: CONTINUE
        reply_hints:
          RESTRAIN: "The crew restrains the passenger and you continue."
          DIVERT: "Divert to the nearest suitable airport, or to another airport named after the word (DIVERT EDDM)."
          CONTINUE: "Continue; the crew keeps watching the passenger."
  - branch:
      RESTRAIN:
        - send:
            id: restrain
            header: OPS MSG SECURITY
            body: |
              RESTRAINT NOTED
              POLICE WILL MEET ACFT AT {ofp.dest}
              DO NOT OPEN DOORS BEFORE POLICE
              FILE CABIN INCIDENT REPORT
            hint: "OPS notes the restraint: police will meet the aircraft at the destination. Do not open the doors before the police arrive and file a cabin incident report. No reply needed."
        - wait: { phase: ON_BLOCK }
        - send:
            id: restrain_2
            header: OPS MSG SECURITY
            body: |
              POLICE AT AIRCRAFT DOOR
              PAX SEAT {flags.unruly_seat}
              HOLD OTHER PAX UNTIL POLICE BOARD
            hint: "Police are at the aircraft door for the passenger of the seat given. Keep the other passengers seated until the police have boarded. No reply needed."
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:flight.nearest_altn}" }
        - send:
            id: divert
            header: OPS MSG SECURITY
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              DIVERT {flight.divert|or:NEAREST SUITABLE} NOTED
              POLICE AND HANDLING ORDERED
              FILE CABIN INCIDENT REPORT
            hint: "OPS notes your diversion; police and handling are ordered there. File a cabin incident report. No reply needed."
      CONTINUE:
        - set: { flags.unruly_seat: null, flags.unruly_flight: null, flags.unruly_date: null }
        - send:
            id: continue
            header: OPS MSG SECURITY
            body: |
              NOTED, CREW TO MONITOR
              ADVISE IF SITUATION CHANGES
            hint: "OPS notes that you continue and the crew keeps watching the passenger. Tell OPS if the situation changes. No reply needed."
