# Outcome of short_connection: on block 15-40 min before the connection's STD, the flight is held.
id: connection_held
version: 1
category: irregular
title: Connection held
description: "On block after a short connection with 15 to 40 min left: the onward flight is held for the passengers."
hint: "Connections: the onward flight of your transfer passengers is held for them and will leave late. A transfer bus waits at your gate; let the transfer passengers deplane first. No reply needed."
enabled_by_default: true
# T89: passengers in the cabin; not on cargo, ferry, business or air ambulance flights.
operations: [sched_pax, charter_pax]
trigger:
  on: phase_enter
  phase: ON_BLOCK
conditions:
  - "'short_connection' in flight.sent"
  - "irr.connect_left_min >= 15"
  - "irr.connect_left_min < 40"
steps:
  - send:
      header: CONNECTIONS
      body: |
        {irr.connect_flight} HELD FOR {irr.connect_pax} PAX
        STD {irr.connect_std|hhmm}Z, DEPARTURE WILL BE LATE
        TRANSFER BUS AT {ops.gate_place}
        DEPLANE TRANSFER PAX FIRST
        {irr.connect_src}
