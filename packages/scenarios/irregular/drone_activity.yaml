# Drone sighting at the destination: arrivals stopped, hold or divert. The airline does not know
# how long it lasts (T50): 30 min to 3 h drawn at the start, an update every 20 min until it ends.
id: drone_activity
version: 1
category: irregular
title: Drone activity at destination
description: "About 90 NM out: arrivals suspended because of a drone for 30 min to 3 h, with an update every 20 min. HOLD (default) or DIVERT to the alternate."
hint: "OPS of the destination: a drone is reported near the airport and arrivals are suspended, with no estimate yet. Tell OPS whether you hold or divert to the alternate."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: dest, lte_nm: 90 }
conditions:
  - "phase in ['CRUISE','DESCENT']"
  - "flight.divert == null"
  - "ofp.altn != null"
probability: 0.03
excludes: [runway_closure_dest]
steps:
  - draw:
      - set: { run.hold_min: [30, 180] }
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        DRONE ACTIVITY REPORTED
        ARRIVALS SUSPENDED AT {ofp.dest}
        NO ESTIMATE, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
        REPLY HOLD OR DIVERT
  - wait:
      reply:
        id: reply
        options: [HOLD, DIVERT]
        timeout_min: 8
        default: HOLD
        reply_hints:
          HOLD: "Hold and wait for the airport; OPS updates you at the time given."
          DIVERT: "Divert to the alternate, or to another airport named after the word (DIVERT EDDM)."
  - branch:
      HOLD:
        # The XATC station gives the holding clearance and a new time at every update (T48, T50);
        # null below ends it.
        - set: { flight.hold: 20 }
        - send:
            id: hold
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
              ADVISE IF FUEL BECOMES CRITICAL
            hint: "OPS notes that you hold; the next update comes at the time given. Tell OPS by free-text telex if your fuel becomes critical."
        - loop:
            until: "loop.min >= run.hold_min"
            stop: "flight.divert != null or phase in ['LANDED','TAXI_IN','ON_BLOCK']"
            every_min: 20
            steps:
              - wait:
                  reply:
                    id: reply_2
                    options: [HOLD, DIVERT]
                    timeout_round: true
                    default: HOLD
                    reply_hints:
                      HOLD: "Keep holding and wait for the next update."
                      DIVERT: "Divert to the alternate, or to another airport named after the word (DIVERT EDDM)."
              - branch:
                  # The update comes when the round ends; the pilot's own HOLD only confirms.
                  HOLD:
                    - if: "reply.timeout"
                      steps:
                        - set: { flight.hold: 20 }
                        - send:
                            id: hold_2
                            header: OPS MSG {ofp.dest}
                            body: |
                              ARRIVALS STILL SUSPENDED AT {ofp.dest}
                              NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
                              REPLY HOLD OR DIVERT
                            hint: "Update from OPS of the destination: arrivals are still suspended. Tell OPS whether you keep holding or divert."
                  DIVERT:
                    - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
                    - send:
                        id: divert
                        header: OPS MSG {ofp.dest}
                        body: |
                          ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
                          DIVERT {flight.divert} NOTED
                          ~{flight.divert_nm} NM FROM PRESENT POS
                          ~HANDLING ORDERED, PAX INFO SENT{flight.if_pax}
                          ~HANDLING ORDERED{flight.if_no_pax}
                        hint: "OPS notes your diversion and its distance; handling is ordered there and the passenger information is sent. No reply needed."
                    - break: true
        - set: { flight.hold: null }
        - branch:
            MET:
              - send:
                  id: met
                  header: OPS MSG {ofp.dest}
                  body: |
                    ARRIVALS RESUMED AT {ofp.dest}
                    DRONE ACTIVITY CLEARED
                    EXPECT NORMAL APPROACH
                  hint: "The drone activity is over and arrivals at the destination have resumed: expect a normal approach. No reply needed."
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
        - send:
            id: divert_2
            header: OPS MSG {ofp.dest}
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              DIVERT {flight.divert} NOTED
              ~{flight.divert_nm} NM FROM PRESENT POS
              ~HANDLING ORDERED, PAX INFO SENT{flight.if_pax}
              ~HANDLING ORDERED{flight.if_no_pax}
            hint: "OPS notes your diversion and its distance; handling is ordered there and the passenger information is sent. No reply needed."
