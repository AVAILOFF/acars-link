# Drone sighting at the destination: arrivals stopped, hold or divert.
id: drone_activity
version: 1
category: irregular
title: Drone activity at destination
title_ru: "Дрон у аэропорта назначения"
description: "About 90 NM out: arrivals suspended because of a drone. HOLD (default) or DIVERT to the alternate."
description_ru: "Примерно за 90 NM: прилёты приостановлены из-за дрона. HOLD (по умолчанию) или DIVERT — на запасной."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: dest, lte_nm: 90 }
conditions:
  - "phase in ['CRUISE','DESCENT']"
  - "flight.divert == null"
  - "ofp.altn != null"
probability: 0.03
excludes: [runway_closure_dest]
steps:
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        DRONE ACTIVITY REPORTED
        ARRIVALS SUSPENDED AT {ofp.dest}
        EXPECT HOLDING 15 MIN
        REPLY HOLD OR DIVERT
  - wait:
      reply: { options: [HOLD, DIVERT], timeout_min: 8, default: HOLD }
  - branch:
      HOLD:
        # The ROPS station gives the holding clearance (T48); null below ends it.
        - set: { flight.hold: 15 }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, UPDATE WHEN ARRIVALS RESUME
              ADVISE IF FUEL BECOMES CRITICAL
        - wait: { until: "phase in ['LANDED','TAXI_IN','ON_BLOCK']", timeout_min: 15 }
        - set: { flight.hold: null }
        - branch:
            TIMEOUT:
              - send:
                  header: OPS MSG {ofp.dest}
                  body: |
                    ARRIVALS RESUMED AT {ofp.dest}
                    DRONE ACTIVITY CLEARED
                    EXPECT NORMAL APPROACH
      DIVERT:
        - set: { flight.divert: "{ofp.altn}" }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              DIVERT {ofp.altn} NOTED
              HANDLING ORDERED, PAX INFO SENT
