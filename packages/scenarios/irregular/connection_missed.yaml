# Outcome of short_connection: too late for the connection.
id: connection_missed
version: 1
category: irregular
title: Connection missed
description: "On block after a short connection with less than 15 min left: passengers rebooked."
hint: "Connections: the onward flight is closed, your transfer passengers have been rebooked and the transfer desk will meet them. No reply needed."
enabled_by_default: true
# T89/T91: transfer passengers of a scheduled flight; a charter has no connections.
operations: [sched_pax]
trigger:
  on: phase_enter
  phase: ON_BLOCK
conditions:
  - "'short_connection' in flight.sent"
  - "irr.connect_left_min < 15"
steps:
  - send:
      header: CONNECTIONS
      body: |
        {irr.connect_flight} CLOSED
        {irr.connect_pax} PAX REBOOKED
        TRANSFER DESK WILL MEET PAX
        {irr.connect_src}
