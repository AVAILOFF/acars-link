# A system fault in cruise. CONFIRM defers it under the MEL and leaves it open on this
# aircraft (flags): mel_carry_over brings it up on the next flight with the same registration.
id: tech_defect_mel
version: 1
category: irregular
title: Technical defect and MEL
description: "In cruise maintenance reports a system fault. CONFIRM defers it under the MEL and keeps it open on this aircraft; NEGATIVE (default) closes it as a spurious message."
hint: "Maintenance control: the aircraft's maintenance system (CMS) reports a fault, with its MEL item. It asks whether the crew sees the same indication on the crew alerting system."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
  # A random moment of the cruise (T51): from 10 min in to 30 min before the top of descent.
  window: { after_min: 10, before_tod_min: 30 }
conditions:
  - "flags.mel_reg == null"
  - "flight.minutes_to_tod != null"
  - "flight.minutes_to_tod >= 30"
probability: 0.04
steps:
  # By the aircraft family (T42): items of the FAA MMEL, repair category C. "If" idiom:
  # wait/until with a tiny timeout, MET = the condition holds. Other types: generic items.
  - wait: { until: "aircraft.family == 'A320'", timeout_min: 0.02 }
  - branch:
      MET:
        - set:
            flags.mel_item: "{pick:[49-10-01 APU INOP - GPU AND ASU AT DEST,30-42-01 ONE WINDOW HEAT COMPUTER INOP - NO ICING OPS,21-51-01 PACK FLOW CTL VALVE SECURED CLOSED - PACK INOP]}"
      TIMEOUT:
        - wait: { until: "aircraft.family == 'B737'", timeout_min: 0.02 }
        - branch:
            MET:
              - set:
                  flags.mel_item: "{pick:[49-01-01A APU INOP - GPU AND ASU AT DEST,21-01-01 ONE PACK INOP - MAX FL250,30-01-02 ONE WING A/I VALVE INOP - NO ICING OPS]}"
            TIMEOUT:
              - set:
                  flags.mel_item: "{pick:[21-52-01 PACK 2 INOP,36-11-02 ENG 2 BLEED VALVE,30-42-01 R WINDSHIELD HEAT,34-11-03 ADR 3 FAULT,49-11-01 APU INOP]}"
  - send:
      header: MAINT CONTROL
      body: |
        CMS REPORTS FAULT
        {flags.mel_item}
        CONFIRM INDICATION ON {aircraft.alert_sys|or:CREW ALERTING}
        REPLY CONFIRM OR NEGATIVE
  - wait:
      reply:
        id: reply
        options: [CONFIRM, NEGATIVE]
        timeout_min: 15
        default: NEGATIVE
        reply_hints:
          CONFIRM: "Yes, the crew sees the fault indicated."
          NEGATIVE: "No, there is no such indication in the cockpit."
  - branch:
      CONFIRM:
        - set:
            flags.mel_reg: "{ofp.ac_reg}"
            flags.mel_date: "{flight.date}"
        - send:
            id: confirm
            header: MAINT CONTROL
            body: |
              ENTER DEFECT IN TECH LOG
              MEL {flags.mel_item}
              DEFERRED CAT C
              MX WILL MEET ACFT AT {ofp.dest}
              DISPATCH NEXT SECTOR PER MEL
            hint: "Enter the defect in the technical log: it is deferred under the MEL (Minimum Equipment List), repair category C, and the aircraft flies the next sector by the MEL. Maintenance will meet the aircraft at the destination. No reply needed."
      NEGATIVE:
        - set: { flags.mel_item: null }
        - send:
            id: negative
            header: MAINT CONTROL
            body: |
              NOTED, SPURIOUS CMS MSG
              NO ACTION REQUIRED
            hint: "Maintenance takes it as a spurious maintenance-system message: no action required. No reply needed."
