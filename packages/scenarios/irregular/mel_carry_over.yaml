# The MEL item deferred on an earlier flight (tech_defect_mel) is still open on this aircraft;
# maintenance closes it after this flight's arrival.
id: mel_carry_over
version: 1
category: irregular
title: Open MEL item from an earlier flight
description: "Before a flight on the same aircraft: the deferred MEL item is still open. After arrival maintenance closes it."
hint: "MEL status of this aircraft: a defect deferred under the MEL (Minimum Equipment List) on an earlier flight is still open. Fly by the MEL operational procedure for it and check the performance and fuel penalty; maintenance has a slot for it at the destination. No reply needed."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -45 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "flags.mel_reg != null"
  - "flags.mel_reg == ofp.ac_reg"
  - "flags.mel_date != flight.date"
steps:
  - send:
      header: MEL STATUS {ofp.ac_reg}
      body: |
        OPEN ITEM SINCE {flags.mel_date|ddmmm}
        {flags.mel_item}
        CAT C, APPLY MEL OPS PROCEDURE
        REVIEW PERF AND FUEL PENALTY
        MX SLOT AT {ofp.dest} AFTER ARRIVAL
  - wait: { phase: ON_BLOCK }
  - send:
      id: mel_status
      header: MEL STATUS {ofp.ac_reg}
      body: |
        {flags.mel_item}
        RECTIFIED AT {ofp.dest}
        MEL ITEM CLOSED, TECH LOG SIGNED
      hint: "MEL status: maintenance has fixed the deferred defect at this airport, the MEL item is closed and signed off in the technical log. No reply needed."
  - set: { flags.mel_item: null, flags.mel_reg: null, flags.mel_date: null }
