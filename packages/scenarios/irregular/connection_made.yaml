# Outcome of short_connection: on block with at least 40 min before the connection's STD.
id: connection_made
version: 1
category: irregular
title: Connection made
description: "On block after a short connection with 40 min or more left: the onward flight waits."
hint: "Connections: the onward flight of your transfer passengers will wait for them; a transfer bus is at your gate. No reply needed."
enabled_by_default: true
# T89/T91: transfer passengers of a scheduled flight; a charter has no connections.
operations: [sched_pax]
trigger:
  on: phase_enter
  phase: ON_BLOCK
conditions:
  - "'short_connection' in flight.sent"
  - "irr.connect_left_min >= 40"
steps:
  - send:
      header: CONNECTIONS
      body: |
        {irr.connect_flight} WILL WAIT
        TRANSFER BUS AT {ops.gate_place}
        THANK YOU FOR THE EFFORT
        {irr.connect_src}
