# Fuel price difference: dispatch offers extra fuel when the landing weight allows it.
id: tankering
version: 1
category: irregular
title: Tankering offer
title_ru: "Танкеровка топлива"
description: "Before departure: fuel is expensive at the destination, extra fuel is offered if the landing weight allows. ACCEPT or DECLINE (default)."
description_ru: "Перед вылетом: топливо в пункте назначения дорогое, предлагается взять дополнительно, если позволяет посадочный вес. ACCEPT или DECLINE (по умолчанию)."
hint: "Fuel dispatch: fuel is expensive at the destination, so it recommends tankering: carrying extra fuel from here for the next sector. The message gives the extra fuel, the new block fuel and the estimated landing weight against the maximum. Tell dispatch whether you accept."
hint_ru: "Топливная служба: топливо в аэропорту назначения дорогое, поэтому она советует танкеровку — взять отсюда дополнительное топливо на следующий рейс. В сообщении — сколько добавить, новое топливо перед рулением и расчётная посадочная масса против максимальной. Сообщите, согласны ли вы."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -55 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "ofp.block_time_min <= 300"
  - "irr.tanker_ldw_kg != null"
  - "ofp.max_ldw_kg != null"
  - "irr.tanker_ldw_kg <= ofp.max_ldw_kg"
probability: 0.05
steps:
  - send:
      header: FUEL DISPATCH
      body: |
        FUEL PRICE AT {ofp.dest} HIGH
        TANKERING RECOMMENDED
        EXTRA {irr.tanker_kg} KG
        BLOCK FUEL {irr.tanker_block_kg|kg1} T
        EST LDW {irr.tanker_ldw_kg|kg1} MAX {ofp.max_ldw_kg|kg1}
        REPLY ACCEPT OR DECLINE
  - wait:
      reply:
        options: [ACCEPT, DECLINE]
        timeout_min: 15
        default: DECLINE
        reply_hints:
          ACCEPT: "Take the extra fuel."
          DECLINE: "Keep the planned fuel."
        reply_hints_ru:
          ACCEPT: "Взять дополнительное топливо."
          DECLINE: "Оставить топливо по плану."
  - branch:
      ACCEPT:
        - send:
            header: FUEL DISPATCH
            body: |
              TANKERING ACCEPTED
              FUELLER ADVISED {irr.tanker_block_kg|kg1} T
              LOADSHEET WILL FOLLOW
            hint: "Tankering accepted: the fueller is told the new block fuel and a loadsheet with it follows. No reply needed."
            hint_ru: "Танкеровка принята: заправщику передано новое топливо, следом придёт ведомость с ним. Ответ не нужен."
      DECLINE:
        - send:
            header: FUEL DISPATCH
            body: |
              NOTED, PLANNED FUEL UNCHANGED
              {ofp.fuel_ramp_kg|kg1} T
            hint: "Dispatch notes it: the planned fuel stays as in the flight plan. No reply needed."
            hint_ru: "Диспетчер авиакомпании принял: топливо остаётся по плану полёта. Ответ не нужен."
