# MAYDAY sent to the XATC station (DM56, T47): the station answers ROGER MAYDAY at once and
# the airline's emergency desk follows. It starts by hand only (the core forces it after the
# MAYDAY); probability 0 keeps it from starting on its own. DIVERT (default after 5 min) goes
# to the nearest suitable airport (T50: the OFP's, or a reserve one), and so reaches the XATC station (T48).
id: emergency_mayday
version: 1
category: irregular
title: MAYDAY declared
title_ru: "Объявлен MAYDAY"
description: "The crew declared MAYDAY to ATC through the XATC station. The airline emergency desk offers DIVERT to the nearest suitable airport (default DIVERT after 5 min) and alerts rescue and medical services there. Starts only after a MAYDAY to XATC."
description_ru: "Экипаж объявил MAYDAY станции XATC. Аварийный центр авиакомпании предлагает диверсию на ближайший подходящий аэропорт (через 5 мин — DIVERT) и поднимает пожарных и медиков. Запускается только после MAYDAY на станцию XATC."
hint: "The airline's emergency desk got your MAYDAY through ATC and gives the nearest suitable airport with its distance. Tell OPS whether you divert or continue."
hint_ru: "Аварийная группа авиакомпании получила ваш MAYDAY через УВД и называет ближайший подходящий аэропорт и расстояние до него. Сообщите OPS, уходите ли вы на него или продолжаете полёт."
enabled_by_default: true
trigger:
  on: phase
  phase: CRUISE
probability: 0
steps:
  - send:
      header: OPS MSG EMERGENCY
      body: |
        MAYDAY RCVD VIA ATC
        EMERGENCY DESK ACTIVATED
        NEAREST SUITABLE {flight.nearest_any|or:AIRPORT}
        {flight.nearest_any_nm} NM FROM PRESENT POS
        REPLY DIVERT OR CONTINUE
  - wait:
      reply:
        options: [DIVERT, CONTINUE]
        timeout_min: 5
        default: DIVERT
        reply_hints:
          DIVERT: "Divert to the nearest suitable airport, or to another airport named after the word (DIVERT EDDM)."
          CONTINUE: "Continue to the destination."
        reply_hints_ru:
          DIVERT: "Уйти на ближайший подходящий аэропорт или на другой, названный после слова (DIVERT EDDM)."
          CONTINUE: "Продолжать полёт до аэропорта назначения."
  - branch:
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:flight.nearest_any}" }
        - send:
            header: OPS MSG EMERGENCY
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              ROGER DIVERT {flight.divert|or:NEAREST SUITABLE}
              ~{flight.divert_nm} NM FROM PRESENT POS
              RESCUE AND FIRE SERVICES ALERTED
              MEDICAL AND HANDLING ORDERED
              SEND NEW ETA WHEN ABLE
            hint: "OPS confirms your diversion airport and its distance: rescue and fire services are alerted, medical help and handling ordered. Send your new ETA as a free-text telex when you can."
            hint_ru: "OPS подтверждает аэропорт диверсии и расстояние до него: аварийно-спасательная служба поднята, медпомощь и хендлинг заказаны. Сообщите новое ETA telex свободным текстом, когда сможете."
        - rescue: { level: full }
      CONTINUE:
        - send:
            header: OPS MSG EMERGENCY
            body: |
              ROGER CONTINUE TO {ofp.dest}
              RESCUE AND FIRE SERVICES ALERTED
              ADVISE IF PLAN CHANGES
            hint: "OPS notes that you continue to the destination; rescue and fire services there are alerted. Tell OPS if your plan changes. No reply needed."
            hint_ru: "OPS принял, что вы продолжаете полёт до назначения; аварийно-спасательная служба там поднята. Сообщите OPS, если план изменится. Ответ не нужен."
        - rescue: { level: full }
