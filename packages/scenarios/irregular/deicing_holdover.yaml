# Cold departure (METAR at the origin 3 C or colder, live or from the OFP): de-icing slot,
# fluid and holdover time once the crew reports READY.
id: deicing_holdover
version: 1
category: irregular
title: De-icing and holdover time
title_ru: "Противообледенительная обработка"
description: "At the gate when the origin is 3 C or colder: fluid type and pad. After READY: the de-icing truck and the holdover time."
description_ru: "На стоянке, если в аэропорту вылета 3 °C или холоднее: тип жидкости и площадка. После READY — машина обработки и holdover time."
hint: "De-icing is required at the origin because of the cold: the fluid type, the de-icing pad and the time to expect on it. Answer READY when the doors are closed."
hint_ru: "В аэропорту вылета нужна противообледенительная обработка из-за холода: тип жидкости, площадка и сколько ожидать на ней. Ответьте READY, когда двери закрыты."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -25 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "wx.orig_temp_c != null"
  - "wx.orig_temp_c <= 3"
probability: 0.6
steps:
  - set:
      flags.deice_pad: "{pick:[1,2,3,4]}"
      flags.deice_fluid: "{pick:[TYPE II,TYPE IV]}"
  - send:
      header: DEICING
      body: |
        DEICING REQUIRED AT {ofp.orig}
        OAT {wx.orig_temp_c} C
        {flags.deice_fluid} FLUID, PAD {flags.deice_pad}
        EXPECT {rand:10-20} MIN ON PAD
        REPLY READY WHEN DOORS CLOSED
  - wait:
      reply:
        options: [READY]
        timeout_min: 20
        default: READY
        reply_hints:
          READY: "Doors closed, you are ready for de-icing."
        reply_hints_ru:
          READY: "Двери закрыты, вы готовы к обработке."
  - send:
      header: DEICING
      body: |
        TRUCK ASSIGNED PAD {flags.deice_pad}
        {flags.deice_fluid} 75/25
        HOLDOVER {rand:20-45} MIN FROM START
        CHECK HOT TABLE BEFORE T/O
      hint: "The de-icing truck is assigned at your pad, with the fluid mix and the holdover time (how long the fluid protects the aircraft from new ice). Check the holdover time table before take-off. No reply needed."
      hint_ru: "На вашей площадке назначена машина обработки — смесь жидкости и время защитного действия (holdover: сколько жидкость защищает от нового льда). Перед взлётом сверьтесь с таблицей времени защитного действия. Ответ не нужен."
  - set: { flags.deice_pad: null, flags.deice_fluid: null }
