# Flight after commander's discretion (crew_duty_limit): extended rest, a reserve pilot.
id: discretion_followup
version: 1
category: irregular
title: Crew rest after discretion (next flight)
title_ru: "Отдых после продления (следующий рейс)"
description: "Before the next flight after commander discretion: extended rest, a reserve first officer joins."
description_ru: "Перед следующим рейсом после продления смены: увеличенный отдых, в экипаж вводится резервный второй пилот."
hint: "Crew control: after the commander's discretion (duty extended beyond the limit) on an earlier flight, the crew gets extended rest and a reserve first officer joins the crew. The briefing time is in the message. No reply needed."
hint_ru: "Служба планирования экипажей: после решения командира продлить рабочее время сверх лимита (commander's discretion) на прошлом рейсе экипаж получает увеличенный отдых, к нему присоединяется резервный второй пилот. Время брифинга — в сообщении. Ответ не нужен."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -60 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "flags.crew_discretion != null"
  - "flags.crew_discretion_date != flight.date"
steps:
  - send:
      header: CREW CONTROL
      body: |
        AFTER DISCRETION ON {flags.crew_discretion}
        EXTENDED REST APPLIED
        RESERVE FO {name:crew} JOINS CREW
        BRIEFING AT GATE 40 MIN BEFORE STD
  - set: { flags.crew_discretion: null, flags.crew_discretion_date: null }
