# Bags left behind at the origin (missed transfer): PIR at the destination; the next flight
# gets the case closure (rush_bags_followup).
id: lost_baggage
version: 1
category: irregular
title: Bags left behind
title_ru: "Багаж не долетел"
description: "On block: bags left at the origin (missed transfer), PIR desk at the belt. The next flight gets the case closure."
description_ru: "На стоянке: часть багажа осталась в аэропорту вылета (не успели при трансфере), стойка розыска у ленты. Следующий рейс получит закрытие дела."
hint: "Baggage: some bags were not loaded at the origin (missed transfer). The passengers report them at the baggage desk (PIR, Property Irregularity Report) at the belt; the bags follow on the next service. No reply needed."
hint_ru: "Багаж: часть сумок не погрузили в аэропорту вылета (не успели при пересадке). Пассажиры оформляют их на стойке розыска (PIR, Property Irregularity Report) у ленты; сумки прилетят следующим рейсом. Ответ не нужен."
enabled_by_default: true
trigger:
  on: phase_enter
  phase: ON_BLOCK
conditions:
  - "flight.divert == null"
probability: 0.05
steps:
  - set:
      flags.rush_bags: "{irr.lost_bags}"
      flags.rush_from: "{ofp.orig}"
      flags.rush_to: "{ofp.dest}"
      flags.rush_date: "{flight.date}"
  - send:
      header: BAGGAGE
      body: |
        {irr.lost_bags} BAGS NOT LOADED AT {ofp.orig}
        MISSED TRANSFER
        PIR DESK AT BELT {ops.belt}
        BAGS FWD ON NEXT SERVICE
