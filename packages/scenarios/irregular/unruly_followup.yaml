# Next flight after a restrained or offloaded disruptive passenger (flags of unruly_passenger).
id: unruly_followup
version: 1
category: irregular
title: Disruptive passenger follow-up (next flight)
title_ru: "Дебошир: итог (следующий рейс)"
description: "Before the next flight: the passenger from the earlier flight is on the company no-fly list."
description_ru: "Перед следующим рейсом: пассажир с прошлого рейса внесён в чёрный список авиакомпании."
hint: "Security information: the disruptive passenger of an earlier flight is now on the company no-fly list and a police report is filed. No action required."
hint_ru: "Информация безопасности: дебошир с прошлого рейса внесён в список лиц, которым авиакомпания отказывает в перевозке, в полицию подано заявление. Действий не требуется."
enabled_by_default: true
trigger:
  on: time
  at: { rel: sched_out, offset_min: -50 }
conditions:
  - "phase in ['PREFLIGHT','BOARDING']"
  - "flags.unruly_flight != null"
steps:
  - send:
      header: SECURITY INFO
      body: |
        PAX OF {flags.unruly_flight} {flags.unruly_date|ddmmm}
        SEAT {flags.unruly_seat} PLACED ON
        COMPANY NO-FLY LIST
        POLICE REPORT FILED, NO ACTION REQ
  - set: { flags.unruly_seat: null, flags.unruly_flight: null, flags.unruly_date: null }
