# Planned destination runway closed during the descent: hold or divert to the alternate. How long
# it stays closed depends on the reason and is drawn at the start (T50): inspections 30-60 min, a
# disabled aircraft 60-180 min or, in 3 of 10 such cases, until further notice. An update every
# 20 min; closed until further notice sends the aircraft to the alternate at the first update.
id: runway_closure_dest
version: 1
category: irregular
title: Destination runway closed
description: "At the start of the descent the planned runway is closed (30 min to 3 h, rarely until further notice), with an update every 20 min. HOLD (default) or DIVERT to the alternate."
hint: "OPS of the destination: your planned runway is closed (the reason is in the message), with no estimate yet. Check your fuel and tell OPS whether you hold or divert to the alternate."
enabled_by_default: true
trigger:
  on: phase_enter
  phase: DESCENT
conditions:
  - "flight.divert == null"
  - "ofp.dest_rwy != null"
  - "ofp.altn != null"
probability: 0.04
excludes: [drone_activity]
steps:
  - draw:
      - weight: 10
        set: { run.reason: FOD INSPECTION, run.hold_min: [30, 60], run.ufn: false }
      - weight: 10
        set: { run.reason: BIRD STRIKE CHECK, run.hold_min: [30, 60], run.ufn: false }
      - weight: 7
        set: { run.reason: DISABLED ACFT, run.hold_min: [60, 180], run.ufn: false }
      - weight: 3
        set: { run.reason: DISABLED ACFT, run.hold_min: null, run.ufn: true }
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        RWY {ofp.dest_rwy} CLOSED
        {run.reason}
        NO ESTIMATE, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
        CHECK FUEL, REPLY HOLD OR DIVERT
  - wait:
      reply:
        id: reply
        options: [HOLD, DIVERT]
        timeout_min: 8
        default: HOLD
        reply_hints:
          HOLD: "Hold and wait for the runway; OPS updates you at the time given."
          DIVERT: "Divert to the alternate, or to another airport named after the word (DIVERT EDDM)."
  - branch:
      HOLD:
        # The XATC station gives the holding clearance and a new time at every update (T48, T50);
        # null below ends it.
        - set: { flight.hold: 20 }
        - send:
            id: hold
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
              STAND AND HANDLING UNCHANGED
            hint: "OPS notes that you hold; your stand and handling stay as planned and the next update comes at the time given."
        - loop:
            until: "loop.min >= run.hold_min"
            stop: "flight.divert != null or phase in ['LANDED','TAXI_IN','ON_BLOCK']"
            every_min: 20
            steps:
              - wait:
                  reply:
                    id: reply_2
                    options: [HOLD, DIVERT]
                    timeout_round: true
                    default: HOLD
                    reply_hints:
                      HOLD: "Keep holding and wait for the next update."
                      DIVERT: "Divert to the alternate, or to another airport named after the word (DIVERT EDDM)."
              - branch:
                  # The update comes when the round ends; the pilot's own HOLD only confirms.
                  HOLD:
                    # Closed until further notice: nothing to wait for, divert at the first update.
                    - if: "run.ufn and reply.timeout"
                      steps:
                        - set: { flight.divert: "{ofp.altn}" }
                        - send:
                            id: hold_2
                            header: OPS MSG {ofp.dest}
                            body: |
                              {ofp.dest} AD CLSD UFN
                              DIVERT {ofp.altn}
                              HANDLING AND FUEL ORDERED
                            hint: "OPS: the destination aerodrome is closed until further notice (UFN), so you divert to the alternate; handling and fuel are ordered there. No reply needed."
                        - break: true
                    - if: "reply.timeout"
                      steps:
                        - set: { flight.hold: 20 }
                        - send:
                            id: hold_3
                            header: OPS MSG {ofp.dest}
                            body: |
                              RWY {ofp.dest_rwy} STILL CLOSED
                              ARRIVALS STILL SUSPENDED, NEXT UPDATE {flight.now|plusmin:20|hhmm}Z
                              REPLY HOLD OR DIVERT
                            hint: "Update from OPS of the destination: the runway is still closed and arrivals suspended. Tell OPS whether you keep holding or divert."
                  DIVERT:
                    - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
                    - send:
                        id: divert
                        header: OPS MSG {ofp.dest}
                        body: |
                          ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
                          DIVERT {flight.divert} NOTED
                          ~{flight.divert_nm} NM FROM PRESENT POS
                          HANDLING AND FUEL ORDERED
                          SEND ETA WHEN ABLE
                        hint: "OPS notes your diversion and its distance and has ordered handling and fuel there. Send your ETA by free-text telex when you can."
                    - break: true
        - set: { flight.hold: null }
        - branch:
            MET:
              - send:
                  id: met
                  header: OPS MSG {ofp.dest}
                  body: |
                    RWY {ofp.dest_rwy} REOPENED
                    ARRIVALS RESUMED AT {ofp.dest}
                    EXPECT NORMAL APPROACH
                  hint: "The runway has reopened and arrivals at the destination have resumed: expect a normal approach. No reply needed."
      DIVERT:
        - set: { flight.divert: "{reply.icao|else:ofp.altn}" }
        - send:
            id: divert_2
            header: OPS MSG {ofp.dest}
            body: |
              ~{reply.unknown} UNKNOWN, DIVERT {flight.divert}
              DIVERT {flight.divert} NOTED
              ~{flight.divert_nm} NM FROM PRESENT POS
              HANDLING AND FUEL ORDERED
              SEND ETA WHEN ABLE
            hint: "OPS notes your diversion and its distance and has ordered handling and fuel there. Send your ETA by free-text telex when you can."
