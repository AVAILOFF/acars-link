# Planned destination runway closed during the descent: hold or divert to the alternate.
id: runway_closure_dest
version: 1
category: irregular
title: Destination runway closed
title_ru: "Закрыта ВПП назначения"
description: "At the start of the descent the planned runway is closed. HOLD (default) or DIVERT to the alternate."
description_ru: "В начале снижения плановая ВПП закрыта. HOLD (по умолчанию) — ожидание или DIVERT — на запасной."
enabled_by_default: true
trigger:
  on: phase_enter
  phase: DESCENT
conditions:
  - "flight.divert == null"
  - "ofp.dest_rwy != null"
  - "ofp.altn != null"
probability: 0.04
excludes: [drone_activity]
steps:
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        RWY {ofp.dest_rwy} CLOSED
        {pick:[FOD INSPECTION,DISABLED ACFT,BIRD STRIKE CHECK]}
        EXPECT OTHER RWY OR HOLDING
        CHECK FUEL, REPLY HOLD OR DIVERT
  - wait:
      reply: { options: [HOLD, DIVERT], timeout_min: 8, default: HOLD }
  - branch:
      HOLD:
        # The ROPS station gives the holding clearance (T48); null below ends it.
        - set: { flight.hold: 15 }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              NOTED, EXPECT 15 MIN HOLDING
              STAND AND HANDLING UNCHANGED
        - wait: { until: "phase in ['LANDED','TAXI_IN','ON_BLOCK']", timeout_min: 15 }
        - set: { flight.hold: null }
        - branch:
            TIMEOUT:
              - send:
                  header: OPS MSG {ofp.dest}
                  body: |
                    RWY {ofp.dest_rwy} REOPENED
                    ARRIVALS RESUMED AT {ofp.dest}
                    EXPECT NORMAL APPROACH
      DIVERT:
        - set: { flight.divert: "{ofp.altn}" }
        - send:
            header: OPS MSG {ofp.dest}
            body: |
              DIVERT {ofp.altn} NOTED
              HANDLING AND FUEL ORDERED
              SEND ETA WHEN ABLE
