# The alternate's weather turns bad on the way: dispatch asks about the fuel.
id: altn_wx_deterioration
version: 1
category: irregular
title: Alternate weather deteriorating
description: "Before TOD the alternate weather turns bad. OK (default) or LOW: the nearest airport and its distance."
hint: "Dispatch: the weather at your alternate is getting worse (the reason is in the message). Consider an en-route alternate or more fuel, and tell dispatch your fuel state."
enabled_by_default: true
trigger:
  on: distance
  dist: { to: tod, lte_nm: 250 }
conditions:
  - "phase in ['CLIMB','CRUISE']"
  - "ofp.altn != null"
  - "flight.divert == null"
probability: 0.04
steps:
  - send:
      header: DISPATCH
      body: |
        ALTN {ofp.altn} WX DETERIORATING
        {pick:[TS FCST AT ETA,VIS BLW MINIMA FCST,STRONG XWIND FCST]}
        CONSIDER ENRT ALTN OR ADDL FUEL
        REPLY OK OR LOW FUEL STATE
  - wait:
      reply:
        id: reply
        options: [OK, LOW]
        timeout_min: 10
        default: OK
        reply_hints:
          OK: "Your fuel is enough for the situation."
          LOW: "Your fuel is low for the situation."
  - branch:
      OK:
        - send:
            id: ok
            header: DISPATCH
            body: |
              NOTED, MONITOR {ofp.altn} WX
              UPDATE WILL FOLLOW BEFORE TOD
            hint: "Dispatch notes that your fuel is fine and keeps watching the alternate weather; an update follows before the top of descent. No reply needed."
        - wait: { until: "flight.dist_to_tod_nm < 40", timeout_min: 90 }
        # Live METAR of the alternate or none: the second wait is an "if" (the condition is
        # checked at once; false for a second of flight time = TIMEOUT).
        - wait: { until: "wx.altn_live == true", timeout_min: 0.02 }
        - branch:
            MET:
              - send:
                  id: met
                  header: DISPATCH
                  body: |
                    ALTN {ofp.altn} WX UPDATE
                    {wx.altn_metar}
                    ADVISE IF FUEL REQUIRES ACTION
                  hint: "Alternate weather update from dispatch before the top of descent. Tell dispatch by free-text telex if your fuel requires action."
            TIMEOUT:
              - send:
                  id: timeout
                  header: DISPATCH
                  body: |
                    ALTN {ofp.altn} WX UPDATE
                    NO NEW OBSERVATION RECEIVED
                    CHECK ALTN WX WITH ATIS OR VOLMET
                    ADVISE IF FUEL REQUIRES ACTION
                  hint: "Alternate weather update from dispatch before the top of descent. Tell dispatch by free-text telex if your fuel requires action."
      LOW:
        - send:
            id: low
            header: DISPATCH
            body: |
              NEAREST ALTN {flight.nearest_altn|or:NONE}
              {flight.nearest_altn_nm|or:-} NM FROM PRESENT POS
              DECLARE MIN FUEL IF REQUIRED
            hint: "Dispatch gives the nearest alternate and its distance from your present position. Declare minimum fuel to ATC if required. No reply needed."
