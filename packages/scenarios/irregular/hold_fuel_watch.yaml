# A holding the airline announced (drone, runway closed, fire) has used the fuel up to the
# diversion minimum (T50): alternate burn plus reserve of the OFP, plus 10 %. Without a fuel
# reading the plan's margin for the holding (extra + contingency) is the measure.
id: hold_fuel_watch
version: 1
category: irregular
title: Minimum diversion fuel in holding
description: "While holding for an airline-announced closure the fuel comes down to the diversion minimum: DIVERT is recommended (reply STAY to stay in the holding), and without an answer in 5 min the flight is sent to the alternate."
hint: "OPS of the destination: while you hold, your fuel has come down to the minimum for the diversion to the alternate. OPS recommends diverting now and asks whether you divert or stay in holding."
enabled_by_default: true
# Any distance: the scenario starts the moment its conditions turn true.
trigger:
  on: distance
  dist: { to: dest, gte_nm: 0 }
conditions:
  - "flight.holding == true"
  - "flight.hold_fuel_low == true"
  - "flight.divert == null"
  - "ofp.altn != null"
# STAY, not HOLD: the answer HOLD of the closure scenarios would take it (the oldest question gets
# the word first). A diversion made meanwhile by anyone ends the question.
steps:
  - send:
      header: OPS MSG {ofp.dest}
      body: |
        MIN DIVERSION FUEL
        RECOMMEND DIVERT {ofp.altn}
        REPLY DIVERT OR STAY
  - loop:
      until: "flight.divert != null"
      steps:
        - wait:
            reply:
              id: reply
              options: [DIVERT, STAY]
              timeout_min: 5
              default: DIVERT
              reply_hints:
                DIVERT: "Divert to the alternate now."
                STAY: "Stay in holding; captain's decision."
        - branch:
            DIVERT:
              - set: { flight.divert: "{ofp.altn}" }
              - send:
                  id: divert
                  header: OPS MSG {ofp.dest}
                  body: |
                    DIVERT {ofp.altn} NOTED
                    HANDLING AND FUEL ORDERED
                    SEND ETA WHEN ABLE
                  hint: "OPS notes your diversion to the alternate and has ordered handling and fuel there. Send your ETA by free-text telex when you can."
              - break: true
            STAY:
              - send:
                  id: stay
                  header: OPS MSG {ofp.dest}
                  body: |
                    HOLD NOTED, CAPTAIN DECISION
                    ADVISE FUEL STATE
                  hint: "OPS notes that you stay in holding by the captain's decision and asks for your fuel state by free-text telex."
              - break: true
