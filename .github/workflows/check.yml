# T63: the same checks as before "done" locally (CLAUDE.md): pnpm check and pnpm bridge:test.
# Windows only: the bridge and the file paths are Windows. Without the MSFS SDK the bridge
# builds with SimConnect support OFF (AcarsBridge.csproj), which the bridge tests allow.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm bridge:test
